[grid]
nx = 512
ny = 512
nz = 512
lx = 1.0
ly = 1.0
lz = 1.0

[grid.x]
distribution = uniform
stretch = 0.0

[grid.y]
distribution = uniform
stretch = 0.0

[grid.z]
distribution = uniform
stretch = 0.0

[mpi]
dims = 0 0 0

[flow]
re = 100.0
forcing_x = 1.0
forcing_y = 0.0
forcing_z = 0.0

[time]
dt = 1.0e-4
nsteps = 20
cflmax = 0.0
dtmax = 1.0e-3

[pressure]
niter = 3
sor = 1.5

[ibm]
enabled = true

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

y_min_p_type = neumann
y_max_p_type = neumann

[output]
field_interval = 0
field_prefix = field
