[grid]
nx = 40          ; number of points in the streamwise direction
ny = 40          ; number of points in the wall-normal direction
nz = 40          ; number of points in the spanwise direction
lx = 1.0
ly = 1.0
lz = 1.0

[grid.x]
distribution = uniform

[grid.y]
distribution = tanh ; use tanh/cosine and stretch > 0 for nonuniform grids
stretch = 1.5

[grid.z]
distribution = uniform

[flow]
re = 100.0
forcing_x = 1.0
forcing_y = 0.0
forcing_z = 0.0

[time]
dt = 1.0e-4
nsteps = 100
t_final = 1.0e-2
cflmax = 0
pecletmax = 0.5
dtmax = 1.0e-4

[pressure]
niter = 10          ; red-black SOR iterations

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

y_max_p_type = neumann
y_max_p_type = neumann

[output]
field_interval = 100 ; use >0 to write full staggered fields in HDF5
field_prefix = field
