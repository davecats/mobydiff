[grid]
nx = 8
ny = 8
nz = 8
lx = 1.0
ly = 1.0
lz = 1.0

[flow]
re = 100.0
forcing_x = 1.0
forcing_y = 0.0
forcing_z = 0.0

[time]
dt = 1.0e-4
