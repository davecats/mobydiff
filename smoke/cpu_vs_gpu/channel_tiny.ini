[case]
name = channel

[case.channel]
n_walls = 2
stats_interval = 4
stats_file = channel_stats_compare.h5
natural_blend_index = 40
large_disturbance_amplitude = 1.0e-2
small_noise_amplitude = 1.0e-3

[grid]
nx = 8
ny = 8
nz = 8
lx = 2.0
lz = 2.0

[flow]
re = 100.0

[time]
dt = 1.0e-4
nsteps = 4
t_final = 4.0e-4
cflmax = 0.0
pecletmax = 0.5
dtmax = 1.0e-4

[pressure]
niter = 3
sor = 1.5

[output]
field_interval = 4
field_prefix = channel_field
