[grid]
nx = 100          ; number of points in the streamwise direction
ny = 100          ; number of points in the wall-normal direction
nz = 4           ; number of points in the spanwise direction
lx = 10.0
ly = 1.0
lz = 1.0

[flow]
re = 100.0
forcing_x = 0.0
forcing_y = 0.0
forcing_z = 0.0

[time]
dt = 1.0e-4       ; use 1.0e-3 for no-IBM runs if desired
nsteps = 10000
t_final = 1.0
cflmax = 0.25
pecletmax = 0.5
dtmax = 1.0e-2

[pressure]
niter = 6         ; red-black SOR iterations

[boundary]
periodic_x = false
periodic_y = false
periodic_z = true

x_min_p_type = neumann
x_min_u_value = 1.0
x_max_u_type = neumann
x_max_v_type = neumann
x_max_w_type = neumann
x_max_p_type = dirichlet

y_max_p_type = neumann
y_max_p_type = neumann



[output]
interval = 1000       ; use 0 to disable VTK output
prefix = data
field_interval = 1000 ; use >0 to write full staggered fields in HDF5
field_prefix = field
