[case]
name = boundaryLayer

; DNS of the ../apg.RANS layer (PLAN.md): the ../smooth ZPG DNS (CaNS grid,
; trip, CONS convection, red-black 6) with its top outlet under the pressure
; table ptop.txt (= ../apg.RANS/ptop.txt, found in RANS for beta = +0.5) times
; 1.087 = 1/r, r = beta_DNS/beta_RANS ~ 0.92 of the ZPG pair
; (../apg.RANS/assets/beta_ratio_zpg.txt), aiming at beta_DNS = 0.5 on
; x = 200 .. 550. The RANS twin of that scaled table is rans_check/.
;
; The span is TWICE the ZPG one (Lz = 52, nz = 272, same dz): Lz/delta99 of
; the APG layer falls to 1.4 at x = 550 in the ZPG box (PLAN.md section 1.2).
; The trip keeps the ZPG forcing spectrum on the wider box: its spanwise
; signal is a Fourier series in 2 pi/Lz, so nmodes 16 -> 32 (the same
; wavenumber band, twice the mode density) and amp 0.18854 -> 0.18854 sqrt(2)
; (the same rms amp/sqrt(nmodes) = 0.047, the same spectral density).
;
; Start field: the ZPG DNS field at t = 15 500 (step 775 000) tiled twice in z
; with a 1e-3 perturbation on the second copy (assets/tile_restart.py ->
; start_field.h5). Statistics from the first step; the window is chosen
; afterwards from the chunk-end copies of the cumulative file (PLAN.md 3.3).
; The chunk driver horeka/submit_apgdns.sh sets nsteps, the restart file and
; field_interval per chunk.

[grid]
nx = 3200
ny = 384
nz = 272
lx = 650.0
ly = 100.0
lz = 52.0
[grid.x]
distribution = uniform
[grid.y]
distribution = cans
stretch = 2.822
[grid.z]
distribution = uniform

[blocks]
; 8 blocks (4 in x, 2 in y, the whole span), one per A100
nb = 800 192 272

[flow]
re = 450.0
convection = divergence

[time]
dt = 1.0e-3
nsteps = 12500
cflmax = 0.8
pecletmax = 0.5
dtmax = 0.02

[pressure]
niter = 6
sor = 1.5
solver = redblack

[case.boundaryLayer]
trip_amp = 0.26664
trip_amp_s = 0.0
trip_x0 = 10.0
trip_lx = 4.0
trip_ly = 1.0
trip_ts = 4.0
trip_nmodes = 32
stats_sample_interval = 25
stats_write_interval = 12500
runtime_interval = 1000
runtime_file = apg_runtime.txt
stats_file = apg_stats.h5

[boundary]
; the top outlet's pressure is the table ptop.txt (x, p_top), linearly
; interpolated, times y_max_p_value (docs/configuration.md "_table")
y_max_p_profile = table
y_max_p_value = 1.087
y_max_p_table = ptop.txt

[restart]
file = start_field.h5

[output]
field_interval = 0
field_prefix = apg
