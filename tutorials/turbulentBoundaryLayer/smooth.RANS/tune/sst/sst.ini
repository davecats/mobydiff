[case]
name = boundaryLayer

; 2D wall-resolved RANS of the ../smooth DNS: k-omega SST + gamma-Re_thetat
; transition (Langtry-Menter 2009). Same domain (650 x 100 delta*_in), same
; Re_delta*,in = 450, same boundary conditions (Blasius inlet, no-slip plate,
; outlets at x = 650 and on the top), same cans y-stretching as the DNS. The
; flow is spanwise uniform: nz = 4 only because a block needs 4 cells (dz is
; large on purpose: it does not enter the Courant/Peclet sums).
;
; STAGE 1, the coarse grid from scratch (800 x 192, every 4th DNS x node and
; every 2nd DNS y node; first cell centre y+ < 0.3): t = 0 -> 1600, steady
; from t ~ 1400. Its final field is interpolated onto the production grid
; (assets/postpro/interp_restart.py) and is the grid-convergence check.

[grid]
nx = 800
ny = 192
nz = 4
lx = 650.0
ly = 100.0
lz = 26.0

[grid.x]
distribution = uniform
[grid.y]
distribution = cans
stretch = 2.822
[grid.z]
distribution = uniform

[blocks]
nb = 100 192 4

[flow]
re = 450.0
convection = divergence

[time]
dt = 1.0e-3
nsteps = 1000000
t_final = 1600.0
cflmax = 1.0
pecletmax = 0.5
dtmax = 0.2

[pressure]
niter = 6
sor = 1.5
solver = redblack

[turbulence]
model = rans

; Laminar -> trip -> turbulent, the RANS analogue of the DNS trip:
;  - the DNS freestream is laminar: Tu = 1 % with nut_inf = nu, HELD by the
;    ambient sustaining sources so it neither decays nor grows along the plate
;    (k_inf = 1.5e-4 U^2; it sets Re_thetat ~ 584 in the free stream, and the
;    transition model alone would then keep the layer laminar to Re_theta ~ 350);
;  - kpin_box: k = 0 over x < 10 (the DNS trip centre) through the layer and
;    well above it (y < 20): exactly laminar (Blasius) upstream of the trip;
;  - ktrip_box: a k source of 0.002 U^3/delta*_in per unit volume in
;    x = 10..15, y < 2 (inside delta_99 ~ 3) -- where the DNS forcing acts.
;    The transition model then takes the injected turbulence: gamma grows to
;    1 in the layer, the layer is turbulent from x ~ 20.
;    Weaker sources (5e-4, 1e-3) relaminarize the layer (local Re_theta
;    200..280 is below the model's Re_thetac); 2e-3 is the smallest tested
;    rate that holds (README "Trip calibration").
[rans]
model = sst
transition = false
tu = 1.0
nut_ratio = 1.0
ambient_sustain = true
kpin_box = -1.0 10.0 -1.0 20.0 -1.0 30.0
ktrip_box = 10.0 15.0 -1.0 2.0 -1.0 30.0 0.002

[case.boundaryLayer]
trip_enabled = false
runtime_interval = 1000
runtime_file = sst_runtime.txt

[output]
field_interval = 10000
field_prefix = sst
