[case]
name = boundaryLayer

; ZPG turbulent boundary layer -- PHASE 2 (statistics accumulation). See
; production.ini for the case (the shipped "finey" configuration) and README.md
; for the reproduce recipe.
;
; Restart from the last phase-1 field (production_100000.h5 = restart step +
; 50000) and accumulate span+time statistics into production_stats.h5 over 200000
; steps ~ 4000 t.u. (~8 flow-throughs). The stats accumulators CONTINUE seamlessly
; if production_stats.h5 already exists (so the window can be extended by rerunning
; from a later field). Post-process with assets/postpro (reproduce_figures.py).

[grid]
nx = 4096
ny = 224
nz = 192
lx = 750.0
ly = 100.0
lz = 32.0

[grid.x]
distribution = geometric
stretch = 1.5
[grid.z]
distribution = uniform

[flow]
re = 450.0
convection = skew

[time]
dt = 1.0e-3
nsteps = 200000
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 0.02

[pressure]
niter = 6
sor = 1.5
solver = redblack

[case.boundaryLayer]
; CaNS-exact trip (see production.ini), CaNS/AMPHIBIOUS production values.
trip_amp = 0.18854
trip_amp_s = 0.0
trip_x0 = 10.0
trip_lx = 4.0
trip_ly = 1.0
trip_ts = 4.0
trip_nmodes = 16
resolved_height = 36.0
dyw_plus = 0.221
stats_sample_interval = 50
stats_write_interval = 2000
runtime_interval = 1000
runtime_file = production_stats_runtime.txt
stats_file = production_stats.h5

[restart]
file = production_100000.h5

[output]
field_interval = 50000
field_prefix = production_p2
