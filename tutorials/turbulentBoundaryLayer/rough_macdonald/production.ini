[case]
name = boundaryLayer

; PHASE 1 (rough): one flow-through (750 t.u., 37500 steps at the binding
; dtmax) to let the developed SMOOTH layer adjust to the roughness; no
; statistics. Restart from the end of the smooth phase 1
; (../smooth/production.ini -> ../smooth/production_175000.h5); the immersed
; roughness is switched on by [ibm] below. -> production_212500.h5.
; Identical to production_stats.ini apart from the statistics and output.

[grid]
nx = 3200
ny = 384
nz = 136
lx = 650.0
ly = 100.0
lz = 26.0
[grid.x]
distribution = uniform
[grid.y]
distribution = cans
stretch = 2.822
[grid.z]
distribution = uniform
[flow]
re = 450.0
convection = divergence
[time]
dt = 1.0e-3
nsteps = 37500
cflmax = 1.0
pecletmax = 0.5
dtmax = 0.02
[pressure]
niter = 6
sor = 1.5
solver = redblack
[case.boundaryLayer]
trip_amp = 0.18854
trip_amp_s = 0.0
trip_x0 = 10.0
trip_lx = 4.0
trip_ly = 1.0
trip_ts = 4.0
trip_nmodes = 16
stats_sample_interval = -1
stats_write_interval = -1
runtime_interval = 1000
runtime_file = production_runtime.txt

[ibm]
enabled = true
wall_shape = eggcarton
amp_x = 0.38348082595870
wall_offset = 0.38348082595870
n_wave_x = 150
n_wave_z = 6
phase_x = 1.5707963267948966
phase_z = 1.5707963267948966
wall_x_start = 120.0
wall_ramp = 40.0

[restart]
file = ../smooth/production_175000.h5

[output]
field_interval = 37500
field_prefix = production
