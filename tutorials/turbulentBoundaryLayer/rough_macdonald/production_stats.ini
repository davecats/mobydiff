[case]
name = boundaryLayer

; PHASE 2 (rough): statistics, 1250 t.u. (62500 steps at the binding dtmax),
; sampled every 25 steps -> production_stats.h5. The smooth case of
; ../smooth (same domain, grid, trip, CONS convection, red-black 6) plus an
; immersed egg-carton roughness after MacDonald, Chan, Chung, Hutchins & Ooi
; (JFM 804, 2016): z_w = k cos(2 pi x/lambda) cos(2 pi z/lambda), k/lambda =
; 10/113, lambda = 650/150 = 26/6, k = 0.38348 (crests at 2k, troughs on the
; domain wall y = 0, mean plane at y = k). The roughness grows in over
; x = 120..160 and runs THROUGH the outlet plane. See README.md.
; Restart from the end of phase 1 (production.ini).

[grid]
nx = 3200
ny = 384
nz = 136
lx = 650.0
ly = 100.0
lz = 26.0
[grid.x]
distribution = uniform
[grid.y]
distribution = cans
stretch = 2.822
[grid.z]
distribution = uniform
[flow]
re = 450.0
convection = divergence
[time]
dt = 1.0e-3
nsteps = 62500
cflmax = 1.0
pecletmax = 0.5
dtmax = 0.02
[pressure]
niter = 6
sor = 1.5
solver = redblack
[case.boundaryLayer]
trip_amp = 0.18854
trip_amp_s = 0.0
trip_x0 = 10.0
trip_lx = 4.0
trip_ly = 1.0
trip_ts = 4.0
trip_nmodes = 16
stats_sample_interval = 25
stats_write_interval = 2000
runtime_interval = 1000
runtime_file = production_stats_runtime.txt
stats_file = production_stats.h5

[ibm]
enabled = true
wall_shape = eggcarton
amp_x = 0.38348082595870
wall_offset = 0.38348082595870
n_wave_x = 150
n_wave_z = 6
phase_x = 1.5707963267948966
phase_z = 1.5707963267948966
wall_x_start = 120.0
wall_ramp = 40.0

[restart]
file = production_212500.h5

[output]
field_interval = 12500
field_prefix = production_p2
