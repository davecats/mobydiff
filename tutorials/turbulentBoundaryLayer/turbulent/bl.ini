[case]
name = boundaryLayer

; ZPG turbulent boundary layer using the boundaryLayer FLOW CASE: the Blasius
; inlet, Dirichlet-pressure outlet + top, no-slip wall, spanwise-periodic
; direction, one-sided natural wall stretching AND the Schlatter & Orlu trip
; forcing are all case defaults (moved into src/modules/flow/boundaryLayer).
; The ini only sets the grid, Reynolds number, time stepping and the tuned
; trip/stats knobs. delta*_0 = 1 nondim, so [flow] re = Re_delta*,0.
;
; This is the smoke-sized configuration (matches ../turbulent/smoke.ini). For
; a production DNS scale the grid + resolution as in ../turbulent/zpg.ini.

[grid]
nx = 256
ny = 96
nz = 64
lx = 160.0
ly = 60.0
lz = 20.0

[grid.x]
distribution = uniform
[grid.z]
distribution = uniform
; grid.y (natural, one-sided, wall-clustered) is a boundaryLayer default

[flow]
re = 450.0

[time]
dt = 1.0e-3
nsteps = 4000
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 0.02

[pressure]
niter = 8
sor = 0.8
accel = chebyshev

[case.boundaryLayer]
; trip + grid tuning for this coarse smoke grid
trip_amp = 0.15
trip_nmodes = 12
dyw_plus = 0.2
jb = 30.0
; statistics: (x,y) profiles averaged in span + time; runtime health line
stats_sample_interval = 200
stats_write_interval = 1000
runtime_interval = 100
stats_file = bl_stats.h5
runtime_file = runtimedata.txt

[output]
field_interval = 2000
field_prefix = bl
