[case]
name = generic

; PRODUCTION zero-pressure-gradient turbulent boundary layer DNS, after the
; ZPG case of Skote (2001), "Studies of turbulent boundary layer flow through
; direct numerical simulation" (KTH), Table 2.3. Laminar Blasius inflow tripped
; to turbulence by the Schlatter & Orlu (2012) random wall-normal trip forcing.
;
; Nondimensionalization (Skote): lengths by the INFLOW displacement thickness
; delta*_0 = 1, velocity by U_inf = 1, so [flow] re = Re_delta*,0 = 450
; (Re_theta,0 = 450/H = 174, H = 2.5911; theta_0 = 1/H = 0.38594).
;
; Domain: Skote uses 600 x 30 x 34 delta*_0 (incl. a downstream fringe). Here
; the streamwise end is a physical outlet (no fringe needed), the top is the
; validated ZPG outlet raised to y = 100 delta*_0 (free wall-normal stretching),
; and the box is 500 x 100 x 32.
;
; Standard second-order-FD DNS resolution at the turbulent end (Re_theta ~ 700,
; l+ = nu/u_tau ~ 0.046 delta*): Dx = 0.39 (Dx+ ~ 8.5), Dz = 0.167 (Dz+ ~ 3.6),
; Dy_wall = 0.014 (Dy+ ~ 0.3) growing to Dy_top ~ 0.54 via one-sided natural
; stretching. Grid 1280 x 256 x 192 = 63M cells.
;
; This is a PRODUCTION run: reaching converged turbulence statistics takes
; several domain flow-throughs (O(1e5) steps) plus time/spanwise averaging over
; many snapshots. Use smoke.ini to validate the setup first.

[grid]
nx = 1280
ny = 256
nz = 192
lx = 500.0
ly = 100.0
lz = 32.0

[grid.x]
distribution = uniform
[grid.y]
distribution = natural
one_sided = true
stretch = 45.0
dyw_plus = 0.15
[grid.z]
distribution = uniform

[ibm]
enabled = false

[flow]
re = 450.0
initial_u = 1.0

[force]
; Schlatter & Orlu (2012) random wall-normal trip forcing
enabled = true
type = trip
trip_x0 = 15.0
trip_lx = 4.0
trip_ly = 1.0
trip_amp = 0.15
trip_ts = 4.0
trip_nmodes = 24
trip_seed = 1

[time]
dt = 1.0e-3
nsteps = 200000
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 0.02

[pressure]
niter = 10
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = false
periodic_y = false
periodic_z = true
x_min_patch = inlet
x_min_u_value = 1.0
x_min_u_profile = blasius
x_min_v_value = 1.0
x_min_v_profile = blasius
blasius_theta = 0.38594
x_max_patch = outlet
y_min_patch = wall
y_max_patch = outlet

[restart]
file = IC_blasius.h5

[output]
field_interval = 5000
field_prefix = zpg
