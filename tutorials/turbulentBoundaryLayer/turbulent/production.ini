[case]
name = boundaryLayer

; PRODUCTION ZPG turbulent boundary layer DNS via the boundaryLayer flow
; case. Phase 1 (this file): develop transition + wash out the transient
; (~3 flow-throughs) with field checkpoints for restart; statistics OFF so
; they do not include the transient. Phase 2 restarts from a checkpoint with
; stats sampling on (see README). delta*_0 = 1, [flow] re = Re_delta*,0.
;
; Grid 1280 x 160 x 192 = 39.3M cells (blayer wall-normal grid). Measured
; ~0.183 s/step on the RTX 5090.

[grid]
nx = 1280
ny = 160
nz = 192
lx = 500.0
ly = 100.0
lz = 32.0

[grid.x]
distribution = uniform
[grid.z]
distribution = uniform
; grid.y: blayer (resolve BL, coarsen freestream) is a boundaryLayer default

[flow]
re = 450.0

[time]
dt = 1.0e-3
nsteps = 100000
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 0.02

[pressure]
niter = 8
sor = 0.8
accel = chebyshev

[case.boundaryLayer]
trip_amp = 0.15
trip_nmodes = 24
resolved_height = 30.0
; statistics OFF during the transient; health line every 1000 steps
stats_sample_interval = -1
stats_write_interval = -1
runtime_interval = 1000
runtime_file = production_runtime.txt

[output]
field_interval = 20000
field_prefix = production
