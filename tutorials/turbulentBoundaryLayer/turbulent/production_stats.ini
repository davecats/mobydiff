[case]
name = boundaryLayer

; PRODUCTION phase 2: restart from the fully-turbulent phase-1 field and
; accumulate statistics (span + time averaged (x,y) profiles) over the
; averaging window. Same grid/case as production.ini; statistics ON.

[grid]
nx = 1280
ny = 160
nz = 192
lx = 500.0
ly = 100.0
lz = 32.0

[grid.x]
distribution = uniform
[grid.z]
distribution = uniform

[flow]
re = 450.0

[time]
dt = 1.0e-3
nsteps = 200000
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 0.02

[pressure]
; niter = 12 for the statistics stage: more projection iterations reduce the
; large-scale velocity-neutral pressure mode (the pn-drift) so the pressure
; statistics are cleaner (phase 1 used niter = 8).
niter = 12
sor = 0.8
accel = chebyshev

[case.boundaryLayer]
trip_amp = 0.15
trip_nmodes = 24
resolved_height = 30.0
; statistics ON: sample every 50 steps, checkpoint the cumulative stats file
; every 20000 steps, health line every 1000
stats_sample_interval = 50
stats_write_interval = 20000
runtime_interval = 1000
stats_file = production_stats.h5
runtime_file = production_stats_runtime.txt

[restart]
file = production_100000.h5

[output]
field_interval = 50000
field_prefix = production_p2
