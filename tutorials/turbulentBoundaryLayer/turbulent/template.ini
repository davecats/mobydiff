[case]
name = generic

; SMOKE test of the ZPG turbulent boundary layer setup (small + coarse, runs
; in-session): verifies the Schlatter & Orlu trip forcing fires, triggers
; 3D transition, and the case is stable. NOT a converged DNS -- see zpg.ini
; for the production resolution.
;
; Nondimensionalization follows Skote (2001) ZPG case: lengths by the
; INFLOW displacement thickness delta*_0 = 1, velocity by U_inf = 1, so
; [flow] re = Re_delta*,0 = 450 (Re_theta,0 = 450/H = 174, H = 2.5911).
; Blasius inflow, trip near the inlet, outlet top (validated ZPG top).

[grid]
nx = 256
ny = 96
nz = 64
lx = 160.0
ly = 60.0
lz = 20.0

[grid.x]
distribution = uniform
[grid.y]
distribution = natural
one_sided = true
stretch = 30.0
dyw_plus = 0.2
[grid.z]
distribution = uniform

[ibm]
enabled = false

[flow]
re = 450.0
initial_u = 1.0

[force]
; Schlatter & Orlu (2012) random wall-normal trip forcing
enabled = true
type = trip
trip_x0 = 15.0
trip_lx = 4.0
trip_ly = 1.0
trip_amp = 0.30
trip_ts = 4.0
trip_nmodes = 12
trip_seed = 1

[time]
dt = 1.0e-3
nsteps = 1
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 0.03

[pressure]
niter = 8
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = false
periodic_y = false
periodic_z = true
x_min_patch = inlet
x_min_u_value = 1.0
x_min_u_profile = blasius
x_min_v_value = 1.0
x_min_v_profile = blasius
blasius_theta = 0.38594
x_max_patch = outlet
y_min_patch = wall
y_max_patch = outlet

; [restart] absent: mint the template for make_blasius_ic

[output]
field_interval = 0
field_prefix = template
