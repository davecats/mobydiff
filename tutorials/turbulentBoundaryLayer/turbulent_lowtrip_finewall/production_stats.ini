[case]
name = boundaryLayer

; VARIANT of ../turbulent_two: identical setup EXCEPT the wall-normal grid is
; refined so the largest cell within the boundary layer is Dy+_max ~ 4 (ny
; 176 -> 256; Dy+_max 6.2 -> 3.9, Dy+_wall 0.22 -> 0.12). The IC is the
; developed turbulent_two field interpolated onto the finer y-grid
; (restart_interp.h5, built by make_finewall_restart.py). x and z grids are
; unchanged (2048 x 192, geometric x).
;
; Phase 1 (this file): re-equilibration transient on the finer grid (the
; interpolation seeds a small divergence the projection cleans, and the finer
; grid resolves more near-wall content), statistics OFF. Phase 2
; (production_stats.ini) restarts with stats on.

[grid]
nx = 2048
ny = 256
nz = 192
lx = 750.0
ly = 100.0
lz = 32.0

[grid.x]
distribution = geometric
stretch = 1.5
[grid.z]
distribution = uniform
[grid.y]
; Keep the wall spacing at the turbulent_two value (dy+_wall ~ 0.22) by raising
; dyw_plus 0.15 -> 0.28 as ny grows 176 -> 256. The smallest cell (the wall
; cell) is unchanged, so the Peclet/diffusive dt limit is unchanged (dt = 0.02,
; NOT Peclet-limited); the extra points refine the OUTER boundary layer
; (dy+_max 6.2 -> 3.85), which is the resolution we actually need.
dyw_plus = 0.28

[flow]
re = 450.0
convection = skew

[time]
dt = 1.0e-3
nsteps = 200000
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 0.02

[pressure]
niter = 12
sor = 0.8
accel = chebyshev

[case.boundaryLayer]
trip_amp = 0.03
trip_nmodes = 24
resolved_height = 36.0
dyw_plus = 0.28
stats_sample_interval = 50
stats_write_interval = 2000
runtime_interval = 1000
runtime_file = production_stats_runtime.txt
stats_file = production_stats.h5

[restart]
file = production_100000.h5

[output]
field_interval = 50000
field_prefix = production_p2
