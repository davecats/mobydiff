[case]
name = boundaryLayer

; VARIANT of ../turbulent_two, reduced trip (1/5). Phase 2: restart from the
; re-equilibrated phase-1 field and accumulate span+time statistics.

[grid]
nx = 2048
ny = 176
nz = 192
lx = 750.0
ly = 100.0
lz = 32.0

[grid.x]
distribution = geometric
stretch = 1.5
[grid.z]
distribution = uniform

[flow]
re = 450.0
convection = skew

[time]
dt = 1.0e-3
nsteps = 200000
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 0.02

[pressure]
niter = 12
sor = 0.8
accel = chebyshev

[case.boundaryLayer]
trip_amp = 0.03
trip_nmodes = 24
resolved_height = 36.0
stats_sample_interval = 50
stats_write_interval = 2000
runtime_interval = 1000
stats_file = production_stats.h5
runtime_file = production_stats_runtime.txt

[restart]
file = production_100000.h5

[output]
field_interval = 50000
field_prefix = production_p2
