[case]
name = boundaryLayer

; VARIANT of ../turbulent_two: identical setup EXCEPT the trip intensity is
; reduced by a factor 1/5 (trip_amp 0.15 -> 0.03). Restarts from the developed
; turbulent_two field so the layer only has to re-equilibrate to the weaker
; trip (the transition region shifts) rather than transition from scratch.
;
; Phase 1 (this file): re-equilibration transient, statistics OFF. Phase 2
; (production_stats.ini) restarts with stats on. Grid identical to
; turbulent_two (2048 x 176 x 192, geometric x, blayer y).

[grid]
nx = 2048
ny = 176
nz = 192
lx = 750.0
ly = 100.0
lz = 32.0

[grid.x]
distribution = geometric
stretch = 1.5
[grid.z]
distribution = uniform

[flow]
re = 450.0
convection = skew

[time]
dt = 1.0e-3
nsteps = 100000
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 0.02

[pressure]
niter = 12
sor = 0.8
accel = chebyshev

[case.boundaryLayer]
; trip intensity reduced 1/5: 0.15 -> 0.03
trip_amp = 0.03
trip_nmodes = 24
resolved_height = 36.0
stats_sample_interval = -1
stats_write_interval = -1
runtime_interval = 1000
runtime_file = production_runtime.txt

[restart]
file = ../turbulent_two/production_p2_250000.h5

[output]
field_interval = 20000
field_prefix = production
