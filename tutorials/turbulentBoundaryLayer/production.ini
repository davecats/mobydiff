[case]
name = boundaryLayer

; ZPG turbulent boundary layer -- PHASE 1 (re-equilibration, statistics OFF).
; The shipped "finey" configuration: 4096 x 224 x 192, wall-clustered blayer y
; grid with dy+_max ~ 4.3 inside delta99 (isotropic with dx+ ~ dz+ ~ 4), geometric
; streamwise grid, skew-symmetric convection, red-black SOR pressure solver. See
; README.md for the full rationale and the reproduce-from-scratch recipe.
;
; Restart from a developed turbulent field (restart_field.h5, kept locally -- too
; large for git; regenerate it with cold_start.ini, see README). This phase lets
; the field settle on the (grid, trip, solver) of the shipped case before
; statistics are gathered in phase 2. dt = 0.02 (Peclet-limited by the fixed wall
; spacing). 50000 steps ~ 1000 t.u.

[grid]
nx = 4096
ny = 224
nz = 192
lx = 750.0
ly = 100.0
lz = 32.0

[grid.x]
distribution = geometric
stretch = 1.5
[grid.z]
distribution = uniform

[flow]
re = 450.0
convection = skew

[time]
dt = 1.0e-3
nsteps = 50000
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 0.02

[pressure]
niter = 6
sor = 1.5
solver = redblack

[case.boundaryLayer]
; CaNS-exact Schlatter-Orlu trip (exact port of cans_js/src/trip.f90; see
; bodyforce.f90). trip_amp is the CaNS tripAmp, scaled by 1/nmodes onto a signal of
; spanwise rms sqrt(nmodes) -> effective amplitude amp/sqrt(nmodes). These are the
; CaNS/AMPHIBIOUS production values (nmodes=16 => 8 harmonics + mode 0).
trip_amp = 0.18854
trip_amp_s = 0.0
trip_x0 = 10.0
trip_lx = 4.0
trip_ly = 1.0
trip_ts = 4.0
trip_nmodes = 16
resolved_height = 36.0
dyw_plus = 0.221
stats_sample_interval = -1
stats_write_interval = -1
runtime_interval = 1000
runtime_file = production_runtime.txt

[restart]
file = restart_field.h5

[output]
field_interval = 25000
field_prefix = production
