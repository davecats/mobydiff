[case]
name = boundaryLayer

; overheadTest -- WHAT THE REFINEMENT BUYS. A 2:1 xz-refined twin of the
; single-level production layout: the level-0 grid is production's with x and z
; HALVED (2048 x 176 x 96), and the wall band is refined one level in x,z only,
; so the near-wall region carries production's 4096 x 192 resolution while the
; freestream runs at half. The y line is the production line at every level --
; refine_dims = xz never subdivides y.
;
; PLACEMENT. nb = 16 makes 11 y-tiles; the box below selects the first three
; (y node 48, y = 4.569, y+ = 99 at the developed c_f -- hence "yp100"). The
; interface can only sit on a y-tile boundary, which is exactly the trade-off
; that per-direction nb (Phase 1) has to weigh: a larger nb_y is cheaper but
; offers fewer legal interface heights.
;
; The resulting leaf set: 128 x 8 x 6 = 6144 coarse leaves + 3 x 128 x 6 = 2304
; refined level-0 blocks x 4 children = 9216 fine leaves = 15360 leaves, and
; 34.60 M x (8/11 + 4 x 3/11) = 62.9 M cells = 0.4545 of the single-level case.
; Both numbers are gates on this config: if the solver reports different leaf or
; cell counts, the placement moved and the timing is not comparable.
;
; NOTE this is a COST twin of the single-level case, not a grid twin: the
; level-1 x line is the midpoint subdivision of the 2048-point geometric line,
; not the 4096-point geometric line. Irrelevant to timing, fatal if anyone
; mistakes this for a physics case.
;
; Red-black is not available across a 2:1 interface (see
; docs/next_session_redblack_interface.md), so the refined case is Jacobi and
; must be read against base_jacobi.ini / nb16_jacobi.ini.

[grid]
nx = 2048
ny = 176
nz = 96
lx = 750.0
ly = 100.0
lz = 32.0

[grid.x]
distribution = geometric
stretch = 1.5
[grid.z]
distribution = uniform

[blocks]
; 2048/16 = 128, 176/16 = 11, 96/16 = 6.
nb = 16
refine_dims = xz
refine_levels = 1
; xmin xmax ymin ymax zmin zmax. Selection is strict overlap, so ymax = 3.0
; (inside y-tile 3, which spans 1.813 .. 4.569) takes tiles 1-3 and leaves
; tile 4 coarse. x and z bounds are deliberately outside the domain.
refine = -1.0 751.0 0.0 3.0 -1.0 33.0

[flow]
re = 450.0
convection = skew

[time]
dt = 1.0e-3
nsteps = 400
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 1.0e-3

[pressure]
niter = 6
sor = 0.8
solver = jacobi

[case.boundaryLayer]
trip_amp = 0.03
trip_nmodes = 24
resolved_height = 36.0
stats_sample_interval = -1
stats_write_interval = -1
runtime_interval = 25
runtime_file = runtime.txt

[output]
field_interval = 0
field_prefix = overhead
