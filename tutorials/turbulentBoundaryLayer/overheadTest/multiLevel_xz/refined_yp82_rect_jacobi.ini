[case]
name = boundaryLayer

; overheadTest -- THE REFINED CASE AT THE PRODUCTION BLOCK SHAPE.
; refined_yp100_jacobi.ini with Phase 1's per-direction nb (64 44 48) instead of
; the cubic nb = 16 it shipped with. The single-level production layout moved to
; this block shape and took 21.7 % off the step (tax 1.367 -> 1.071); the refined
; case never did, so it was still paying the cubic tax. Same level-0 grid, same
; refine_dims = xz, same solver -- only the tiling changes.
;
; PLACEMENT, and why this is NOT a like-for-like twin of refined_yp100. nb_y = 44
; makes 4 y-tiles instead of 11, so the legal interface heights are y node
; 44/88/132 (y+ 82/318/613) instead of every 16 cells. The box below selects the
; first tile only, putting the interface at y node 44, y = 3.78, y+ = 82 at the
; developed c_f -- close to yp100's y+ 99, but lower, so this case carries FEWER
; refined cells. Compare the two on cost per cell, not on s/step.
;
; The resulting leaf set: 32 x 4 x 2 = 256 level-0 blocks, of which the 32 x 1 x 2
; = 64 in y-tile 1 refine into 4 children each (xz: 2 in x, 2 in z) => 192 coarse
; + 256 fine = 448 leaves, and 34.60 M x (3/4 + 4 x 1/4) = 60.56 M cells (yp100:
; 15360 leaves, 62.9 M). Both numbers are gates on this config: different leaf or
; cell counts mean the placement moved and the timing is not comparable.
;
; The COST-twin and physics caveats of refined_yp100_jacobi.ini apply unchanged:
; the level-1 x line is the midpoint subdivision of the 2048-point geometric
; line, not the 4096-point one. Fatal if mistaken for a physics case.

[grid]
nx = 2048
ny = 176
nz = 96
lx = 750.0
ly = 100.0
lz = 32.0

[grid.x]
distribution = geometric
stretch = 1.5
[grid.z]
distribution = uniform

[blocks]
; 2048/64 = 32, 176/44 = 4, 96/48 = 2.
nb = 64 44 48
refine_dims = xz
refine_levels = 1
; xmin xmax ymin ymax zmin zmax. Selection is strict overlap, so ymax = 3.0
; (inside y-tile 1, which spans 0 .. 3.78) takes that tile alone and leaves
; tiles 2-4 coarse. x and z bounds are deliberately outside the domain.
refine = -1.0 751.0 0.0 3.0 -1.0 33.0

[flow]
re = 450.0
convection = skew

[time]
dt = 1.0e-3
nsteps = 400
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 1.0e-3

[pressure]
niter = 6
sor = 0.8
solver = jacobi

[case.boundaryLayer]
trip_amp = 0.03
trip_nmodes = 24
resolved_height = 36.0
stats_sample_interval = -1
stats_write_interval = -1
runtime_interval = 25
runtime_file = runtime.txt

[output]
field_interval = 0
field_prefix = overhead
; Per-phase step timing (profiling.f90). run_overhead.sh flips this to
; true when PROFILE=1; it only reads clocks, so both settings give
; bit-identical fields.
profile = false
