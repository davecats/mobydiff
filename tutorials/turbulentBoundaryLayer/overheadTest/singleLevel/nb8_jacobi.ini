[case]
name = boundaryLayer

; overheadTest -- the SECOND POINT on the block-size curve. Identical to
; nb16_jacobi.ini except nb = 8, which tiles the grid into 512 x 22 x 24 =
; 270336 blocks and predicts an overhead of (10/8)^3 = 1.9531 against
; base_jacobi.ini (nb16 predicts (18/16)^3 = 1.4238).
;
; Two points on the same grid, same solver, same binary is what turns "the tax
; is 1.41 at nb = 16" into a test of the LAW -- and phase_table.py resolves it
; per phase, which is the handout's secondary check: every phase whose cost is
; footprint-bound must follow (nb+2)^3/nb^3 at BOTH block sizes.
;
; nb is limited to {4, 8, 16} on this grid: it has to divide 4096, 176 and 192.

[grid]
nx = 4096
ny = 176
nz = 192
lx = 750.0
ly = 100.0
lz = 32.0

[grid.x]
distribution = geometric
stretch = 1.5
[grid.z]
distribution = uniform

[blocks]
nb = 8

[flow]
re = 450.0
convection = skew

[time]
dt = 1.0e-3
nsteps = 400
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 1.0e-3

[pressure]
niter = 6
sor = 0.8
solver = jacobi

[case.boundaryLayer]
trip_amp = 0.03
trip_nmodes = 24
resolved_height = 36.0
stats_sample_interval = -1
stats_write_interval = -1
runtime_interval = 25
runtime_file = runtime.txt

[output]
field_interval = 0
field_prefix = overhead
; Per-phase step timing (profiling.f90). run_overhead.sh flips this to
; true when PROFILE=1; it only reads clocks, so both settings give
; bit-identical fields.
profile = false
