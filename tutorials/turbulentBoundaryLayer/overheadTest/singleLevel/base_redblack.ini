[case]
name = boundaryLayer

; overheadTest -- BLOCK-OVERHEAD TIMING BASELINE. Not a physics case: 400 cold
; steps produce no meaningful flow. The only outputs that matter are the
; per-step wall time (chron "timing:" line + the runtime file) and the runtime
; line's L2_div / Linf_vel, which must be IDENTICAL between the base and nb16
; twins -- the block decomposition is result-invariant by design (Phase 1), so
; a differing runtime line means the comparison is not measuring what it claims.
;
; This file: the PRODUCTION layout -- [blocks] nb unset, so the block set is one
; block per rank box and there is no per-block halo tax. Reference for the
; nb16_redblack.ini ratio.
;
; Grid, flow and solver are production.ini's (4096 x 176 x 192 = 138.4 M cells,
; geometric x, skew convection, red-black SOR niter 6). Cold start (no [restart]
; section) so the case needs no data file.

[grid]
nx = 4096
ny = 176
nz = 192
lx = 750.0
ly = 100.0
lz = 32.0

[grid.x]
distribution = geometric
stretch = 1.5
[grid.z]
distribution = uniform

[flow]
re = 450.0
convection = skew

; Fixed dt: the per-step cost does not depend on dt (niter is fixed), but
; pinning it removes one variable from the comparison.
[time]
dt = 1.0e-3
nsteps = 400
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 1.0e-3

[pressure]
niter = 6
sor = 1.5
solver = redblack

[case.boundaryLayer]
trip_amp = 0.03
trip_nmodes = 24
resolved_height = 36.0
stats_sample_interval = -1
stats_write_interval = -1
; Cumulative-average wall time per step; summarise.py differences consecutive
; lines to recover the marginal rate and drop the start-up transient.
runtime_interval = 25
runtime_file = runtime.txt

; No field output. The final snapshot after the loop is unconditional (it lands
; outside the timed region); run_overhead.sh deletes it.
[output]
field_interval = 0
field_prefix = overhead
; Per-phase step timing (profiling.f90). run_overhead.sh flips this to
; true when PROFILE=1; it only reads clocks, so both settings give
; bit-identical fields.
profile = false
