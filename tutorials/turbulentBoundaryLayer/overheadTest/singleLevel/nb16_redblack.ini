[case]
name = boundaryLayer

; overheadTest -- BLOCK-OVERHEAD TIMING. Identical to base_redblack.ini except
; for the [blocks] section: nb = 16 tiles the SAME grid into 256 x 11 x 12 =
; 33792 equal blocks, each carrying its own one-cell halo layer. The measured
; ratio against base_redblack.ini is the block tax; the cost model predicts
; (18/16)^3 = 1.4238 (allocated volume), and 1.409 was measured on an A6000.
;
; The runtime line (L2_div, Linf_vel) must match base_redblack.ini EXACTLY:
; nb-independence is a designed Phase-1 property and it is the gate that says
; the two runs are doing the same computation.

[grid]
nx = 4096
ny = 176
nz = 192
lx = 750.0
ly = 100.0
lz = 32.0

[grid.x]
distribution = geometric
stretch = 1.5
[grid.z]
distribution = uniform

[blocks]
; 4096/16 = 256, 176/16 = 11, 192/16 = 12 -- nb must divide every direction.
nb = 16

[flow]
re = 450.0
convection = skew

[time]
dt = 1.0e-3
nsteps = 400
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 1.0e-3

[pressure]
niter = 6
sor = 1.5
solver = redblack

[case.boundaryLayer]
trip_amp = 0.03
trip_nmodes = 24
resolved_height = 36.0
stats_sample_interval = -1
stats_write_interval = -1
runtime_interval = 25
runtime_file = runtime.txt

[output]
field_interval = 0
field_prefix = overhead
