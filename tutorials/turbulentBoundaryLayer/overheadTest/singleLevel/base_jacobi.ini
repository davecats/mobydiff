[case]
name = boundaryLayer

; overheadTest -- BLOCK-OVERHEAD TIMING BASELINE, damped-Jacobi projection.
; Same grid and flow as base_redblack.ini, [blocks] nb unset.
;
; WHY BOTH SOLVERS: red-black sweeps the open halo layer REDUNDANTLY (that is
; what makes results nb-independent), damped Jacobi does not. If the block tax
; were redundant arithmetic the two ratios would differ; measured they are
; 1.409 and 1.413, which is what rules out "do less work in halos" as a
; strategy and points at bytes (footprint / traffic) instead. Keep both.
;
; sor = 0.8 is the DAMPING factor here, not over-relaxation: plain Jacobi
; diverges above ~0.8. accel is left at its default (none) -- Chebyshev is
; deliberately off, see the boundary-layer finding about chebyshev + niter 6 +
; Dirichlet-p outlets.

[grid]
nx = 4096
ny = 176
nz = 192
lx = 750.0
ly = 100.0
lz = 32.0

[grid.x]
distribution = geometric
stretch = 1.5
[grid.z]
distribution = uniform

[flow]
re = 450.0
convection = skew

[time]
dt = 1.0e-3
nsteps = 400
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 1.0e-3

[pressure]
niter = 6
sor = 0.8
solver = jacobi

[case.boundaryLayer]
trip_amp = 0.03
trip_nmodes = 24
resolved_height = 36.0
stats_sample_interval = -1
stats_write_interval = -1
runtime_interval = 25
runtime_file = runtime.txt

[output]
field_interval = 0
field_prefix = overhead
