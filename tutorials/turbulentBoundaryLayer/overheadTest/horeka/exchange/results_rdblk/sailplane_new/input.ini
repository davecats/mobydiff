[case]
name = generic

[grid]
; Original STL bounding box, in metres after scale 0.001:
; length = 8.644325, span = 19.489268, height = 1.950183.
; The computational domain is half of the 5-span box:
; x = 5*length, y = 2.5*span, z = 5*height.
; Large single-GPU smoke size for the 6 GB Quadro RTX 3000 on this PC.
; Kept slightly below the memory ceiling so STL preprocessing remains stable in WSL.
nx = 400
ny = 450
nz = 100
lx = 43.22162499838677
ly = 48.72317
lz = 9.750915

[grid.x]
distribution = uniform

[grid.y]
distribution = uniform

[grid.z]
distribution = uniform

[mpi]
dims = 0 0 0

[flow]
; Starter value only. Regenerate sailplane_ibm_coeff.h5 if this changes.
re = 1.0e5
forcing_x = 0.0
forcing_y = 0.0
forcing_z = 0.0

[time]
dt = 1.0e-3
nsteps = 1
t_final = 1.0e-3
cflmax = 0.5
pecletmax = 0.5
dtmax = 1.0e-3

[pressure]
niter = 20
sor = 1.5

[ibm]
enabled = true
coeff_file = sailplane_ibm_coeff.h5

[boundary]
periodic_x = false
periodic_y = false
periodic_z = false

; Inlet: prescribed velocity (1,0,0), pressure Neumann.
x_min_u_value = 1.0
x_min_v_value = 0.0
x_min_w_value = 0.0
x_min_p_type = neumann

; Outlet: velocity Neumann, pressure reference.
x_max_u_type = neumann
x_max_v_type = neumann
x_max_w_type = neumann
x_max_p_type = dirichlet
x_max_p_value = 0.0

; y-symmetry/far-symmetry: v = 0, du/dy = dw/dy = dp/dy = 0.
y_min_u_type = neumann
y_min_v_type = dirichlet
y_min_v_value = 0.0
y_min_w_type = neumann
y_min_p_type = neumann

y_max_u_type = neumann
y_max_v_type = dirichlet
y_max_v_value = 0.0
y_max_w_type = neumann
y_max_p_type = neumann

; z-symmetry/far-symmetry: w = 0, du/dz = dv/dz = dp/dz = 0.
z_min_u_type = neumann
z_min_v_type = neumann
z_min_w_type = dirichlet
z_min_w_value = 0.0
z_min_p_type = neumann

z_max_u_type = neumann
z_max_v_type = neumann
z_max_w_type = dirichlet
z_max_w_value = 0.0
z_max_p_type = neumann

[output]
field_interval = 1
field_prefix = sailplane_field

[restart]
; file = sailplane_field_10.h5
