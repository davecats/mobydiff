[case]
name = channel

; LES<->IBM coupling validation. A plane-wall channel whose two flat walls are
; described by the FILE-BASED immersed boundary (tools/mobygeom.py), NOT the
; analytic single-wavy-wall isInBody. The walls do NOT coincide with grid nodes:
; the y-line is UNIFORM (ny=80, ly=2.5, dy=0.03125) and the walls sit mid-cell at
; y = 8.3*dy = 0.259375 and y = 72.3*dy = 2.259375, so the fluid gap is exactly
; 2.0 (half-height 1 -> Re_tau ~ 180 with re=180, forcing_x=1). Solid slabs are
; ~8 cells thick on each side -> plenty of FULLY-solid cells (coef=1e30/Re) for
; the solid-mask gate, plus one band cell at each wall.
;
; Build order (see run_ibm_les.py / README):
;   1. mobygrid channel_ibm.ini grid.h5
;   2. make_walls_stl.py  -> wall_lo.stl wall_hi.stl
;   3. mobygeom stl-ibm-coeff --geometry wall_lo.stl wall_hi.stl --grid-file grid.h5 --re 180 --output ibm_coeff.h5
;   4. make_ibm_ic.py -> IC.h5  (KMM180 developed field mapped into the gap)

[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.0
small_noise_amplitude = 0.0
stats_sample_interval = 50
stats_write_interval = 20000
stats_file = channel_ibm_stats.h5

[grid]
nx = 64
ny = 80
nz = 64
lx = 12.566370614359172
ly = 2.5
lz = 6.283185307179586

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8
refine_body = true
refine_levels = 1

[flow]
re = 180.0
forcing_x = 1.0

[time]
dt = 1.0e-5
t_final = 100.0
nsteps = 100000000
cflmax = 0.8
pecletmax = 0.5
dtmax = 5.0e-4

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[ibm]
enabled = true
coeff_file = ibm_coeff_blocks.h5

[les]
model = wale

[output]
field_interval = 0
field_prefix = channel_ibm

[mpi]
dims = 1 1 1

[restart]
file = IC_refine.h5
