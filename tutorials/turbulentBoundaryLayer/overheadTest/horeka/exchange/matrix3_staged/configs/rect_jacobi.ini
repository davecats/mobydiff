[case]
name = boundaryLayer

; overheadTest -- PER-DIRECTION nb (Phase 1). base_jacobi.ini with nb = 64 44 48
; (1024 blocks). Predicted tax (1+2/64)(1+2/44)(1+2/48) = 1.1230, against 1.4238
; for the cubic nb = 16. nb_y is large because y buys no refinement under
; refine_dims = xz -- it is pure overhead there. The price is granularity: y-tile
; boundaries at index 44/88/132 (y+ 82/318/613) instead of every 16 cells, so the
; y+ ~100 interface of the refined case moves to y+ 82.

[grid]
nx = 4096
ny = 176
nz = 192
lx = 750.0
ly = 100.0
lz = 32.0

[grid.x]
distribution = geometric
stretch = 1.5
[grid.z]
distribution = uniform

[blocks]
nb = 64 44 48

[flow]
re = 450.0
convection = skew

[time]
dt = 1.0e-3
nsteps = 400
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 1.0e-3

[pressure]
niter = 6
sor = 0.8
solver = jacobi

[case.boundaryLayer]
trip_amp = 0.03
trip_nmodes = 24
resolved_height = 36.0
stats_sample_interval = -1
stats_write_interval = -1
runtime_interval = 25
runtime_file = runtime.txt

[output]
field_interval = 0
field_prefix = overhead
; Per-phase step timing (profiling.f90). run_overhead.sh flips this to
; true when PROFILE=1; it only reads clocks, so both settings give
; bit-identical fields.
profile = false
