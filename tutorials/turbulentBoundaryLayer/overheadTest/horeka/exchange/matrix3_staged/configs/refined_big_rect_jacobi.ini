[case]
name = boundaryLayer

; overheadTest/horeka -- THE PRODUCTION-SIZE REFINED CASE.
; refined_yp82_rect_jacobi.ini on the FULL production level-0 grid
; (4096 x 176 x 192) instead of the half-resolution 2048 x 176 x 96 one.
;
; WHY THIS CONFIG EXISTS. The small refined case has no like-for-like
; single-level twin: its level-0 grid is half the production one in x and z, so
; it can only be compared against rect_jacobi on cost PER CELL, with the block
; shape and the grid both changing. This config shares its level-0 grid, block
; shape, refine box and solver with rect_jacobi EXACTLY -- the only difference
; is that y-tile 1 is refined. rect_jacobi is therefore its true twin, and
;     (s/step per cell here) / (s/step per cell in rect_jacobi)
; is the 2:1 machinery overhead with nothing else moving. That ratio is the
; headline number this cluster campaign exists to measure.
;
; GATES, printed by the solver at init -- check them before trusting any timing:
;   level-0 blocks  64 x 4 x 4 = 1024   (4096/64, 176/44, 192/48)
;   refined         y-tile 1 only: 64 x 1 x 4 = 256 blocks -> 4 children each
;   leaves          768 coarse + 1024 fine = 1792      (verified with
;                   leaftable_test 4096 176 192 750 100 32 64,44,48 1 xz
;                   -1 751 0 3 -1 33, which printed exactly 1792 rows)
;   cells           1792 x 64 x 44 x 48 = 242.22 M     (rect_jacobi: 138.41 M)
; Different leaf or cell counts mean the placement moved and the comparison is
; void.
;
; MEMORY: ~39 GB of field state in total, so this case needs at least 2 GPUs on
; an A100-40 node and is run from 4 ranks up in the matrix. It will OOM at 1 rank.
;
; The interface sits at y node 44 (y = 3.78, y+ = 82 at the developed c_f), the
; same height as the small case: ny and ly are unchanged, so the y node line is
; identical and the refine box selects the same tile.
;
; PHYSICS CAVEAT, inherited and unchanged: the level-1 x line is the midpoint
; subdivision of the 4096-point geometric line, not an 8192-point one. This is a
; COST twin, not a physics case. Fatal if mistaken for one.

[grid]
nx = 4096
ny = 176
nz = 192
lx = 750.0
ly = 100.0
lz = 32.0

[grid.x]
distribution = geometric
stretch = 1.5
[grid.z]
distribution = uniform

[blocks]
; 2048/64 = 32, 176/44 = 4, 96/48 = 2.
nb = 64 44 48
refine_dims = xz
refine_levels = 1
; xmin xmax ymin ymax zmin zmax. Selection is strict overlap, so ymax = 3.0
; (inside y-tile 1, which spans 0 .. 3.78) takes that tile alone and leaves
; tiles 2-4 coarse. x and z bounds are deliberately outside the domain.
refine = -1.0 751.0 0.0 3.0 -1.0 33.0

[flow]
re = 450.0
convection = skew

[time]
dt = 1.0e-3
nsteps = 400
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 1.0e-3

[pressure]
niter = 6
sor = 0.8
solver = jacobi

[case.boundaryLayer]
trip_amp = 0.03
trip_nmodes = 24
resolved_height = 36.0
stats_sample_interval = -1
stats_write_interval = -1
runtime_interval = 25
runtime_file = runtime.txt

[output]
field_interval = 0
field_prefix = overhead
; Per-phase step timing (profiling.f90). run_overhead.sh flips this to
; true when PROFILE=1; it only reads clocks, so both settings give
; bit-identical fields.
profile = false
