[case]
name = boundaryLayer

; overheadTest -- the ROUGH boundary layer. rect_jacobi's grid, blocks and flow
; exactly, plus a 3D sinusoidal (egg-carton) wall: the MacDonald & Hutchins
; roughness, h*sin(kx x)*sin(kz z) about a mean wall plane.
;
; WHY IT EXISTS. Every other config here is BODY-FREE, so none of them can
; measure anything that depends on the immersed boundary -- and the rdenom
; narrowing (results_rdenom_static_2026-09-17.md) is exactly that: its win is
; 1 - (body blocks / all blocks), which the body-free cases report as 1 and
; les_ibm, whose walls span the domain, reports as 0.4 on a case too small to
; matter. A wall-attached roughness in a long domain is the production shape:
; the body occupies the bottom y-block only, so ~1/4 of the 1024 blocks.
;
; It is a BENCHMARK, not a validated physics case. The roughness height and
; wavelengths are chosen to be resolved by this grid and to sit inside the
; first y-block, not to reproduce a published Re_tau or k_s+.

[grid]
nx = 4096
ny = 176
nz = 192
lx = 750.0
ly = 100.0
lz = 32.0

[grid.x]
distribution = geometric
stretch = 1.5
[grid.z]
distribution = uniform

[blocks]
nb = 64 44 48

[flow]
re = 450.0

[time]
dt = 1.0e-3
nsteps = 200
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 1.0e-3

[pressure]
niter = 6
sor = 0.8
solver = jacobi

[case.boundaryLayer]
trip_amp = 0.03
trip_nmodes = 24
resolved_height = 36.0
stats_sample_interval = -1
stats_write_interval = -1
runtime_interval = 50
runtime_file = runtime.txt

[ibm]
enabled = true
; Egg-carton roughness. lx = 750 and lz = 32, so n_wave_x = 50 gives a
; streamwise wavelength of 15 and n_wave_z = 4 a spanwise one of 8; amp_x is the
; SEMI-height about the mean plane, so crest-to-trough is 0.10 -- about 7 cells
; of the geometric y stretching at the wall, and well inside the first y-block
; (44 cells).
wall_shape = eggcarton
amp_x = 0.05
n_wave_x = 50
n_wave_z = 4
phase_x = 0.0
phase_z = 0.0

[output]
field_interval = 0
field_prefix = rough
; Per-phase step timing (profiling.f90). run_overhead.sh flips this to
; true when PROFILE=1; it only reads clocks, so both settings give
; bit-identical fields.
profile = true

[flow]
convection = skew
