[case]
name = boundaryLayer

; overheadTest -- THE REFINED CASE ON RED-BLACK SOR (R1).
; refined_yp82_rect_jacobi.ini with [pressure] solver = redblack. Identical
; grid, block shape, refinement and interface placement -- only the smoother
; changes, so this pair isolates the smoother on a REFINED grid, which the
; single-level base_jacobi/base_redblack pair cannot: red-black gains a
; per-colour cross-level phi exchange here that it does not have on one level.
;
; niter = 3 and sor = 1.5 against the Jacobi twin's sor = 0.8. The two smoothers
; need DIFFERENT niter for the same quality (Jacobi needs >= 12 to keep the
; pressure zero-mode away, red-black stays clean below 6), so a run at matched
; niter compares nothing useful -- read the L2_div column, not just s/step.
; run_overhead.sh takes NITER= to sweep it.
;
; Gates carried over from the Jacobi twin: 448 leaves (192 coarse + 256 fine),
; 60.56 M cells. Different counts mean the placement moved.

[grid]
nx = 2048
ny = 176
nz = 96
lx = 750.0
ly = 100.0
lz = 32.0

[grid.x]
distribution = geometric
stretch = 1.5
[grid.z]
distribution = uniform

[blocks]
; 2048/64 = 32, 176/44 = 4, 96/48 = 2.
nb = 64 44 48
refine_dims = xz
refine_levels = 1
; xmin xmax ymin ymax zmin zmax. Selection is strict overlap, so ymax = 3.0
; (inside y-tile 1, which spans 0 .. 3.78) takes that tile alone and leaves
; tiles 2-4 coarse. x and z bounds are deliberately outside the domain.
refine = -1.0 751.0 0.0 3.0 -1.0 33.0

[flow]
re = 450.0
convection = skew

[time]
dt = 1.0e-3
nsteps = 400
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 1.0e-3

[pressure]
niter = 3
sor = 1.5
solver = redblack

[case.boundaryLayer]
trip_amp = 0.03
trip_nmodes = 24
resolved_height = 36.0
stats_sample_interval = -1
stats_write_interval = -1
runtime_interval = 25
runtime_file = runtime.txt

[output]
field_interval = 0
field_prefix = overhead
; Per-phase step timing (profiling.f90). run_overhead.sh flips this to
; true when PROFILE=1; it only reads clocks, so both settings give
; bit-identical fields.
profile = false
