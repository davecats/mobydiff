[case]
name = boundaryLayer

; MECHANISM PROBE -- ONE BLOCK PER RANK at 8 ranks. Not a production layout.
;
; nb = 1024 176 96 gives 4 x 1 x 2 = 8 level-0 blocks on the production grid
; (verified with leaftable_test: exactly 8 leaves). At 8 ranks that is one
; block per rank, so there are NO same-rank block pairs and the device-local
; copy volume collapses to the periodic self-copies alone -- while the rank
; topology (the 2-peer Morton chain) and the total cell count (138.41 M) are
; unchanged from rect_jacobi.
;
; WHAT IT SEPARATES. The composite hypothesis that fits every point of the
; 2026-09-07 matrix is "cross-node transfer contending with the device-local
; copy kernel":
;     base  n=8  : crosses nodes, ZERO local copy      -> 125 us   fast
;     rect  n=4  : 15.2 M local copy, NO node crossing ->  72 us   fast
;     rect  n=8  : 14.9 M local copy AND node crossing -> 708 us   SLOW
; This config is the missing fourth cell: node crossing WITHOUT the local-copy
; load. Run it at 8 ranks on 2 nodes.
;     wait ~125 us  => local-copy/transfer contention is the mechanism
;     wait ~700 us  => local copy is innocent; the 2-peer chain or the blocked
;                      exchange's message structure is at fault
;
; Cell count is identical to rect_jacobi (8 x 1024 x 176 x 96 = 138.41 M), so
; s/step is directly comparable; only the tiling differs.

[grid]
nx = 4096
ny = 176
nz = 192
lx = 750.0
ly = 100.0
lz = 32.0

[grid.x]
distribution = geometric
stretch = 1.5
[grid.z]
distribution = uniform

[blocks]
nb = 1024 176 96

[flow]
re = 450.0
convection = skew

[time]
dt = 1.0e-3
nsteps = 400
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 1.0e-3

[pressure]
niter = 6
sor = 0.8
solver = jacobi

[case.boundaryLayer]
trip_amp = 0.03
trip_nmodes = 24
resolved_height = 36.0
stats_sample_interval = -1
stats_write_interval = -1
runtime_interval = 25
runtime_file = runtime.txt

[output]
field_interval = 0
field_prefix = overhead
; Per-phase step timing (profiling.f90). run_overhead.sh flips this to
; true when PROFILE=1; it only reads clocks, so both settings give
; bit-identical fields.
profile = false
