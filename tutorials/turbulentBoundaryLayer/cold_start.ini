[case]
name = boundaryLayer

; STAGE 0 -- cold start from scratch. Generates the developed turbulent field
; that the (un-committed) restart_field.h5 stood in for, so the case can be
; reproduced without any large data file.
;
; The boundaryLayer case fills a laminar Blasius field automatically when no
; [restart] section is present. A strong trip (trip_amp = 0.6, CaNS-exact) trips
; that laminar inflow into turbulence; the production trip (0.18854) is weaker and
; is meant to sustain, not initiate -- which is why the production stages restart
; from a developed field. Run until the
; whole plate is turbulent and the initial transient has washed out (~2000 t.u.
; ~ 100k steps at dt = 0.02), then feed the final coldstart_<step>.h5 into
; production.ini as [restart] (rename it to restart_field.h5, or edit the
; [restart] file key). This regenerates restart_field.h5 from scratch, no large
; data needed.
;
; Same grid / flow / solver as the production stages (4096 x 224 x 192, geometric
; x, skew convection, red-black SOR). niter is raised to 12 here for robustness
; through the violent transition; niter = 6 suffices once developed.

[grid]
nx = 4096
ny = 224
nz = 192
lx = 750.0
ly = 100.0
lz = 32.0

[grid.x]
distribution = geometric
stretch = 1.5
[grid.z]
distribution = uniform

[flow]
re = 450.0
convection = skew

[time]
dt = 1.0e-3
nsteps = 100000
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 0.02

[pressure]
niter = 12
sor = 1.5
solver = redblack

[case.boundaryLayer]
; CaNS-exact trip (exact port; see production.ini). A COLD start from laminar
; Blasius needs a much stronger trip than the production restart -- trip_amp here is
; ~3x the production 0.18854 to guarantee transition triggers (over-tripping at cold
; start is harmless; it washes out before the production stages). Reduce toward the
; production value if the initial transient is too violent.
trip_amp = 0.6
trip_amp_s = 0.0
trip_x0 = 10.0
trip_lx = 4.0
trip_ly = 1.0
trip_ts = 4.0
trip_nmodes = 16
resolved_height = 36.0
dyw_plus = 0.221
stats_sample_interval = -1
stats_write_interval = -1
runtime_interval = 1000
runtime_file = coldstart_runtime.txt

; No [restart] section -> cold start from the analytic Blasius field.

[output]
field_interval = 20000
field_prefix = coldstart
