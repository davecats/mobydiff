[case]
name = boundaryLayer

; PHASE 2 (skewsym): statistics, 10000 t.u. on the exact CaNS grid. Compare vs
; CaNS / AMPHIBIOUS_TRIP_skewsym_CENTERED with assets/postpro/compare_codes.py.

[grid]
nx = 3200
ny = 384
nz = 135
lx = 650.0
ly = 100.0
lz = 26.0
[grid.x]
distribution = uniform
[grid.y]
distribution = cans
stretch = 2.822
[grid.z]
distribution = uniform
[flow]
re = 450.0
convection = skew
[time]
dt = 1.0e-3
nsteps = 500000
cflmax = 0.8
pecletmax = 0.5
dtmax = 0.02
[pressure]
niter = 6
sor = 1.5
solver = redblack
[case.boundaryLayer]
trip_amp = 0.18854
trip_amp_s = 0.0
trip_x0 = 10.0
trip_lx = 4.0
trip_ly = 1.0
trip_ts = 4.0
trip_nmodes = 16
stats_sample_interval = 25
stats_write_interval = 2000
runtime_interval = 1000
runtime_file = skewsym_stats_runtime.txt
stats_file = skewsym_stats.h5

[restart]
file = skewsym_175000.h5

[output]
field_interval = 50000
field_prefix = skewsym_p2
