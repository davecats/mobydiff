[case]
name = boundaryLayer

; COLD START: laminar Blasius + strong CaNS-exact trip -> turbulent, on the
; EXACT CaNS/AMPHIBIOUS grid (650x100x26, 3200x384x135, uniform x/z, one-sided
; tanh wall grid gr=2.822 = CaNS gtype=2). Skew convection for a stable cold
; start. Run ~2000 t.u., then feed the final field into production_*.

[grid]
nx = 3200
ny = 384
nz = 135
lx = 650.0
ly = 100.0
lz = 26.0

[grid.x]
distribution = uniform
[grid.y]
distribution = cans
stretch = 2.822
[grid.z]
distribution = uniform

[flow]
re = 450.0
convection = skew

[time]
dt = 1.0e-3
nsteps = 100000
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 0.02

[pressure]
niter = 6
sor = 1.5
solver = redblack

[case.boundaryLayer]
trip_amp = 0.6
trip_amp_s = 0.0
trip_x0 = 10.0
trip_lx = 4.0
trip_ly = 1.0
trip_ts = 4.0
trip_nmodes = 16
runtime_interval = 1000
runtime_file = coldstart_runtime.txt

[output]
field_interval = 25000
field_prefix = coldstart
