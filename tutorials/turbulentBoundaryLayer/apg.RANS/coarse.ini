[case]
name = boundaryLayer
file = ../smooth.RANS/coarse.case.h5

; 2D wall-resolved RANS of a turbulent boundary layer at a constant Clauser
; parameter beta = delta*/tau_w dP_e/dx = +0.5 (adverse pressure gradient) over
; x = 200 .. 650, on the ../smooth.RANS set-up -- same domain, Re, grid,
; Blasius inlet, k-omega SST, free stream and trip boxes. ONLY the top
; boundary differs: it stays an outlet, its pressure is the table ptop.txt
; (y_max_p_profile = table; p_top(650) = 0, the x = 650 outlet's level),
; found by ../smooth.RANS/assets/postpro/top_optimise.py (README "Procedure";
; the optimisation history is in opt/). beta, delta* and the edge follow
; ../smooth.RANS/assets/postpro/pg_bl.py.
;
; STAGE 1, the coarse grid (800 x 192): restarts from the converged ZPG
; coarse field ../smooth.RANS/coarse_38117.h5 (t = 1600) with the table and
; marches to t = 5100, steady (README). Its final field is interpolated onto
; the production grid (../smooth.RANS/assets/postpro/interp_restart.py).

[grid]
nx = 800
ny = 192
nz = 4
lx = 650.0
ly = 100.0
lz = 26.0

[grid.x]
distribution = uniform
[grid.y]
distribution = cans
stretch = 2.822
[grid.z]
distribution = uniform

[blocks]
nb = 200 192 4

[flow]
re = 450.0
convection = divergence

[time]
dt = 1.0e-3
nsteps = 1000000
t_final = 5100.0
cflmax = 1.0
pecletmax = 0.5
dtmax = 0.2

[pressure]
niter = 6
sor = 1.5
solver = redblack

[turbulence]
model = rans

; Laminar -> trip -> turbulent, the RANS analogue of the DNS trip (README
; "Laminar -> trip -> turbulent" and "Calibration"):
;  - free stream: the DNS one is laminar. Tu = 0.1 % with nut_inf = 0.15 nu
;    (k_inf = 1.5e-6 U^2, omega_inf = 0.0045 U/delta*_in), the Spalart &
;    Rumsey (AIAA J. 45, 2007) values, HELD by the ambient sustaining sources.
;    omega_inf must stay well below the outer-layer omega ~ U/delta: at
;    Tu = 1 % / nut_inf = nu (omega_inf = 0.068) it starved the outer nu_t and
;    c_f was 13-17 % low at Re_theta 700-800 instead of 5-7 %;
;  - transition = false: plain SST. The two boxes below already impose the
;    laminar -> turbulent sequence; the gamma-Re_thetat model added only a
;    buffer-layer intermittency deficit (gamma ~ 0.1-0.65 at y+ 10-20, from
;    its F_onset cut at R_T ~ 2.5) that cost 3-5 points of c_f and put grid-
;    row kinks into c_f(x);
;  - kpin_box: k = 0 over x < 10 (the DNS trip centre) through the layer and
;    well above it (y < 20): exactly laminar (Blasius) upstream of the trip;
;  - ktrip_box 1: a k source of 0.002 U^3/delta*_in per unit volume in
;    x = 10..15, y < 2 (inside delta_99 ~ 3) -- where the DNS forcing acts;
;  - ktrip_box 2: a weak k source, 2e-4 in x = 15..70, y < 3, standing in for
;    the DNS's slow transitional overshoot (its c_f peak is at x = 70). With
;    it Re_theta(x) follows the DNS from x ~ 100; without it the RANS layer
;    relaxes too fast after the trip and Re_theta lags by ~50 at x = 550.
[rans]
model = sst
transition = false
tu = 0.1
nut_ratio = 0.15
ambient_sustain = true
kpin_box = -1.0 10.0 -1.0 20.0 -1.0 30.0
ktrip_box = 10.0 15.0 -1.0 2.0 -1.0 30.0 0.002
ktrip_box = 15.0 70.0 -1.0 3.0 -1.0 30.0 2.0e-4

[case.boundaryLayer]
trip_enabled = false
runtime_interval = 1000
runtime_file = coarse_runtime.txt

[output]
field_interval = 10000
field_prefix = coarse

[boundary]
; the top outlet's pressure is the table ptop.txt (x, p_top), linearly
; interpolated, times y_max_p_value (docs/configuration.md "_table")
y_max_p_profile = table
y_max_p_value = 1.0
y_max_p_table = ptop.txt

[restart]
file = ../smooth.RANS/coarse_38117.h5
