[case]
name = boundaryLayer

; Best case (low trip 0.03 + standard grid = turbulent_lowtrip) but with a FINER
; STREAMWISE grid: nx 2048 -> 4096 so Dx+ ~ Dz+ (both ~4) in the developed region
; (was Dx+ ~8 vs Dz+ ~3.7). Tests whether the residual ~3.5% c_f offset vs the
; spectral reference is streamwise under-resolution. y grid unchanged (std blayer,
; ny=176, dy+_wall~0.22 -> dt stays 0.02: finer x does not touch the diffusive
; Peclet limit, and the CFL limit stays < 0.8). 4096 x 176 x 192 = 138 M cells.
;
; IC: case (i)'s developed field (../turbulent_lowtrip/production_p2_550000.h5,
; t=11000) interpolated onto the finer x-grid (restart_finex.h5, built by
; make_finex_restart.py). Trip 0.03 cannot trip a laminar start, so a restart
; from the developed low-trip field is required.
;
; Phase 1 (this file): re-equilibration on the finer x-grid, statistics OFF.

[grid]
nx = 4096
ny = 176
nz = 192
lx = 750.0
ly = 100.0
lz = 32.0

[grid.x]
distribution = geometric
stretch = 1.5
[grid.z]
distribution = uniform

[flow]
re = 450.0
convection = skew

[time]
dt = 1.0e-3
nsteps = 200000
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 0.02

[pressure]
niter = 12
sor = 0.8
accel = chebyshev

[case.boundaryLayer]
trip_amp = 0.03
trip_nmodes = 24
resolved_height = 36.0
stats_sample_interval = 50
stats_write_interval = 2000
runtime_interval = 1000
runtime_file = production_stats_runtime.txt
stats_file = production_stats.h5

[restart]
file = production_100000.h5

[output]
field_interval = 50000
field_prefix = production_p2
