[case]
name = boundaryLayer

; ROUGH-WALL variant of production_stats.ini: the same domain, grid, trip,
; CONS convection and projection, plus an immersed egg-carton roughness
; downstream of the transition region, adapted from the full-span channel of
; MacDonald, Chan, Chung, Hutchins & Ooi (JFM 804, 2016, table 1):
; z_w = k cos(2 pi x/lambda) cos(2 pi z/lambda), k+ = 10 (semi-amplitude),
; lambda+ = 113, solidity (4/pi) k/lambda = 0.113, Delta U+ = 3.72 at
; Re_tau 180. k/lambda = 10/113 is EXACT here; k+ follows the local u_tau
; of the layer (8-9 on the smooth-wall u_tau, ~10 on the rough-wall one):
; lambda = 650/150 = 26/6 = 4.3333 (21 x-cells, 23 z-cells per wave),
; k = 0.38348, crests at 2k = 0.767 (50 wall-normal cells).
; The roughness grows in over x = 120..160 (wall_x_start + wall_ramp; the
; transition is complete by x ~ 80 on the smooth reference) and runs
; through the outlet: the immersed body crosses the outlet plane, which is
; what validation/body_outlet/ gates. Restart from the smooth developed
; field (production_p2_*.h5); the first flow-through is the transient.

[grid]
nx = 3200
ny = 384
nz = 136
lx = 650.0
ly = 100.0
lz = 26.0
[grid.x]
distribution = uniform
[grid.y]
distribution = cans
stretch = 2.822
[grid.z]
distribution = uniform
[flow]
re = 450.0
convection = divergence
[time]
dt = 1.0e-3
nsteps = 500000
cflmax = 0.8
pecletmax = 0.5
dtmax = 0.02
[pressure]
niter = 6
sor = 1.5
solver = redblack
[case.boundaryLayer]
trip_amp = 0.18854
trip_amp_s = 0.0
trip_x0 = 10.0
trip_lx = 4.0
trip_ly = 1.0
trip_ts = 4.0
trip_nmodes = 16
stats_sample_interval = 25
stats_write_interval = 2000
runtime_interval = 1000
runtime_file = rough_stats_runtime.txt
stats_file = rough_stats.h5

[ibm]
enabled = true
wall_shape = eggcarton
amp_x = 0.38348082595870
wall_offset = 0.38348082595870
n_wave_x = 150
n_wave_z = 6
phase_x = 1.5707963267948966
phase_z = 1.5707963267948966
wall_x_start = 120.0
wall_ramp = 40.0

[restart]
file = production_p2_675000.h5

[output]
field_interval = 50000
field_prefix = rough_p2
