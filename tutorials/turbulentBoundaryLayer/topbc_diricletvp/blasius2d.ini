[case]
name = generic

; Quasi-2D laminar zero-pressure-gradient flat-plate boundary layer, the
; precursor of the turbulent-BL case. Lengths are nondimensionalized with
; the INLET momentum thickness theta_in = 1, velocities with U_inf = 1, so
; [flow] re = Re_theta at the inlet. The x_min inlet carries the Blasius
; similarity profile (u AND the v entrainment component); x_max is a
; pressure-Dirichlet outlet; the top (y_max) combines a DIRICHLET p = 0
; (the freestream-pressure pin of the outlet top) with the wall-normal v
; PRESCRIBED from the Blasius entrainment and Neumann u -- an attempt to
; pin ZPG AND impose the entrainment at once. NOTE: v and p are a
; conjugate pair at an incompressible boundary, so this is formally
; over-specified; see the README for what the solver actually does with
; it. y_min is the no-slip plate.
;   Re_theta,in = 100  ->  virtual origin x_v = Re_theta/beta^2 = 226.7,
;   delta99_in ~ 7.5, Re_theta at the outlet (x = 400) ~ 166 (still well
;   below the ~200 Tollmien-Schlichting threshold: steady laminar).
; Verify with compare_blasius.py <last snapshot>.

[grid]
nx = 384
ny = 160
nz = 4
lx = 400.0
ly = 100.0
lz = 4.0

[grid.x]
distribution = uniform
[grid.y]
; one-sided natural stretching: dy_wall ~ 0.18 theta, 31 points inside the
; inlet delta99, 3.8% max growth
distribution = natural
one_sided = true
stretch = 40.0
dyw_plus = 1.0
[grid.z]
distribution = uniform

[ibm]
enabled = false

[flow]
re = 100.0
initial_u = 1.0

[time]
dt = 1.0e-2
nsteps = 4000
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 0.5

[pressure]
niter = 6
sor = 0.8
; NO accel = chebyshev here: in this configuration (Dirichlet-p outlet on
; TWO faces + stretched y) the Chebyshev semi-iteration slowly pumps a
; 2-dx pressure mode (e-fold ~36 t.u., saturating with O(1) divergence);
; plain damped Jacobi is contractive for every mode and dead stable.
; See the README finding.

[boundary]
periodic_x = false
periodic_y = false
periodic_z = true
x_min_patch = inlet
x_min_u_value = 1.0
x_min_u_profile = blasius
x_min_v_value = 1.0
x_min_v_profile = blasius
blasius_theta = 1.0
x_max_patch = outlet
y_min_patch = wall
; Top Dirichlet-p + prescribed-v BC: generic face with Dirichlet p = 0,
; Neumann u, w Neumann 0 (quasi-2D), and v prescribed from the x-varying
; Blasius entrainment. NB: the projection only activates the pressure pin
; (outlet-style face correction) for a declared `outlet` patch; on a
; generic face it treats a physical face as pinned-velocity / Neumann-phi
; regardless of p_type, so the Dirichlet p here acts only through the
; momentum pressure-ghost. See the README.
y_max_patch = patch
y_max_u_type = neumann
y_max_u_value = 0.0
y_max_v_type = dirichlet
y_max_v_value = 1.0
y_max_v_profile = blasius
y_max_w_type = neumann
y_max_w_value = 0.0
y_max_p_type = dirichlet
y_max_p_value = 0.0

[restart]
; the Blasius similarity field (make_blasius_ic.py; mint the template with
; template.ini first) -- the run then only has to hold the solution
file = IC_blasius.h5

[output]
field_interval = 2000
field_prefix = blasius2d
