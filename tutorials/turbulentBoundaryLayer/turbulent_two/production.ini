[case]
name = boundaryLayer

; PRODUCTION ZPG turbulent boundary layer DNS -- "turbulent_two": a refined
; reproduction of the in-house spectral TBL DNS (../turbulent/tbl_uncontrolled.mat),
; capped at Re_theta <= 900. delta*_0 = 1, [flow] re = Re_delta*,0 = 450, so the
; nondimensionalization matches the spectral data exactly (verified from its
; momentum integral, nu = u_tau^2/(dRe_theta/dx) -> 1/nu ~ 456). The laminar
; Blasius inlet is at Re_theta = 173.7 and the Schlatter & Orlu trip sits at
; x0 = 15; transition completes by Re_theta ~ 390, matching where the spectral
; data begins (it is cropped to the turbulent region).
;
; Two changes vs ../turbulent (see README):
;   1. domain extended lx 500 -> 750 so the healthy turbulent range reaches
;      Re_theta = 900 (at x ~ 645, before the outflow zone);
;   2. GEOMETRIC x-grid (stretch = 1.5): dx grows downstream as u_tau falls, so
;      dx+ stays ~8 instead of ballooning to ~16 in the transition region that a
;      uniform x-grid leaves under-resolved.
; Also uses the skew-symmetric convection form ([flow] convection = skew).
;
; Phase 1 (this file): develop transition + wash out the transient with field
; checkpoints; statistics OFF. Phase 2 (production_stats.ini) restarts with
; stats sampling on.
;
; Grid 2048 x 176 x 192 = 69.2M cells. dx+ ~ 7.4 (core) to ~12 (trip) to ~9.4
; (outlet); dy+_wall ~ 0.2; dz+ ~ 3.5.

[grid]
nx = 2048
ny = 176
nz = 192
lx = 750.0
ly = 100.0
lz = 32.0

[grid.x]
; geometric: cells grow by a constant ratio from the inlet (finest at x=0,
; coarsest at x=lx). stretch = last/first cell-width ratio. Compensates for
; the streamwise boundary-layer development so dx+ stays ~uniform.
distribution = geometric
stretch = 1.5
[grid.z]
distribution = uniform
; grid.y: blayer (resolve BL, coarsen freestream) is a boundaryLayer default

[flow]
re = 450.0
; skew-symmetric momentum convection (energy-neutral for any advecting field)
convection = skew

[time]
dt = 1.0e-3
nsteps = 100000
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 0.02

[pressure]
niter = 8
sor = 0.8
accel = chebyshev

[case.boundaryLayer]
trip_amp = 0.15
trip_nmodes = 24
; resolved_height raised 30 -> 36: delta99(Re_theta=900) ~ 16, so the
; wall-resolved band is ~2.25 delta99 at the outlet.
resolved_height = 36.0
; statistics OFF during the transient; health line every 1000 steps
stats_sample_interval = -1
stats_write_interval = -1
runtime_interval = 1000
runtime_file = production_runtime.txt

[output]
field_interval = 20000
field_prefix = production
