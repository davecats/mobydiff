[grid]
nx = 200          ; number of points in the streamwise direction
ny = 200          ; number of points in the wall-normal direction
nz = 200          ; number of points in the spanwise direction
lx = 1.0
ly = 1.0
lz = 1.0

[grid.x]
distribution = uniform

[grid.y]
distribution = uniform ; use tanh/cosine and stretch > 0 for nonuniform grids
stretch = 0.0

[grid.z]
distribution = uniform

[mpi]
dims = 0 0 0       ; 0 lets MPI choose that Cartesian direction

[flow]
re = 100.0
forcing_x = 1.0
forcing_y = 0.0
forcing_z = 0.0

[time]
dt = 1.0e-4
nsteps = 5
t_final = 5.0e-4
cflmax = 0.0
pecletmax = 0.5
dtmax = 1.0e-4

[pressure]
niter = 3          ; red-black SOR iterations

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

y_min_p_type = neumann
y_max_p_type = neumann

[output]
interval = 0       ; use 0 to disable HDF5/XDMF output
prefix = data
field_interval = 0 ; use >0 to write full staggered fields in HDF5
field_prefix = field

[restart]
; file = field_10.h5 ; uncomment to continue from an HDF5 field file
