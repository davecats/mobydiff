[case]
name = channel

[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.3
small_noise_amplitude = 0.1
stats_sample_interval = 0
stats_write_interval = 0
stats_file = channel_stats.h5
runtime_file = runtimedata.txt

[grid]
nx = 128
ny = 64
nz = 16
lx = 12.566370614359172
ly = 2.0
lz = 0.7853981633974483

[grid.x]
distribution = uniform

[grid.y]
distribution = natural
stretch = 16
natural_dyw_plus = 0.5

[grid.z]
distribution = uniform

; Both wall bands refined to level 1: 3 block rows = 24 base cells,
; interface at y = 0.6205 (y+ = 112). Box edges sit inside the last
; refined block row so exactly rows 0-2 are refined (and mirrored at the
; top wall). 12800 leaves, 12288 fine.
[blocks]
nb = 8

[flow]
re = 180.0
forcing_x = 1.0

[time]
nsteps = 4000
dt = 1.0e-5
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 3.125e-4

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[output]
field_interval = 250
field_prefix = channel_field

