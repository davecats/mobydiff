; Branch c24: Chebyshev niter 24, t 12 -> 22, a snapshot every 0.1 c/U.
; (sd_seed.ini carries the description of the case and of the stages.)
[case]
name = airfoil
file = sd.case.h5

[case.airfoil]
aoa = 4.0
u_inf = 1.0
chord = 1.0
force_sample_interval = 20
cv_box = 4.0 6.25 5.5 6.5
runtime_file = forces_sd_c24.txt

; 12 c x 12 c x 0.25 c, base c/32 (isotropic), leading edge at (4.5, 6.0)
[grid]
nx = 384
ny = 384
nz = 8
lx = 12.0
ly = 12.0
lz = 0.25

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

; level 5 = c/1024 on the whole surface (refine_body) and in the box that
; holds the bubble, the detached shear layer and the turbulent layer to
; 0.06 c behind the trailing edge; no 2:1 interface between the wall and
; y = 6.125. The coarser boxes follow the wake, which leaves at +4 deg.
[blocks]
nb = 8
refine_body = true
refine_levels = 5
refine = 4.59375 5.5625 5.96875 6.125  -1.0 1.0 5
refine = 4.4375  6.0    5.90625 6.1875 -1.0 1.0 4
refine = 4.25    7.0    5.8125  6.3125 -1.0 1.0 3
refine = 4.0     9.0    5.5     6.75   -1.0 1.0 2
refine = 3.5     12.0   5.0     7.5    -1.0 1.0 1

[ibm]
enabled = true
stl_file = sd7003.stl

[flow]
re = 6.0e4

[turbulence]
model = none

[time]
dt = 4.0e-4
nsteps = 25000
t_final = 0
cflmax = 1.0
pecletmax = 0.5
dtmax = 4.0e-4

[pressure]
accel = chebyshev
niter = 24

[output]
field_interval = 250
field_prefix = sd_c24
trace_interval = 100

[restart]
file = sd_30000.h5
