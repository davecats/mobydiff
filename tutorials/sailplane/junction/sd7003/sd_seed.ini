; Step 3b of docs/next_session_sailplane_junction.md: the projection-residual
; floor on the unforced SD7003 laminar separation bubble, Re_c = 6e4, alpha 4.
; No model (the production DNS core is model-free), octree refinement to
; c/1024 over the suction side (Delta+ ~ 4 behind the reattachment, the
; production core's wall spacing in wall units), span 0.25 c periodic.
;
; This file is STAGE 0: the impulsive start, 7500 steps (t 3), with a weak random
; wall-normal trip in the front of the bubble (x/c 0.3) as the ONLY source
; of spanwise variation -- the geometry, the grid and the start are exactly
; span-uniform, so without it the flow stays two-dimensional for ever. The
; later stages switch it off: sd_dev.ini (t 3 -> 12, the common developed
; state) and the three branches sd_c12 / sd_c24 / sd_rb (t 12 -> 22).
[case]
name = airfoil
file = sd.case.h5

[case.airfoil]
aoa = 4.0
u_inf = 1.0
chord = 1.0
force_sample_interval = 20
cv_box = 4.0 6.25 5.5 6.5
runtime_file = forces_sd.txt

; 12 c x 12 c x 0.25 c, base c/32 (isotropic), leading edge at (4.5, 6.0)
[grid]
nx = 384
ny = 384
nz = 8
lx = 12.0
ly = 12.0
lz = 0.25

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

; level 5 = c/1024 on the whole surface (refine_body) and in the box that
; holds the bubble, the detached shear layer and the turbulent layer to
; 0.06 c behind the trailing edge; no 2:1 interface between the wall and
; y = 6.125. The coarser boxes follow the wake, which leaves at +4 deg.
[blocks]
nb = 8
refine_body = true
refine_levels = 5
refine = 4.59375 5.5625 5.96875 6.125  -1.0 1.0 5
refine = 4.4375  6.0    5.90625 6.1875 -1.0 1.0 4
refine = 4.25    7.0    5.8125  6.3125 -1.0 1.0 3
refine = 4.0     9.0    5.5     6.75   -1.0 1.0 2
refine = 3.5     12.0   5.0     7.5    -1.0 1.0 1

[ibm]
enabled = true
stl_file = sd7003.stl

[flow]
re = 6.0e4

[turbulence]
model = none

[time]
dt = 4.0e-4
nsteps = 7500
t_final = 0
cflmax = 1.0
pecletmax = 0.5
dtmax = 4.0e-4

[pressure]
accel = chebyshev
niter = 12

; the 3D seed: velocity gain ~ amp x (lx / u_local) ~ 1e-3 U
[force]
enabled = true
type = trip
trip_x0 = 4.8
trip_lx = 0.02
trip_ly = 0.01
trip_y0 = 6.055
trip_amp = 0.02
trip_ts = 0.05
trip_nmodes = 16

[output]
field_interval = 7500
field_prefix = sd
trace_interval = 100
