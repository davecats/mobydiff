; Sailplane wing-fuselage junction, step 2: the CALIBRATION BOX
; (docs/next_session_sailplane_junction.md section 4). A cheap truncated
; model at the production topology: chord units (root chord 0.831 m = 1),
; Re_c 3e5, the STL pitched offline by alpha (stl_sections.py rotate, about
; the root quarter chord), the symmetry plane at y = 0, the wing truncated
; by a free-slip face at the cut, the fuselage boom through the outlet.
; Fully turbulent SST with wall functions at Delta = c/512 (Delta+ about 27):
; no bubble, so alpha is TRANSFERRED from the lifting line (1.5 deg at
; C_L 1.0), not fitted here (section 4.4). The four runs differ in
; alpha (1.0 / 1.5 / 2.0: stl_file, prefixes) and in the cut (3.5 c /
; 4.5 c: ny, ly) -- README.md has the sed that derives them from this file.
[case]
name = generic
file = calib_a1.5_y3.5.case.h5

[grid]
; 11.0 c: the nose at x = 4 c, the outlet 2.8 c behind the root trailing
; edge (the fin at x 13.3-14.3 c is cut away: no horizontal tail exists).
; 3.5 c: the symmetry plane to the cut, the fuselage side at 0.56 c.
; 20 c: the root quarter chord at mid-height. Base cell c/16 everywhere.
nx = 176
ny = 56
nz = 320
lx = 11.0
ly = 3.5
lz = 20.0

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

; 8-cell blocks: 22 x 7 x 40 = 6160 base leaves; five body-driven levels
; put c/512 on the whole surface (about 55 000 leaves, 28 M cells).
; keep_buried off: no penalization force is read at runtime, every load
; comes from strip_loads.py on the snapshots.
[blocks]
nb = 8
refine_body = true
refine_body_levels = 5
refine_levels = 5
refine_dims = xyz
keep_buried = false

; The CAD STL (millimetres) pitched 1.5 deg nose-up, scaled to chords
; (1/831) and translated: nose at x = 4 c, the STL's symmetry plane at
; y = 0, the root quarter chord (z 0.47 m) at z = 10 c.
[ibm]
enabled = true
stl_file = "frue_a1.5.stl"
stl_scale = 1.20337e-3
stl_translate = 4.0 0.0 9.434

[flow]
re = 3.0e5

[turbulence]
model = rans

[rans]
model = sst
wall_treatment = wall_function
tu = 1.0
nut_ratio = 10.0
ambient_sustain = false

; 10 c/U transient + 5 c/U of samples; dt about 1.3e-3 at cflmax 1 and
; c/512, 11 500 steps.
[time]
dt = 1.0e-3            ; the first step; adapted by cflmax / pecletmax under dtmax from there on
nsteps = 100000000
t_final = 15.0
cflmax = 1.0
pecletmax = 0.5
dtmax = 2.0e-3

; Chebyshev-Jacobi 12 (the re-validation convention). Fall back to
; solver = redblack, sor = 1.5, niter = 6 if the outlet case diverges.
[pressure]
accel = chebyshev
niter = 12

[output]
field_interval = 2000
field_prefix = calib_a1.5_y3.5

; As tutorials/sailplane/input.ini: uniform inflow at x_min (Neumann p),
; the declared outlet at x_max (the boom crosses it: validation/body_outlet),
; y faces (the symmetry plane and the cut) and z faces free-slip.
[boundary]
periodic_x = false
periodic_y = false
periodic_z = false

x_min_u_value = 1.0
x_min_v_value = 0.0
x_min_w_value = 0.0
x_min_p_type = neumann

x_min_patch = inlet          ; declared: absent, the Dirichlet tangential velocities make the RANS infer a WALL here
x_max_patch = outlet

y_min_u_type = neumann
y_min_v_type = dirichlet
y_min_v_value = 0.0
y_min_w_type = neumann
y_min_p_type = neumann

y_max_u_type = neumann
y_max_v_type = dirichlet
y_max_v_value = 0.0
y_max_w_type = neumann
y_max_p_type = neumann

z_min_u_type = neumann
z_min_v_type = neumann
z_min_w_type = dirichlet
z_min_w_value = 0.0
z_min_p_type = neumann

z_max_u_type = neumann
z_max_v_type = neumann
z_max_w_type = dirichlet
z_max_w_value = 0.0
z_max_p_type = neumann
