; 2D twin of the calibration box's wing section (y = 1.0 m, chord 0.768 m,
; sliced from the unpitched STL by stl_sections.py and extruded by
; tools/make_airfoil_stl.py), 2026-11-04: the box carries half the XFOIL
; lift and its SST boundary layer is LAMINAR to 0.3-0.4 c (bl_probe.py on
; the c/2048 snapshot). This run = the box's turbulence settings (tu 1 %,
; nut_ratio 10, no trip) on the NACA tutorial's 2D template at the same
; incidence to the chord line (3.8 deg) and Reynolds number (2.77e5).
; Twin `.sec2d_trip.ini` adds the NACA validation's k pin + trip strips.
[case]
file = sec2d.case.h5
name = airfoil
[case.airfoil]
aoa = 3.8                    ; 1.5 deg box pitch + 2.3 deg chord-line incidence of the STL
u_inf = 1.0
chord = 1.0
span = y
force_sample_interval = 20
cv_box = 48.5 52.5 46.5 49.5
runtime_file = forces_sec2d_notrip.txt
[grid]
nx = 384
ny = 8
nz = 288
lx = 128.0
ly = 0.1875
lz = 96.0
[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform
[blocks]
nb = 8
refine_body = true
refine_levels = 10           ; c/3072 at the body (the box's c/2048 is between 9 and 10); y+ about 2.3
refine_dims = xz
refine = 49.75 52.50 -1.0 10.0 47.70 48.30 6
refine = 49.25 54.00 -1.0 10.0 47.20 48.80 5
refine = 48.25 56.00 -1.0 10.0 46.20 49.80 4
refine = 46.75 59.00 -1.0 10.0 44.70 51.30 3
refine = 44.75 63.00 -1.0 10.0 42.70 53.30 2
refine = 42.25 68.00 -1.0 10.0 40.20 55.80 1
[ibm]
enabled = true
stl_file = "sec_y1.0_2d.stl"
[flow]
re = 2.77e5                  ; Re of the y = 1.0 m section: 3e5 x 0.768 / 0.831
initial_u = 0.99780          ; the uniform stream at 3.8 deg (a start from rest is an impulsive transient)
initial_w = 0.06627
[turbulence]
model = rans
[rans]
model = sst
wall_treatment = resolved
tu = 1.0
nut_ratio = 10.0
ambient_sustain = false
[time]
dt = 1.0e-4
nsteps = 100000000
t_final = 15.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 2.0e-4
[pressure]
niter = 18
sor = 0.8
accel = chebyshev
[output]
field_interval = 20000
field_prefix = sec2d_notrip
trace_interval = 500
