; CORRECTED INCIDENCE (2026-11-05): sec_y1.0_2d.stl keeps the wing's own 2.285 deg chord-line incidence,
; so aoa 3.8 put the twins at 6.085 deg; the box sits at 1.5 + 2.285 = 3.785 deg -> aoa 1.5 here.
; 2D twin of the calibration box's wing section (see .sec2d_notrip.ini)
; WITH forced transition the way the NACA validation reproduces OpenFOAM's
; fvOptions (tutorials/naca/rans/c11_aoa5.ini): k pinned to zero ahead of
; the strip and volumetric k sources in the fluid cells hugging both
; surfaces at x/c 0.02-0.04 (XFOIL's forced transition at 0.02 gave
; c_l 0.79 on this section). Two boxes per surface follow the surface
; slope (upper y/c 0.024-0.036, lower -0.011 to -0.014 over the strip).
[case]
file = sec2d.case.h5
name = airfoil
[case.airfoil]
aoa = 1.5
u_inf = 1.0
chord = 1.0
span = y
force_sample_interval = 20
cv_box = 48.5 52.5 46.5 49.5
runtime_file = forces_sec2d_trip_a15.txt
[grid]
nx = 384
ny = 8
nz = 288
lx = 128.0
ly = 0.1875
lz = 96.0
[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform
[blocks]
nb = 8
refine_body = true
refine_levels = 10
refine_dims = xz
refine = 49.75 52.50 -1.0 10.0 47.70 48.30 6
refine = 49.25 54.00 -1.0 10.0 47.20 48.80 5
refine = 48.25 56.00 -1.0 10.0 46.20 49.80 4
refine = 46.75 59.00 -1.0 10.0 44.70 51.30 3
refine = 44.75 63.00 -1.0 10.0 42.70 53.30 2
refine = 42.25 68.00 -1.0 10.0 40.20 55.80 1
[ibm]
enabled = true
stl_file = "sec_y1.0_2d.stl"
[flow]
re = 2.77e5
initial_u = 0.99966
initial_w = 0.02618
[turbulence]
model = rans
[rans]
model = sst
wall_treatment = resolved
tu = 1.0
nut_ratio = 10.0
ambient_sustain = false
kpin_box  = 49.00 50.015 -1.0 10.0 47.90 48.10
ktrip_box = 50.020 50.030 -1.0 10.0 48.021 48.034 0.385
ktrip_box = 50.030 50.040 -1.0 10.0 48.027 48.040 0.385
ktrip_box = 50.020 50.030 -1.0 10.0 47.984 47.991 0.385
ktrip_box = 50.030 50.040 -1.0 10.0 47.981 47.989 0.385
[time]
dt = 1.0e-4
nsteps = 100000000
t_final = 15.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 2.0e-4
[pressure]
niter = 18
sor = 0.8
accel = chebyshev
[output]
field_interval = 20000
field_prefix = sec2d_trip_a15
trace_interval = 500
