; 2D analogue of the CALIBRATION BOX itself (2026-11-05): the y 1.0 m section
; pitched 3.8 deg (the box's 1.5 deg + the STL's 2.27 deg chord-line
; incidence) in the box's own domain and boundaries -- inlet 7 c ahead of
; the leading edge, the declared outlet 2.8 c behind the trailing edge,
; free-slip faces 10 c above and below, uniform axial inflow -- at the box's
; turbulence settings and projection. The question: the 2D twins on the
; NACA template's 128 x 96 c far-field domain give c_l 0.73 (XFOIL
; turbulent 0.77) with and without the trip, the 3D box 0.37-0.41 on the
; same section: is it the box's domain / boundaries, or something 3D?
[case]
file = wing512.case.h5
name = airfoil
[case.airfoil]
aoa = 0.0                    ; the STL carries the incidence, the inflow is axial as in the box
u_inf = 1.0
chord = 0.924
span = y
force_sample_interval = 20
cv_box = 5.5 9.5 8.5 11.5
runtime_file = forces_wing512.txt
[grid]
nx = 176
ny = 8
nz = 320
lx = 11.0
ly = 0.5                     ; a 0.5 c slab of the extruded section between free-slip y faces (the box: v = 0 at the symmetry plane and the cut)
lz = 20.0
[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform
[blocks]
nb = 8
refine_body = true
refine_levels = 5            ; c/512 with wall functions: the c/512 box's settings
refine_dims = xyz           ; the box's 3D refinement
[ibm]
enabled = true
; the REAL pitched aircraft STL of the box, shifted so that the domain's y range
; 0-0.5 c holds the wing between y_STL 1.0 and 1.415 m (the fuselage, |y| < 0.56 c,
; lies outside the domain; the wing passes through both free-slip y faces as the
; extruded slab does). Chord there 0.768-0.760 m = 0.924 root chords.
stl_file = "../frue_a1.5.stl"
stl_scale = 1.20337e-3
stl_translate = 4.0 -1.2034 9.434
[flow]
re = 2.77e5
initial_u = 1.0
[turbulence]
model = rans
[rans]
model = sst
wall_treatment = wall_function
tu = 1.0
nut_ratio = 10.0
ambient_sustain = false
[time]
dt = 1.0e-3
nsteps = 100000000
t_final = 15.0
cflmax = 1.0
pecletmax = 0.5
dtmax = 2.0e-3
[pressure]
solver = redblack
sor = 1.5
niter = 6
[output]
field_interval = 20000
field_prefix = wing512
trace_interval = 500
; the box's boundaries verbatim (calib_a1.5_y3.5_l7.ini): these keys
; override the airfoil case's far-field Dirichlet faces in the lift direction
[boundary]
periodic_x = false
periodic_y = false
y_min_patch = patch
y_min_u_type = neumann
y_min_v_type = dirichlet
y_min_v_value = 0.0
y_min_w_type = neumann
y_min_p_type = neumann
y_max_patch = patch
y_max_u_type = neumann
y_max_v_type = dirichlet
y_max_v_value = 0.0
y_max_w_type = neumann
y_max_p_type = neumann
periodic_z = false
x_min_u_value = 1.0
x_min_v_value = 0.0
x_min_w_value = 0.0
x_min_p_type = neumann
x_min_patch = inlet
x_max_patch = outlet
z_min_patch = patch           ; undeclare the airfoil case's far-field inlet on the lift faces: free-slip as the box
z_min_u_type = neumann
z_min_v_type = neumann
z_min_w_type = dirichlet
z_min_w_value = 0.0
z_min_p_type = neumann
z_max_patch = patch
z_max_u_type = neumann
z_max_v_type = neumann
z_max_w_type = dirichlet
z_max_w_value = 0.0
z_max_p_type = neumann
