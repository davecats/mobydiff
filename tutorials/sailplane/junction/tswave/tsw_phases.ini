[case]
name = generic
file = tswave.case.h5
; TS-WAVE TEST, base flow (docs/next_session_sailplane_junction.md section
; 5.1, step 3): the laminar Blasius boundary layer over an IMMERSED flat
; plate (the analytic wavy wall with zero amplitude at y = 10.8) on a
; uniform grid, h = 0.45 theta_in in every direction -- 6.8 cells per
; delta* at the forcing station (Re_delta* 750), 8.9 at Re_delta* 1000,
; 12 at 1340: the production DNS core's delta*/7. Lengths in the inlet
; momentum thickness theta_in = 1, U = 1, [flow] re = Re_theta,in = 250
; (Re_delta*,in 648, virtual origin x_v = 567 upstream of the inlet). The
; inlet carries the Blasius u and v profiles raised to the plate
; (blasius_y0); the top is the same pressure outlet as validation/blasius;
; x_max is the outlet. Re_delta* runs 648 -> 1450 over lx = 2502 (Re_x
; 1.4e5 -> 7.6e5): the F = 0.9e-4 Tollmien-Schlichting wave is neutral
; at Re_delta* 770 (branch I) and 1340 (branch II), amplified e^2.5 in
; between (orr_sommerfeld.py). This run holds the plate flow from the
; impulsive start (initial_u = 1) for two flow-throughs; tsw.ini forces
; the wave on its final field.
[grid]
nx = 5560
ny = 424
nz = 8
lx = 2502.0
ly = 190.8
lz = 3.6
[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform
[blocks]
nb = 8
[ibm]
enabled = true
wall_shape = wavy
amp_x = 0.0
n_wave_x = 1
wall_offset = 10.8
[flow]
re = 250.0
initial_u = 1.0
[time]
dt = 0.4
nsteps = 696
t_final = 0.0
cflmax = 1.0
pecletmax = 0.5
dtmax = 0.4
[pressure]
niter = 12
accel = chebyshev
[boundary]
periodic_x = false
periodic_y = false
periodic_z = true
x_min_patch = inlet
x_min_u_value = 1.0
x_min_u_profile = blasius
x_min_v_value = 1.0
x_min_v_profile = blasius
blasius_theta = 1.0
blasius_y0 = 10.8
x_max_patch = outlet
y_min_patch = wall
y_max_patch = outlet
[output]
field_interval = 87
field_prefix = tswp
trace_interval = 500
[restart]
; the end of the forced stage (tsw.ini)
file = tsw_43500.h5
[force]
; the vibrating ribbon: a harmonic, spanwise-uniform v force in a Gaussian
; strip (2 delta* long, 1 delta* high) on the plate at x = 200
; (Re_delta* 753, just upstream of branch I), omega = F Re_theta,in =
; 0.9e-4 * 250 = 0.0225 (period 279 theta/U = 698 steps); the amplitude
; keeps the response linear (u'/U ~ 1e-4). 6400 theta/U here (the wave
; front, c_g ~ 0.35 U, passes the end of the read-out range plus 3 periods), then
; tsw_phases.ini samples one period in 8 snapshots.
enabled = true
type = trip
trip_x0 = 200.0
trip_lx = 6.0
trip_ly = 2.0
trip_y0 = 10.8
trip_amp = 1.0e-5
trip_omega = 0.0225
