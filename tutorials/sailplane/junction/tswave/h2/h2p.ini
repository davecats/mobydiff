[case]
name = generic
file = h2.case.h5
; TS-WAVE TEST AT HALF THE SPACING (the h/2 convergence check of the
; tswave case, docs/next_session_sailplane_junction.md step 3a): the same
; Blasius layer over the immersed plate, h = 0.2 theta_in -- delta*/14 at
; the forcing station (Re_delta* 755) against the parent case's delta*/6.8
; -- on the sub-range Re_delta* 700 -> 1150 where the parent measured a
; growth rate 11 % below parallel Orr-Sommerfeld. Inlet Re_theta,in = 270
; (Re_delta*,in 700, x_v = 612), the ribbon at x = 100 (Re_delta* 755, as
; in the parent), omega = F Re_theta,in = 0.9e-4 * 270 = 0.0243 (period
; 259 = 1440 steps of dt 0.18), read-out x 60 .. 935 (Re_delta* 1100).
; Base flow from the impulsive start for t 5760: U t / (x + x_v) = 3.7 at
; x 935 (the parent converged to 0.3 % at that age).
[grid]
nx = 5504
ny = 568
nz = 8
lx = 1100.8
ly = 113.6
lz = 1.6
[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform
[blocks]
nb = 8
[ibm]
enabled = true
wall_shape = wavy
amp_x = 0.0
n_wave_x = 1
wall_offset = 9.6
[flow]
re = 270.0
initial_u = 1.0
[time]
dt = 0.18
nsteps = 1440
t_final = 0.0
cflmax = 1.0
pecletmax = 0.5
dtmax = 0.18
[pressure]
niter = 12
accel = chebyshev
[boundary]
periodic_x = false
periodic_y = false
periodic_z = true
x_min_patch = inlet
x_min_u_value = 1.0
x_min_u_profile = blasius
x_min_v_value = 1.0
x_min_v_profile = blasius
blasius_theta = 1.0
blasius_y0 = 9.6
x_max_patch = outlet
y_min_patch = wall
y_max_patch = outlet
[output]
field_interval = 180
field_prefix = h2p
trace_interval = 1000
[restart]
; the end of the forced stage (h2w.ini)
file = h2w_49800.h5
[force]
; the vibrating ribbon of the parent case at the same Re_delta* (755):
; 17 800 steps = 3200 theta/U, the wave front (c_g ~ 0.35 U) past x 935
; plus three periods; h2p.ini then samples one period in 8 snapshots.
enabled = true
type = trip
trip_x0 = 100.0
trip_lx = 6.0
trip_ly = 2.0
trip_y0 = 9.6
trip_amp = 1.0e-5
trip_omega = 0.0243
