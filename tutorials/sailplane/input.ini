[case]
name = generic
; THE case file: grid + block layout + IBM coefficients, written from the
; [blocks] and [ibm] keys below by `mpirun -n 2 ../../build_cpu/moby_prepare
; input.ini` (minutes on 2 CPU ranks; prepare/solve split, numerics review
; step 7). The solver only reads it and refuses a stale one (grid, block
; size, STL transform or re changed) with the key named: re-run moby_prepare.
file = sailplane_case.h5

[grid]
; Original STL bounding box, in metres after scale 0.001:
; length = 8.644325, span = 19.489268, height = 1.950183.
; The computational domain is half of the 5-span box:
; x = 5*length, y = 2.5*span, z = 5*height.
; Large single-GPU smoke size for the 6 GB Quadro RTX 3000 on this PC.
; Kept slightly below the memory ceiling so STL preprocessing remains stable in WSL.
nx = 400
ny = 450
nz = 100
lx = 43.22162499838677
ly = 48.72317
lz = 9.750915

[grid.x]
distribution = uniform

[grid.y]
distribution = uniform

[grid.z]
distribution = uniform

[mpi]
dims = 0 0 0

[flow]
; Starter value only. The case file carries 1/Re: re-prepare if this changes.
re = 1.0e5
forcing_x = 0.0
forcing_y = 0.0
forcing_z = 0.0

[time]
dt = 1.0e-3
nsteps = 1
t_final = 1.0e-3
cflmax = 0.5
pecletmax = 0.5
dtmax = 1.0e-3

[pressure]
niter = 20
sor = 1.5
solver = redblack   ; sor = 1.5 is a red-black SOR factor: the default Jacobi diverges above ~0.8

; 10-cell blocks: 40 x 45 x 10 = 18000 leaves (the P1b gate layout).
[blocks]
nb = 10

; The CAD STL in millimetres, scaled to metres and translated so the mirrored
; body sits at the centre of the full domain (README); the solver uses the
; positive-y half.
[ibm]
enabled = true
stl_file = "FRUE V0 ohneRundung.stl"
stl_scale = 0.001
stl_translate = 17.288649999032064 0.0 4.150549

[boundary]
periodic_x = false
periodic_y = false
periodic_z = false

; Inlet: prescribed velocity (1,0,0), pressure Neumann.
x_min_u_value = 1.0
x_min_v_value = 0.0
x_min_w_value = 0.0
x_min_p_type = neumann

; Outlet: velocity Neumann, pressure reference.
; x_max is a declared OUTLET (numerics review F4, 2026-09-27): the normal
; velocity takes the internal outflow type (zero-gradient predictor write,
; then owned by the Dirichlet-p projection), tangential velocities Neumann 0,
; pressure Dirichlet 0. The former `x_max_{u,v,w}_type = neumann` rows put a
; Neumann condition on the NORMAL component, which apply_bc rewrote inside
; the projection loop and which broke the SPD operator at that row; a Neumann
; normal velocity is now a config error pointing here.
x_max_patch = outlet

; y-symmetry/far-symmetry: v = 0, du/dy = dw/dy = dp/dy = 0.
y_min_u_type = neumann
y_min_v_type = dirichlet
y_min_v_value = 0.0
y_min_w_type = neumann
y_min_p_type = neumann

y_max_u_type = neumann
y_max_v_type = dirichlet
y_max_v_value = 0.0
y_max_w_type = neumann
y_max_p_type = neumann

; z-symmetry/far-symmetry: w = 0, du/dz = dv/dz = dp/dz = 0.
z_min_u_type = neumann
z_min_v_type = neumann
z_min_w_type = dirichlet
z_min_w_value = 0.0
z_min_p_type = neumann

z_max_u_type = neumann
z_max_v_type = neumann
z_max_w_type = dirichlet
z_max_w_value = 0.0
z_max_p_type = neumann

[output]
field_interval = 1
field_prefix = sailplane_field

[restart]
; file = sailplane_field_10.h5
