; ============================================================================
;  Minimal turbulent channel flow unit at Re_tau = 180
;  (Jimenez & Moin 1991, "minimal flow unit")
;
;  A small periodic box (2 x 2 x 2) that is just large enough to sustain
;  near-wall turbulence. Because it is small it runs quickly, which makes it
;  ideal for experimenting with the solver -- e.g. coding your own moving-wall
;  boundary condition in src/modules/wall_bc.f90.
;
;  Run it (single rank is fine):
;      mpirun -n 1 ./build_cpu/main tutorials/channel_mfu_jm180/input.ini
;  Then plot the statistics it wrote:
;      python3 tools/plot_stats.py channel_stats.h5
; ============================================================================

[case]
name = channel

[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.0
small_noise_amplitude = 0.0
stats_sample_interval = 50
stats_write_interval = 5000
stats_file = channel_stats.h5
runtime_file = runtimedata.txt

[grid]
nx = 48
ny = 128
nz = 80
lx = 2.0
ly = 2.0
lz = 2.0

[grid.x]
distribution = uniform
subdivided = true

[grid.y]
; Wall-normal grid clustered towards the walls (first cell dyw+ = 0.5).
distribution = natural
stretch = 16
natural_dyw_plus = 0.5
subdivided = true

[grid.z]
distribution = uniform
subdivided = true

[flow]
re = 180.0
forcing_x = 1.0

[time]
; Prescribe the start time (overrides the value stored in restart.h5).
t_start = 0.0
t_final = 5.0
dt = 1.0e-5
cflmax = 0.8
pecletmax = 0.5
dtmax = 1.0

[pressure]
; Damped-Jacobi pressure projection accelerated with Chebyshev-Jacobi.
; niter = 6 iterations, relaxation omega = 0.8 (plain Jacobi diverges above ~0.8).
niter = 12
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[output]
field_interval = 0
field_prefix = channel_field

[restart]
file = restart.h5
