[case]
name = airfoil

; B11 redesign (2026-07-16, user-controlled settings): NACA 0012 polar at
; Re_c = 4e5 on a 128c x 96c chord-lift domain, nose at (50, 48), span y
; (Ly = 0.1875c, ny = 8), [blocks] refine_dims = xz with TEN
; refinement levels: base Delta0 = c/3, finest Delta10 = c/3072 ->
; y+(Delta/2) ~ 4.1 at the LE cf = 0.008 and ~2.7 at midchord (the
; agreed y+ 2-5 band; halves the level cost AND doubles dt vs y+2). The finest levels are the snug
; body-driven bands (refine_body + the 2:1 cascade); the CONCENTRIC
; WAKE-SKEWED per-level boxes below protect the BL envelope (0.5c at
; L7, Delta = 2.6e-3 c) and grade outward at +1c upstream/lateral,
; +2c downstream per level. Buried interior blocks are REMOVED (no
; keep-buried): the penalization force statistic UNDER-READS lift by
; construction — forces come from the EXTERNAL CONTROL VOLUME
; (cv_forces.py on snapshots). niter = 18 keeps the stored pressure
; clean enough for the CV border integrals (the niter-6 pn-drift
; caveat, validation/naca0012 A2 notes).
; dt = 5e-5: CFL bound at Delta11 (~6e-5 at the suction-peak speeds);
; the explicit eddy-diffusion bound is ~8e-5 in the fine band.
; Ambient turbulence SUSTAINED via the Rumsey source terms
; ([rans] ambient_sustain): (k_inf, omega_inf) is an exact fixed point
; of the transport, so tu = 5 % arrives AT THE BODY undecayed with
; nut_inf = 10 nu only. (The first attempt used nut_ratio = 1.0936 for a
; slow decay instead: the ambient eddy viscosity in the finest cells
; broke the EXPLICIT eddy-diffusion dt bound ~1e-5 and destroyed the
; run by t = 0.09 -- the sustain sources are the correct mechanism.)
; Record the arriving tu from the first snapshot next to the
; XFOIL/OpenFOAM transition setting.
[case.airfoil]
aoa = 5.0
u_inf = 1.0
chord = 1.0
span = y
force_sample_interval = 20
runtime_file = forces_c11_aoa5.txt

[grid]
nx = 384
ny = 8
nz = 288
lx = 128.0
ly = 0.1875
lz = 96.0

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8
refine_body = true
refine_levels = 11
refine_dims = xz
; concentric wake-skewed boxes (x0 x1 y0 y1 z0 z1 level): a 0.25c
; protected box at L6 (Delta = c/192 ~ 33 wall units, covering the whole
; BL envelope + near wake), then ~doubling margins outward, downstream
; extended. The y+~3-4 bands (L7-L10) come from refine_body.
refine = 49.75 52.50 -1.0 10.0 47.70 48.30 6
refine = 49.25 54.00 -1.0 10.0 47.20 48.80 5
refine = 48.25 56.00 -1.0 10.0 46.20 49.80 4
refine = 46.75 59.00 -1.0 10.0 44.70 51.30 3
refine = 44.75 63.00 -1.0 10.0 42.70 53.30 2
refine = 42.25 68.00 -1.0 10.0 40.20 55.80 1

[ibm]
enabled = true
coeff_file = ibm_coeff_c11.h5

[flow]
re = 4.0e5

[turbulence]
model = rans

[rans]
model = sst
tu = 21.35
nut_ratio = 1.0936
ambient_sustain = false

[time]
dt = 5.0e-5
nsteps = 100000000
t_final = 30.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 5.0e-5

[pressure]
niter = 18
sor = 0.8
accel = chebyshev

[output]
field_interval = 20000
field_prefix = c11_aoa5

; Entry points (README): (a) restart from a converged state file
; (c11_aoa5ab_370013.h5 or your own); (b) from-scratch staged protocol
; (L10 transient -> interp_restart.py -> this config).
[restart]
file = c11_aoa5ab_370013.h5

; OpenFOAM-matching forced transition (their fvOptions, translated to
; nose (50,48)): k = 0 for x < LE+0.09c in a +-2c band (their kzero
; half-planes reach 1c upstream), plus 2e-5-absolute trip strips at
; x/c 0.10-0.12 hugging both surfaces (rate = 2e-5 / their set volume
; 5.2e-5 = 0.385 k/t volumetric; axis-aligned bands surface..+0.003c).
[rans]
kpin_box  = 49.00 50.09 -1.0 10.0 46.00 50.00
ktrip_box = 50.10 50.12 -1.0 10.0 48.045 48.053 0.385
ktrip_box = 50.10 50.12 -1.0 10.0 47.947 47.955 0.385
