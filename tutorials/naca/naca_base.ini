[case]
name = airfoil

; NACA 0012 polar sweep at Re_c = 4e5 (tutorials/naca, 2026-07-16).
; TEMPLATE: run_sweep.sh substitutes __AOA__ / the file names per angle
; (aoa = -2..5). Built on the R2D 2D-refinement stack: span along Y
; ([case.airfoil] span = y - chord x, LIFT z), [blocks] refine_dims =
; xz, refine_levels = 6 -> surface Delta = 12/512/2^6 = 3.66e-4 c and
; y+_1 ~ 2-3 at the turbulent midchord (Re 4e5, cf ~ 4e-3): resolved
; SST. L6-3D would be ~121 M cells (OOM); L6-xz is ~15 k blocks.
; FULL-TURBULENT SST (transition off): the clean comparison against
; XFOIL run fully-turbulent / forced transition, and gamma-Re_thetat is
; unreliable at fine surface resolution (validation/sd7003 README,
; "R2D-3 follow-up"). KEEP-BURIED coefficients are load-bearing for the
; penalization C_L/C_D (validation/naca0012 README). dtmax = 1e-4:
; the L6 CFL bound (~1.3e-4 at the aoa-5 suction peak) with margin; the
; explicit eddy-viscosity diffusion bound Delta^2/(6 nu (1+nut/nu)) is
; ~4e-4 at the L6 ring (nut/nu <= ~20 inside the thin fine band) and
; looser at the coarser wake levels.
; 12c x 12c chord-lift box (LE at x = 4.5, z = 6.0): the Dirichlet
; far-field blockage costs ~10-15% of the 2pi lift slope (measured 88%
; at 12c) - account for it when comparing absolute slopes with XFOIL.
[case.airfoil]
aoa = __AOA__
u_inf = 1.0
chord = 1.0
span = y
force_sample_interval = 20
runtime_file = forces_aoa__TAG__.txt

[grid]
nx = 512
ny = 8
nz = 512
lx = 12.0
ly = 0.1875
lz = 12.0

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8
refine_body = true
refine_levels = 6
refine_dims = xz

[ibm]
enabled = true
coeff_file = ibm_coeff_n0012_re4e5_xz_l7.h5

[flow]
re = 4.0e5

[turbulence]
model = rans

[rans]
model = sst
tu = 5.0
nut_ratio = 10.0

[time]
dt = 1.0e-4
nsteps = 100000000
t_final = 10.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 1.0e-4

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[output]
field_interval = 100000
field_prefix = naca_aoa__TAG__
