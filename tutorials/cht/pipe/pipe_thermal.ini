[case]
name = generic

; ============================================================================
; LEGS B-D of the conjugate-pipe campaign (docs/next_session_pipe_cht.md):
; seven scalars riding ONE velocity field, restarted from leg A.
;
; THE THERMAL PROBLEM (Section 1, measured from Neuhauser's dataset). The pipe
; is streamwise-periodic and fully developed, so the streamwise reduction
; T = beta z + theta turns the heating into a volumetric source proportional
; to the axial velocity (Kasagi's form): source_type = velocity, source_dir =
; z. The fluid is HEATED (their core is hotter than their wall, so beta < 0
; and source = -beta > 0) and the heat leaves through the shell.
;
; The heat is removed by a volumetric SINK IN THE SHELL rather than by a
; nonzero Neumann condition at r = 0.6, which the solver cannot express at an
; immersed surface (feature F3). That substitute is EXACT for every
; fluctuation statistic -- a steady azimuthally uniform source lives entirely
; in the mean, and the solid's fluctuation equation does not contain it -- and
; changes only <theta> INSIDE the solid, whose profile is then known in closed
; form. Section 3.
;
; THE SINK IS PER SCALAR, and this is the easiest thing in the whole campaign
; to get wrong. The kernel divides the flux divergence by the capacity, so
; solid_source is a rate of change of theta, not a power: the power density is
; C_s * solid_source. The fluid generates source * u_b * pi R^2 per unit
; length and the shell must remove it, so
;     C_s * |solid_source| = source * u_b * R^2/(R_o^2 - R^2)
; and solid_source scales as 1/solid_rhocp. THE NUMBER IS MEASURED, NOT
; DERIVED: the handout's 2.2727273 assumes u_b = 1 and pi R^2, but the
; DISCRETE generation is `int w dV` over the fluid = 9.5755 against a discrete
; shell volume 4.3306, i.e. 2.2111054 -- 2.71 % smaller. Sizing the sink for
; u_b = 1 leaves a net cooling of 0.267 per unit time, which is not harmless:
; it is a uniform ramp `lambda t` plus an O(lambda) distortion of the profile,
; and lambda differs per scalar because their total capacities do (c4's is 79,
; c3's 10). Campaign 1 ran with the unmeasured value; campaign 2 uses these.
; and solid_source scales as 1/solid_rhocp. Share one number across the five
; conjugate scalars and they carry five DIFFERENT wall fluxes; nothing
; crashes, the comparison is simply meaningless. [scalar] heat_interval
; reports the interface heat, so measure it on leg B rather than trusting the
; arithmetic.
;
; THE SOLID GEOMETRY: solid_thickness = 0.1 is the F2 level-set band, the
; shell 0.5 < r < 0.6 exactly (phi is the signed distance to the pipe wall,
; so the shell IS -0.1 < phi < 0). Everything deeper -- the box corners --
; is the inert jacket at solid_outer_k = 0 (the default): an exact insulator,
; which makes the shell's outer surface exactly adiabatic at depth 0.1. That
; matters because Neuhauser's solid is thermally THIN (d+ = 36) and the
; fluctuation reaches its outer surface at 38 % and reflects: a jacket run out
; to the box faces would give an azimuthally varying thickness and destroy the
; bccode = 0 premise.
;
; THE SEVEN SCALARS. The dataset's (K, lambda_sf) map to the solver as
;     kappa_s/kappa_f = lambda_sf     and    rho c_s/rho c_f = 1/(K^2 lambda_sf)
; (Section 1 PIN DOWN -- settled four independent ways; K is the FLUID-to-
; SOLID effusivity ratio, the inverse of the usual activity ratio):
;
;   scalar  isc  K     lambda_sf  solid_k  solid_rhocp  alpha_s/alpha_f
;   c0       0   1     1          1        1            1     no contrast at all
;   c1       1   1     2          2        0.5          4     conductivity
;   c2       2   1     0.5        0.5      2            0.25  conductivity
;   c3       3   4     1          1        0.0625       16    capacity; SETS dt
;   c4       4   0.25  1          1        16           1/16  capacity; slow
;   mbc      5   ->0   -          (ibm_wall = dirichlet: isothermal fluctuations)
;   isof     6   ->inf -          (conjugate with kappa_s = rho c_s = 0.01)
;
; c1 and c2 are the REAL test of the conjugate face coefficient: it is a
; conductivity harmonic mean, identity at kappa_s = kappa_f whatever the
; capacity does. c0 is the cheapest and validates the pipeline, not the
; scheme. c3/c4 test the C3 fluid-fraction capacity instead.
;
; isof is Neuhauser's isoflux control and is NOT ibm_wall = adiabatic: their
; IF wall carries a constant NONZERO flux, adiabatic carries none, so the
; fluid would heat without bound. The vanishing-effusivity solid
; (kappa_s = rho c_s = eps) is the faithful limit and costs nothing in dt
; because alpha_s = alpha_f. Check it against the K trend before quoting it.
;
; LEG B ACCELERATOR (@RHOCP4@ / @SRC4@): c4's solid diffusion time is ~600
; D/u_b, which is the time for the solid MEAN to diffuse through the shell --
; and the steady mean is capacity-INDEPENDENT (C1, gated). So leg B runs c4 at
; solid_rhocp = 1 (with the sink rescaled to hold the same power) and leg C
; restores 16 with the mean already right; only theta' in the solid then has
; to re-equilibrate. Verify rather than assume: after restoring, the solid
; mean profile must not move.
;
; Placeholders substituted by run_pipe.sh:
;   @CASE@ @PREFIX@ @NSTEPS@ @WRITE@ @RESTART@ @DTMAX@ @RHOCP4@ @SRC4@
;   @SAMPLE@ @STATS@ @STATSFILE@ @HEAT@
; ============================================================================

[grid]
nx = 256
ny = 256
nz = 896
lx = 1.3
ly = 1.3
lz = 12.5

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 32
remove_solid = false

[flow]
re = 5300.0
forcing_z = 1.8702750564e-2
initial = uniform
initial_w = 1.0
initial_noise = 0.0

[ibm]
enabled = true
coeff_file = @CASE@

[scalar]
count = 7
; z-averaged (x,y) cross-section rows: exactly a pipe cross-section, which
; pipe_stats.py bins into r. (The velocity statistics cannot come from here --
; the stats module is scalar-only -- so they come from snapshots.)
stats_layout = plane
stats_sample_interval = @SAMPLE@
stats_write_interval = @STATS@
stats_file = @STATSFILE@
; The interface heat (C3 Nusselt branch, gated three ways): this is how the
; source/sink balance gets MEASURED rather than assumed.
heat_interval = @HEAT@
heat_file = @PREFIX@.heat.txt
; The C2 cut-face error indicator: what the dropped tangential term is worth
; on the running field. Free, and this campaign is the first curved interface
; it has ever run on.
indicator_interval = @HEAT@

[scalar.1]
name = c0
pr = 0.71
initial = 0.0
source_type = velocity
source_dir = z
source = 1.0
ibm_wall = conjugate
solid_k = 1.0
solid_rhocp = 1.0
solid_thickness = 0.1
solid_source = -2.21110542

[scalar.2]
name = c1
pr = 0.71
initial = 0.0
source_type = velocity
source_dir = z
source = 1.0
ibm_wall = conjugate
solid_k = 2.0
solid_rhocp = 0.5
solid_thickness = 0.1
solid_source = -4.42221085

[scalar.3]
name = c2
pr = 0.71
initial = 0.0
source_type = velocity
source_dir = z
source = 1.0
ibm_wall = conjugate
solid_k = 0.5
solid_rhocp = 2.0
solid_thickness = 0.1
solid_source = -1.10555271

[scalar.4]
name = c3
pr = 0.71
initial = 0.0
source_type = velocity
source_dir = z
source = 1.0
ibm_wall = conjugate
solid_k = 1.0
solid_rhocp = 0.0625
solid_thickness = 0.1
solid_source = -35.37768679

[scalar.5]
name = c4
pr = 0.71
initial = 0.0
source_type = velocity
source_dir = z
source = 1.0
ibm_wall = conjugate
solid_k = 1.0
solid_rhocp = @RHOCP4@
solid_thickness = 0.1
solid_source = @SRC4@

[scalar.6]
name = mbc
pr = 0.71
initial = 0.0
source_type = velocity
source_dir = z
source = 1.0
ibm_wall = dirichlet
ibm_value = 0.0

[scalar.7]
name = isof
pr = 0.71
initial = 0.0
source_type = velocity
source_dir = z
source = 1.0
ibm_wall = conjugate
solid_k = 0.01
solid_rhocp = 0.01
solid_thickness = 0.1
solid_source = -221.11054246

[time]
dt = 1.0e-4
nsteps = @NSTEPS@
t_final = 0.0
cflmax = 0.8
pecletmax = 0.4
dtmax = @DTMAX@

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = false
periodic_y = false
periodic_z = true

[output]
field_interval = @WRITE@
field_prefix = @PREFIX@

[restart]
file = @RESTART@
