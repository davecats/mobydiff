[case]
name = generic

; Conjugate pipe flow vs Neuhauser (NekRS) -- the PREPARE ini.
; docs/next_session_pipe_cht.md Section 0.1.
;
; Geometry: pipe axis z, fluid r < 0.5, conjugate shell 0.5 < r < 0.6 (the F2
; level-set band, a solver-side [scalar.N] key -- NOT part of the case file),
; inert jacket beyond.  The immersed body is everything outside r = 0.5; the
; STL's square outer surface at half-width 1.25 is pure padding, far enough
; that the pipe wall is the nearest surface everywhere inside the domain
; (margin 0.42 at the domain corner, checked by make_geometry_stl.py).
;
; COARSE grid of the two the campaign needs: 160 x 160 x 320 = 8.2 M cells,
; dx+ = 2.94, dz+ = 14.2 at delta_v = 2.7593e-3.  nb = 32 divides 160 and 320.
;
; The [scalar] section is what makes moby_prepare write coef_p_blocks; without
; it the solver refuses to run scalars against this file.  Its values are
; irrelevant to the file (coef_p carries no Pr and no solid property).
;
; Prepare with the CPU build: the GPU build computes coef on the device and
; differs by libm ulps.

[grid]
nx = 256
ny = 256
nz = 896
lx = 1.3
ly = 1.3
lz = 12.5

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 32
remove_solid = false

[ibm]
enabled = true
stl_file = pipe.stl

[flow]
re = 5300.0

[scalar]
count = 1

[scalar.1]
name = theta
pr = 0.71
initial = 0.0
ibm_wall = conjugate
solid_k = 1.0
solid_rhocp = 1.0

[time]
dt = 1.0e-5
nsteps = 1
t_final = 0.0
cflmax = 0.0
pecletmax = 0.4
dtmax = 1.0e-5

[pressure]
niter = 2
sor = 0.8

[boundary]
periodic_x = false
periodic_y = false
periodic_z = true

[output]
field_interval = 0
field_prefix = pipe_prep
