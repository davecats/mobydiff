[case]
name = generic

; ============================================================================
; LEG A of the conjugate-pipe campaign (docs/next_session_pipe_cht.md Section
; 0.4): the HYDRODYNAMICS alone, no scalars at all.
;
; Why it is its own leg: if the velocity does not match Neuhauser's pipe,
; nothing thermal means anything -- and running it with [scalar] count = 0
; isolates the immersed pipe from the conjugate scheme. It is also much
; cheaper than a thermal leg (dt is convection-limited rather than set by the
; isc 3 solid capacity) and it produces the restart every other leg starts
; from.
;
; Re_b = u_b D/nu = 5300 is an OUTCOME here, not an input: the run is driven
; by the pressure gradient that Neuhauser MEASURED,
;     forcing_z = 2 u_tau^2 / R = 2 * 0.068379^2 / 0.5 = 1.8702750564e-2,
; so u_tau is 0.068379 by construction and Re_tau = 181.2; check that u_b
; comes out near 1 and report what it is rather than tuning the forcing.
;
; The pipe axis is z ([flow] forcing_z, periodic z).  The x and y faces are
; ordinary domain walls, but they lie INSIDE the immersed solid, so nothing
; they impose ever reaches the fluid.
;
; The case file carries coef_p_blocks (its prepare ini declared a scalar).
; That is harmless with count = 0: the solver reads it only when scalars are
; configured.
;
; Placeholders substituted by run_pipe.sh:
;   @CASE@ @PREFIX@ @NSTEPS@ @WRITE@ @RESTART@ @NOISE@ @DTMAX@
; ============================================================================

[grid]
nx = 256
ny = 256
nz = 896
lx = 1.3
ly = 1.3
lz = 12.5

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
; The block size only; this case sets no refine key, so it is single level
; with zero 2:1 interfaces. It must be stated because a prepared case file's
; block table cannot depend on the rank count, and it must match the prepare
; ini's value.
nb = 32
; LOAD-BEARING once the scalars arrive (a buried block carries the solid's
; temperature) and a hard config error under ibm_wall = conjugate; kept here
; so leg A runs the same decomposition as legs B-D.
remove_solid = false

[flow]
re = 5300.0
forcing_z = 1.8702750564e-2
; Cold start: a plug moving at the bulk velocity plus white noise. Pipe flow
; is linearly stable, so the noise has to be a FINITE-amplitude disturbance --
; if it fails to trip, the run converges to the laminar Poiseuille state that
; this forcing supports, u_b = u_tau^2 R^2 / (2 nu) = 1.55, which is the
; symptom to look for. Ignored on a restart leg (@NOISE@ = 0).
initial = uniform
initial_w = 1.0
initial_noise = @NOISE@

[ibm]
enabled = true
coeff_file = @CASE@

[time]
dt = 1.0e-4
nsteps = @NSTEPS@
t_final = 0.0
cflmax = 0.8
pecletmax = 0.4
dtmax = @DTMAX@

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = false
periodic_y = false
periodic_z = true

[output]
field_interval = @WRITE@
field_prefix = @PREFIX@

[restart]
file = @RESTART@
