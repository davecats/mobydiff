[case]
name = channel

[case.channel]
n_walls = 2

; Pirozzoli-Orlandi natural stretching parameter.
; The implementation already hard-codes dyw+ = 0.05, alpha = 1.25, c_eta = 0.8.
natural_blend_index = 16

; Adds A*sin(2*pi*y/Ly) to the streamwise mean profile.
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 1.0e-2
small_noise_amplitude = 1.0e-3

stats_sample_interval = 500
stats_write_interval = 5000
stats_file = channel_kmm180_stats.h5
runtime_file = runtimedata.txt

[grid]
; Lx = 4*pi*h, Ly = 2*h, Lz = 2*pi*h.
; At Re_tau = 180: nx = nz = 288 gives dx+ = 7.854 and dz+ = 3.927.
; ny = 136 gives dyw+ ~= 0.050 with the current natural-grid mapping.
nx = 288
ny = 136
nz = 288
lx = 12.566370614359172
ly = 2.0
lz = 6.283185307179586

[grid.x]
distribution = uniform

[grid.y]
distribution = natural
stretch = 16

[grid.z]
distribution = uniform

[mpi]
dims = 0 0 0

[flow]
; Friction scaling with h and u_tau: Re = Re_tau and mean pressure gradient = 1.
re = 180.0
forcing_x = 1.0
forcing_y = 0.0
forcing_z = 0.0

[time]
; 200 h/u_tau with a conservative fixed cap.
dt = 3.125e-4
t_final = 200.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 3.125e-4

[pressure]
niter = 3
sor = 1.5

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[output]
field_interval = 50000
field_prefix = channel_kmm180_field

[restart]
; file = channel_kmm180_field_50000.h5
