; ============================================================================
;  Turbulent channel flow at Re_tau = 180  (Kim, Moin & Moser 1987)
;
;  A full plane channel: periodic in x (streamwise) and z (spanwise), no-slip
;  walls in y, driven by a constant streamwise body force. The run restarts
;  from a developed turbulent field (restart.h5, 256x128x256) and collects
;  wall-normal statistics that you plot with tools/plot_stats.py.
;
;  Run it (single rank is fine):
;      mpirun -n 1 ./build_cpu/main tutorials/channel_kmm180/input.ini
;  Then plot the statistics it wrote:
;      python3 tools/plot_stats.py channel_stats.h5
; ============================================================================

[case]
name = channel

[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.0
small_noise_amplitude = 0.0
; Sample statistics every 50 steps; flush them to disk periodically.
stats_sample_interval = 50
stats_write_interval = 5000
stats_file = channel_stats.h5
runtime_file = runtimedata.txt

[grid]
nx = 256
ny = 128
nz = 256
lx = 12.566370614359172
ly = 2.0
lz = 6.283185307179586

[grid.x]
distribution = uniform
subdivided = true

[grid.y]
; Wall-normal grid clustered towards the walls (first cell dyw+ = 0.5).
; "subdivided" builds the line by midpoint-refining the half-resolution line;
; it must match how restart.h5 was generated.
distribution = natural
stretch = 16
natural_dyw_plus = 0.5
subdivided = true

[grid.z]
distribution = uniform
subdivided = true

[flow]
re = 180.0
forcing_x = 1.0

[time]
; t_start prescribes the clock at the start of the run. When set it OVERRIDES
; the time stored in restart.h5, so a developed field can be restarted with
; the clock reset to zero.
t_start = 0.0
t_final = 5.0
dt = 1.0e-5
cflmax = 0.8
pecletmax = 0.5
dtmax = 3.125e-4

[pressure]
; Damped-Jacobi pressure projection accelerated with Chebyshev-Jacobi.
; niter = 6 iterations, relaxation omega = 0.8 (plain Jacobi diverges above ~0.8).
niter = 12
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[output]
field_interval = 0
field_prefix = channel_field

[restart]
file = restart.h5
