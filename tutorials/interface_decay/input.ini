; Interface-decay gate: white-noise initial condition on a 3D refined
; patch in a fully periodic box, no forcing. Viscosity must contract the
; noise monotonically; any growth means the 2:1 interface treatment has
; an amplifying mode (this is the configuration that exposed the
; pre-symmetric-relaxation instability, which short smooth-flow gates
; never see). Checked by tools/check_interface_decay.py.

[case]
name = generic

[grid]
nx = 64
ny = 64
nz = 64
lx = 1.0
ly = 1.0
lz = 1.0

[mpi]
dims = 0 0 0

[flow]
re = 100.0
initial_noise = 0.05

[time]
dt = 5.0e-4
nsteps = 200
t_final = 0.0
cflmax = 0.0
pecletmax = 0.0
dtmax = 5.0e-4

[pressure]
niter = 3
sor = 1.5

[ibm]
enabled = false

[boundary]
periodic_x = true
periodic_y = true
periodic_z = true

[output]
field_interval = 20
field_prefix = decay

[blocks]
nb = 8
refine = 0.3 0.6 0.3 0.6 0.3 0.6
refine_levels = 1
