[case]
name = generic

; R2D-0 gate (c) twin: single-level 64x32x64 run whose x/z lines are
; built by midpoint subdivision of the 32-node line ([grid] subdivided),
; bitwise identical to allref_xz.ini's level-1 lines. Same block size
; and physical setup -> bit-exact fields.
[grid]
nx = 64
ny = 32
nz = 64
lx = 6.283185307179586
ly = 6.283185307179586
lz = 6.283185307179586

[grid.x]
distribution = uniform
subdivided = true
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform
subdivided = true

[blocks]
nb = 8

[ibm]
enabled = false

[flow]
initial = beltrami
re = 100.0

[time]
dt = 1.0e-3
nsteps = 5
t_final = 0.0
cflmax = 0.5
pecletmax = 0.5
dtmax = 1.0e-3

[pressure]
niter = 50
sor = 0.8

[boundary]
periodic_x = true
periodic_y = true
periodic_z = true

[output]
field_interval = 5
field_prefix = twin_xz
