[case]
name = generic

; R2D-0 barrier check: a MIXED-level xz-quadtree table (central box) has
; 2:1 interfaces, which R2D-0 does not implement -- the solver must
; error-stop at exchange setup with the R2D-1 message, never run.
[grid]
nx = 32
ny = 32
nz = 32
lx = 6.283185307179586
ly = 6.283185307179586
lz = 6.283185307179586

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8
refine_dims = xz
refine = 2.0 4.3 2.0 4.3 2.0 4.3
refine_levels = 1

[ibm]
enabled = false

[flow]
initial = beltrami
re = 100.0

[time]
dt = 1.0e-3
nsteps = 5
t_final = 0.0
cflmax = 0.5
pecletmax = 0.5
dtmax = 1.0e-3

[pressure]
niter = 50
sor = 0.8

[boundary]
periodic_x = true
periodic_y = true
periodic_z = true

[output]
field_interval = 5
field_prefix = box_xz
