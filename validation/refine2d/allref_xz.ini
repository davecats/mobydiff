[case]
name = generic

; R2D-0 gate (c): every block refined once in x,z only (refine_dims = xz,
; box covering the whole domain) -> 512 level-1 leaves on an 8x4x8
; lattice, NO 2:1 interfaces. Must be bit-exact vs the doubled-x,z
; single-level twin (twin_xz.ini), whose grid lines are built with the
; [grid] subdivided flag = bitwise the level-1 midpoint-subdivided lines.
[grid]
nx = 32
ny = 32
nz = 32
lx = 6.283185307179586
ly = 6.283185307179586
lz = 6.283185307179586

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8
refine_dims = xz
refine = -1.0 10.0 -1.0 10.0 -1.0 10.0
refine_levels = 1

[ibm]
enabled = false

[flow]
initial = beltrami
re = 100.0

[time]
dt = 1.0e-3
nsteps = 5
t_final = 0.0
cflmax = 0.5
pecletmax = 0.5
dtmax = 1.0e-3

[pressure]
niter = 50
sor = 0.8

[boundary]
periodic_x = true
periodic_y = true
periodic_z = true

[output]
field_interval = 5
field_prefix = ar_xz
