[case]
name = generic

; R2D-0 gate (b) grid: non-cubic periodic box so the mixed-Morton leaf
; ordering is exercised on unequal tile counts per direction
; (gnbt = 6 x 4 x 8 at nb = 8). Used only by mobygrid to export grid.h5
; for mobygeom block-table.
[grid]
nx = 48
ny = 32
nz = 64
lx = 1.5
ly = 1.0
lz = 2.0

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[flow]
re = 100.0

[time]
dt = 1.0e-3
nsteps = 1
t_final = 0.0

[boundary]
periodic_x = true
periodic_y = true
periodic_z = true

[output]
field_interval = 0
field_prefix = leafgrid
