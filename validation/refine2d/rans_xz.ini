[case]
name = channel

; R2D-2 RANS xz smoke: the turb180 column with xz-refined wall bands
; (1x12x1 root tiles -> the band blocks split 2x2 in-plane), so the
; k/omega scalar halos cross tangentially-2:1 y faces and periodic
; same-level fine faces. Gates: 50 steps finite, 1 == 4 ranks
; byte-identical, CPU == GPU.
[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.0
small_noise_amplitude = 0.0
stats_sample_interval = 0
stats_write_interval = 0

[grid]
nx = 8
ny = 96
nz = 8
lx = 3.141592653589793
ly = 2.0
lz = 1.5707963267948966

[grid.x]
distribution = uniform
[grid.y]
distribution = natural
stretch = 16
natural_dyw_plus = 0.5
[grid.z]
distribution = uniform

[blocks]
nb = 8
refine_dims = xz
refine = -1.0 4.0 -1.0 0.2 -1.0 2.0
refine = -1.0 4.0 1.8 3.0 -1.0 2.0
refine_levels = 1

[flow]
re = 180.0
forcing_x = 1.0

[time]
dt = 1.0e-4
t_final = 200.0
nsteps = 50
cflmax = 0.5
pecletmax = 0.4
dtmax = 5.0e-2

[pressure]
niter = 6
sor = 0.8

[turbulence]
model = rans

[rans]
model = sst
tu = 5.0
nut_ratio = 10.0

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[output]
field_interval = 50
field_prefix = rans_xz
