[case]
name = generic

; R2D-2 laminar order gate, base 64 (pair: bp_xz_32.ini). Decaying
; Beltrami / ABC flow (exact NS solution; every component varies in two
; directions, so every xz-interface orientation is exercised) through a
; central xz-refined patch. NOTE: the classic laminar CHANNEL is blind
; to xz-only refinement (the parabola has no x/z variation), so the
; exact-solution Beltrami error takes its place: L2(vel) error vs exact
; at t=0.25 must converge at ~order 2 from base 32 -> 64 (dt halved
; with h so the total error scales cleanly).
[grid]
nx = 64
ny = 64
nz = 64
lx = 6.283185307179586
ly = 6.283185307179586
lz = 6.283185307179586

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8
refine_dims = xz
refine = 2.4 3.9 2.4 3.9 2.4 3.9
refine_levels = 1

[ibm]
enabled = false

[flow]
initial = beltrami
re = 100.0

[time]
dt = 5.0e-4
nsteps = 0
t_final = 0.25
cflmax = 0.8
pecletmax = 0.8
dtmax = 5.0e-4

[pressure]
niter = 50
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = true
periodic_y = true
periodic_z = true

[output]
field_interval = 500
field_prefix = bp_xz_64
