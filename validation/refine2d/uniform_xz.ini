[case]
name = generic

; R2D-1 gate: uniform oblique flow (u,v,w all nonzero) through a 3-level
; xz-quadtree patch (central box, refine_levels = 2) in a fully periodic
; box. The layout carries every interface orientation of the xz mode:
; x/z-normal 2:1 faces (2 sub-entries), tangentially-2:1 y faces (4
; sub-entries), y-edges, in-plane edges and corners, at l0-l1 AND l1-l2.
; The constant field must be preserved EXACTLY (max deviation 0.0, pn
; spread 0.0) -- any inconsistent transfer shows up as a nonzero.
[grid]
nx = 64
ny = 32
nz = 64
lx = 6.283185307179586
ly = 6.283185307179586
lz = 6.283185307179586

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8
refine_dims = xz
refine = 2.8 3.5 2.8 3.5 2.8 3.5
refine_levels = 2

[ibm]
enabled = false

[flow]
re = 40.0
initial_u = 0.9396926207859084
initial_v = 0.3420201433256687
initial_w = 0.2

[time]
dt = 1.0e-3
nsteps = 50
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 1.0e-3

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = true
periodic_y = true
periodic_z = true

[output]
field_interval = 50
field_prefix = uni_xz
