[case]
name = generic

; The convective stability limit of the RK3 step, measured: a UNIFORM flow in
; a triply periodic 2*pi box, seeded with a 1e-6 random perturbation
; (seed_ic.py), at Re = 1e6 so that convection is the only thing that can go
; unstable. run_gate.sh rewrites the flow direction, dt and the limiter keys
; per leg; this file is the template (flow along x, fixed step).
[grid]
nx = 16
ny = 16
nz = 16
lx = 6.283185307179586
ly = 6.283185307179586
lz = 6.283185307179586

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[ibm]
enabled = false

[flow]
re = 1.0e6
initial_u = 1.0
initial_v = 0.0
initial_w = 0.0

[time]
dt = 1.0e-3
nsteps = 600
t_final = 0.0
cflmax = 0.0
pecletmax = 0.0
dtmax = 1.0e-3

[pressure]
niter = 12
accel = chebyshev

[boundary]
periodic_x = true
periodic_y = true
periodic_z = true

[output]
field_interval = 100
field_prefix = box
