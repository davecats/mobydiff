; L4-xz CONTROL: the exact 3D-L4 resolution/dt in the span-y xz
; orientation (deconfounds xz machinery vs LM-correlation grid
; sensitivity for the L5 no-transition finding).
[case]
name = airfoil

; A3 INCREMENT 3: the SD7003 transition benchmark — Re_c = 6e4, aoa = 4,
; gamma-Re_thetat transition ON, tu = 0.1 % (the benchmark's freestream).
; Published gamma-Re_thetat RANS-LM results (Windte/Radespiel; LES
; reference Galbraith & Visbal): laminar separation x_s/c ~ 0.22-0.30,
; transition x_t/c ~ 0.53-0.58, reattachment ~ 0.65-0.70, C_L ~ 0.58-0.62,
; C_D ~ 0.021-0.023. Gate: LSB present, x_t/c = 0.5 +- 0.1, C_L/C_D within
; the published scatter (~10-15 %).
;
; Ambient decay: omega_inf = k_inf Re / nut_ratio = 1.5e-6 * 6e4 / 1 =
; 0.09 -> decay time 1/(beta* omega_inf) = 123 c/U: the inlet tu survives
; to the airfoil unchanged (unlike the naca0012 tu = 5 case).
;
; Grid identical to validation/naca0012 (12c x 12c x 0.1875c, base
; 512 base cells along the 12c dims, refine_levels = 4 -> surface
; Delta = 7.32e-4 c; re-oriented span y for refine_dims = xz.
; at Re 6e4. The STL is spline-resampled to 720 points (the 60-point
; Selig file has ~0.8-cell LE facet sagitta at this resolution).
; --keep-buried is LOAD-BEARING for the forces (see validation/naca0012).
[case.airfoil]
aoa = 4.0
u_inf = 1.0
chord = 1.0
force_sample_interval = 20
; Runtime forces = the CONTROL-VOLUME momentum budget over this box
; (margin 1.5c around the profile, LE at (4.5, 6.0), chord 1); the
; borders are snapped to the coarsest level they cross at setup.
; Matches postProcess/cv_forces.py --boxes 1.5. REQUIRED: the
; penalization integral is gone (it under-reads once refine_body
; removes the buried core).
cv_box = 3.0 7.0 4.5 7.5
runtime_file = forces_xz_l4.txt
span = y

[grid]
nx = 512
ny = 8
nz = 512
lx = 12.0
ly = 0.1875
lz = 12.0

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8
refine_body = true
refine_levels = 4
refine_dims = xz

[ibm]
enabled = true
coeff_file = ibm_coeff_sd7003_xz_l5.h5

[flow]
re = 6.0e4

[turbulence]
model = rans

[rans]
model = sst
transition = true
tu = 0.1
nut_ratio = 1.0

[time]
dt = 4.0e-4
nsteps = 100000000
t_final = 15.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 4.0e-4

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[output]
field_interval = 0
field_prefix = sd7003_xz_l4
