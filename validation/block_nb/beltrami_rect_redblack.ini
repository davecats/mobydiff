; Beltrami flow through a 3D refined patch (all six interface orientations,
; edges and corners) on NON-CUBIC blocks: nb = 8 4 8, so the x and z interface
; faces are 4 cells tall and the y faces 8 x 8. The only suite case that puts a
; real (phi /= 0) flow through interface faces of unequal tangential extents --
; the uniform-flow gates of this directory are blind to the interface
; correction (phi = 0). Added 2026-10-21 with the one-launch interface_correct;
; the 8th case of validation/scalar/run_bitexact.sh.
[case]
name = generic

[grid]
nx = 64
ny = 32
nz = 64
lx = 6.283185307179586
ly = 6.283185307179586
lz = 6.283185307179586

[grid.x]
distribution = uniform

[grid.y]
distribution = uniform

[grid.z]
distribution = uniform

[blocks]
nb = 8 4 8
refine = 1.6 4.7 1.6 4.7 1.6 4.7
refine_levels = 1

[ibm]
enabled = false

[flow]
initial = beltrami
re = 100.0

[time]
dt = 1.0e-3
nsteps = 20
t_final = 0.0
cflmax = 0.5
pecletmax = 0.5
dtmax = 1.0e-3

[pressure]
; The red-black twin of beltrami_rect.ini: the same flow, grid, blocks and
; patch under the coupled red-black sweep (the production smoother of the
; boundary-layer tutorial), so the suite gates that kernel too -- across a
; 2:1 interface, on non-cubic blocks, at 4 ranks and on the GPU. Everything
; outside this section is beltrami_rect.ini's.
solver = redblack
niter = 12
sor = 1.5

[boundary]
periodic_x = true
periodic_y = true
periodic_z = true

[output]
field_interval = 20
field_prefix = beltrami_rect_rb
