[case]
name = channel

; Per-direction [blocks] nb gate (Phase 1). This file is the SHARED body of the
; gate cases; run_gates.sh sed-injects the [blocks] section and the prefix, so
; every layout solves an identical problem and any difference in the output is
; a block-layout difference -- which must be none.
;
; Single level, so nb-independence is exact: the same grid tiled differently
; must give bit-identical fields (the designed Phase-1 property).

[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.1
small_noise_amplitude = 0.01
stats_sample_interval = 0
stats_write_interval = 0
stats_file = block_nb_stats.h5
runtime_file = block_nb_runtime.txt

[grid]
nx = 128
ny = 64
nz = 8
lx = 12.566370614359172
ly = 2.0
lz = 0.39269908169872414

[grid.x]
distribution = uniform

[grid.y]
distribution = natural
stretch = 16
natural_dyw_plus = 0.5

[grid.z]
distribution = uniform

[flow]
re = 180.0
forcing_x = 1.0

[time]
nsteps = 20
dt = 1.0e-5
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 3.125e-4

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[output]
field_interval = 20
field_prefix = gate
