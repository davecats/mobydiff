[case]
name = generic

; Per-direction nb, 2:1 INTERFACE gate. Uniform oblique flow (u, v, w all
; nonzero) through a 3-level refined patch in a fully periodic box, with a
; NON-CUBIC nb -- the validation/refine2d uniform_xz.ini gate, retiled.
;
; This is the right interface gate for a block-layout change. A constant field
; is preserved exactly by any CONSISTENT set of transfer operators, so any
; per-direction indexing mistake in the entry generation, the gather maps or the
; ghost blend shows up immediately as a nonzero deviation.
;
; It is NOT gated by comparing against a cubic run: the 2:1 interface is not
; nb-independent (see README) -- only the single-level lattice is.
;
; nb = 8 4 8 on 64 x 32 x 64: 8 x 8 x 8 level-0 tiles, all three directions
; different from each other. Small enough that levels 0, 1 AND 2 all survive, so
; the layout carries l0-l1 AND l1-l2 interfaces (a coarser tiling lets the 2:1
; smoothing swallow level 0 entirely and the gate loses half its coverage).

[grid]
nx = 64
ny = 32
nz = 64
lx = 6.283185307179586
ly = 6.283185307179586
lz = 6.283185307179586

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8 4 8
refine_dims = xz
refine = 2.8 3.5 2.8 3.5 2.8 3.5
refine_levels = 2

[ibm]
enabled = false

[flow]
re = 40.0
initial_u = 0.9396926207859084
initial_v = 0.3420201433256687
initial_w = 0.2

[time]
dt = 1.0e-3
nsteps = 50
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 1.0e-3

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = true
periodic_y = true
periodic_z = true

[output]
field_interval = 50
field_prefix = unirect
