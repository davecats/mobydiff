[case]
name = generic

; Decaying 2D Taylor-Green vortex with an artificial central 2:1 refinement
; patch (smooth flow, exact solution), to expose interface artifacts cleanly.
; A 4x4 block square in the middle (x,y in [pi/2, 3pi/2]) is refined to level 1,
; surrounded by the coarse level, so the patch has 2:1 interfaces on all sides
; sitting in smooth flow. Compare to uniform.ini at nx=64 and to the exact
; solution (tools/check_tgv.py --error-map localises any interface error).
; IC triggered by MOBY_TGV=1 (set by run_tgv.sh).
[grid]
nx = 64
ny = 64
nz = 8
lx = 6.283185307179586
ly = 6.283185307179586
lz = 0.7853981633974483

[grid.x]
distribution = uniform

[grid.y]
distribution = uniform

[grid.z]
distribution = uniform

; Central 4x4-block patch (columns 2..5 of 8) refined to level 1. The box edges
; sit inside the first/last refined block column so exactly those columns refine.
[blocks]
nb = 8
refine = -1.0 10.0 -1.0 10.0 0.2 0.6
refine_levels = 1

[ibm]
enabled = false

[flow]
initial = tgv
re = 100.0

[time]
dt = 1.0e-3
nsteps = 0
t_final = 2.0
cflmax = 0.5
pecletmax = 0.5
dtmax = 0.1

[pressure]
niter = 200
sor = 0.8

[boundary]
periodic_x = true
periodic_y = true
periodic_z = true

[output]
field_interval = 0
field_prefix = tgv
