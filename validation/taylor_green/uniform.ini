[case]
name = generic

; Decaying 2D Taylor-Green vortex, treated as a thin 3D problem (z homogeneous,
; w = 0). The initial condition is the analytic TGV, triggered by the
; environment variable MOBY_TGV=1 (set by run_tgv.sh). Domain is a 2*pi-periodic
; square in x,y; z is thin and periodic. The exact solution decays as
; exp(-2 nu k^2 t) with k = 2*pi/Lx, so tools/check_tgv.py gives the exact error.
;
; Uniform single-block reference. run_tgv.sh sweeps nx=ny over 32/64/128 from
; this file to measure the spatial convergence order.
[grid]
nx = 64
ny = 64
nz = 8
lx = 6.283185307179586
ly = 6.283185307179586
lz = 0.7853981633974483

[grid.x]
distribution = uniform

[grid.y]
distribution = uniform

[grid.z]
distribution = uniform

[ibm]
enabled = false

[flow]
initial = tgv
re = 100.0

[time]
dt = 1.0e-3
nsteps = 0
t_final = 2.0
cflmax = 0.5
pecletmax = 0.5
dtmax = 0.1

[pressure]
niter = 200
sor = 1.5

[boundary]
periodic_x = true
periodic_y = true
periodic_z = true

[output]
field_interval = 0
field_prefix = tgv
