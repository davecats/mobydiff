; Body-force gate (2026-10-06): a SMALL boundary layer with the CaNS trip ON
; (rect_jacobi cut to 512 x 176 x 48; 7 of 32 blocks carry the trip). The
; correction kernel visits the force's support only -- v on the trip blocks --
; so this is the case that proves the restriction equals the full-domain
; kernel at max_abs 0 (nofma), and that the trip moves the field at all
; (the twin with trip_amp = 0 differs in vn by ~3e-4 after 20 steps).

[case]
name = boundaryLayer

[grid]
nx = 512
ny = 176
nz = 48
lx = 100.0
ly = 100.0
lz = 8.0

[grid.x]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 64 44 48

[flow]
re = 450.0

[time]
dt = 1.0e-3
nsteps = 20
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 1.0e-3

[pressure]
niter = 6
sor = 0.8
solver = jacobi

[case.boundaryLayer]
trip_amp = 0.03
trip_nmodes = 24
resolved_height = 36.0
stats_sample_interval = -1
stats_write_interval = -1
runtime_interval = 5
runtime_file = runtime.txt

[output]
field_interval = 20
field_prefix = trip
; Per-phase step timing (profiling.f90). run_overhead.sh flips this to
; true when PROFILE=1; it only reads clocks, so both settings give
; bit-identical fields.
profile = false
