[case]
name = channel

; LES validation -- filtered-DNS REFERENCE. Uniform 128x64x128 Re_tau 180,
; NO LES (DNS-adequate at this Re), same code/scheme as the LES cases. Its
; time-averaged per-y channel_stats profiles (mean U, resolved stresses) are the
; gate target for the coarse 64^3 LES runs: interpolate/box-filter to the LES
; 64^3 y-grid (the 64^3 grid is exactly the 128^3 coarsened 2:1).
; IC: tools/make_channel_restart.py --mode base --nx 128 --ny 64 --nz 128.

[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.0
small_noise_amplitude = 0.0
stats_sample_interval = 50
stats_write_interval = 20000

[grid]
nx = 128
ny = 64
nz = 128
lx = 12.566370614359172
ly = 2.0
lz = 6.283185307179586

[grid.x]
distribution = uniform
[grid.y]
distribution = natural
stretch = 16
natural_dyw_plus = 0.5
[grid.z]
distribution = uniform

[blocks]
nb = 8

[flow]
re = 180.0
forcing_x = 1.0

[time]
dt = 1.0e-5
t_final = 100.0
nsteps = 100000000
cflmax = 0.8
pecletmax = 0.5
dtmax = 3.125e-4

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[output]
field_interval = 0
field_prefix = reference

[mpi]
dims = 1 1 1

[restart]
file = IC.h5
