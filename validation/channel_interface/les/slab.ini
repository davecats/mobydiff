[case]
name = channel

; LES validation -- (ii) slab-refined (flat y-interfaces, no edges). Coarse 64x48x64 channel (Re_tau 180
; UNDER-resolved: dx+~35, dz+~18, dy+_wall~2.5) so the SGS term is ACTIVE
; (WALE nut peaks ~5x molecular). The reference is the well-resolved no-LES DNS
; (reference.ini, 256^3) filtered to this grid. WALE chosen for correct near-wall
; nut~y^3 (verified nut/nu = 1e-4 at the wall cell; no van Driest needed).
; IC: tools/make_channel_restart.py --mode base --nx 64 --ny 48 --nz 64.

[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.0
small_noise_amplitude = 0.0
stats_sample_interval = 50
stats_write_interval = 20000

[grid]
nx = 64
ny = 48
nz = 64
lx = 12.566370614359172
ly = 2.0
lz = 6.283185307179586

[grid.x]
distribution = uniform
[grid.y]
distribution = natural
stretch = 16
natural_dyw_plus = 0.5
[grid.z]
distribution = uniform

[blocks]
nb = 8
; Two full-x,z wall boxes -> flat y-interfaces (no edges). Box y-edges are grid
; NODES so the IC (make_channel_restart --mode patch with the SAME boxes) and the
; solver's strict node-overlap test build identical leaf tables. Edges are interior to wall block-rows 1 and 4 -> symmetric fine rows
; {0,1,4,5} (verified via make_channel_restart.box_leaf_table, which mirrors
; the solver); flat y-interfaces at y+~88 (lower) and its mirror.
refine = -1.0 13.0 -1.0 0.2910383862728262 -1.0 7.0
refine = -1.0 13.0 1.708961613727174 3.0 -1.0 7.0
refine_levels = 1

[flow]
re = 180.0
forcing_x = 1.0

[time]
dt = 1.0e-5
t_final = 100.0
nsteps = 100000000
cflmax = 0.8
pecletmax = 0.5
dtmax = 5.0e-4

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[output]
field_interval = 0
field_prefix = slab

[mpi]
dims = 1 1 1

[restart]
file = IC.h5

[les]
model = wale
