[case]
name = channel

; A level jump that TOUCHES a physical face, seen by the SGS model
; (run_wall_jump.sh). The 64x48x64 LES channel with ONE refinement box that
; spans the whole height and span: the two 2:1 interfaces are x-normal planes
; running into both walls. The initial field is the x- and z-invariant mean
; profile (no disturbance), Smagorinsky (its eddy viscosity is non-zero in
; plain shear, unlike WALE's), ONE step: within a level the eddy viscosity of
; a wall row should then be the same in every column, and what it is in the
; column next to the jump measures the edge halo the velocity-gradient tensor
; reads there -- u(nb+1, 0 | nb+1): the x halo of the wall ghost row.
[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.0
small_noise_amplitude = 0.0
stats_sample_interval = -1
stats_write_interval = -1

[grid]
nx = 64
ny = 48
nz = 64
lx = 12.566370614359172
ly = 2.0
lz = 6.283185307179586

[grid.x]
distribution = uniform
[grid.y]
distribution = natural
stretch = 16
natural_dyw_plus = 0.5
[grid.z]
distribution = uniform

[blocks]
nb = 8
; fine for coarse x cells 8..55, every y and z
refine = 3.0 9.5 -1.0 3.0 -1.0 7.0
refine_levels = 1

[flow]
re = 180.0
forcing_x = 1.0

[time]
dt = 1.0e-5
t_final = 0.0
nsteps = 1
cflmax = 0.8
pecletmax = 0.5
dtmax = 5.0e-4

[pressure]
niter = 12
accel = chebyshev

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[output]
field_interval = 0
field_prefix = wall_jump

[mpi]
dims = 1 1 1

[les]
model = smagorinsky
