[case]
name = channel

; LES validation -- (iii) block-refined (embedded core patch, edges+corners). Coarse 64x48x64 channel (Re_tau 180
; UNDER-resolved: dx+~35, dz+~18, dy+_wall~2.5) so the SGS term is ACTIVE
; (WALE nut peaks ~5x molecular). The reference is the well-resolved no-LES DNS
; (reference.ini, 256^3) filtered to this grid. WALE chosen for correct near-wall
; nut~y^3 (verified nut/nu = 1e-4 at the wall cell; no van Driest needed).
; IC: tools/make_channel_restart.py --mode base --nx 64 --ny 48 --nz 64.

[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.0
small_noise_amplitude = 0.0
stats_sample_interval = 50
stats_write_interval = 20000

[grid]
nx = 64
ny = 48
nz = 64
lx = 12.566370614359172
ly = 2.0
lz = 6.283185307179586

[grid.x]
distribution = uniform
[grid.y]
distribution = natural
stretch = 16
natural_dyw_plus = 0.5
[grid.z]
distribution = uniform

[blocks]
nb = 8
; Single embedded core box -> full orientation coverage (faces+edges+corners),
; y-centred (orientation-symmetric). Same 6 numbers as the IC
; (make_channel_restart --mode patch --refine-box <these>).
refine = 4.025165587411923 8.737554567796611 0.7605760753865511 1.303805457069451 2.012582793705961 4.368777283898305
refine_levels = 1
interface_constant_half = true

[flow]
re = 180.0
forcing_x = 1.0

[time]
dt = 1.0e-5
t_final = 100.0
nsteps = 100000000
cflmax = 0.8
pecletmax = 0.5
dtmax = 5.0e-4

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[output]
field_interval = 0
field_prefix = patch

[mpi]
dims = 1 1 1

[restart]
file = IC.h5

[les]
model = wale
