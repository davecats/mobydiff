[case]
name = channel

; ============================================================================
; 2:1 INTERFACE STABILITY BENCHMARK (fast, ~250 steps, t ~ 0.08).
; Re_tau = 180 wall-band-refined channel from the interpolated KMM180 IC.
; The energy-conserving constant-1/2 interface (default) must stay BOUNDED;
; the old accuracy-optimal interface (interface_constant_half = false) BLOWS UP
; ~step 200. run_benchmark.py runs both and checks the discriminator.
; Statistics OFF; per-step divergence via MOBY_STEPDIV (set by the runner).
; ============================================================================

[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.0
small_noise_amplitude = 0.0
stats_sample_interval = -1
stats_write_interval = -1

[grid]
nx = 128
ny = 64
nz = 128
lx = 12.566370614359172
ly = 2.0
lz = 6.283185307179586

[grid.x]
distribution = uniform
[grid.y]
distribution = natural
stretch = 16
natural_dyw_plus = 0.5
[grid.z]
distribution = uniform

[blocks]
nb = 8
refine = -1.0 13.6 -1.0 0.598617012688 -1.0 7.3
refine = -1.0 13.6 1.401382987312 3.0 -1.0 7.3
refine_levels = 1
momentum_reflux = true
; interface_constant_half = true   (default; the runner flips it false for baseline)

[flow]
re = 180.0
forcing_x = 1.0

[time]
dt = 1.0e-5
t_final = 100.0
nsteps = 250
cflmax = 0.8
pecletmax = 0.5
dtmax = 3.125e-4

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[output]
field_interval = 0
field_prefix = channel_field

[mpi]
dims = 1 1 1

[restart]
file = ../IC.h5
