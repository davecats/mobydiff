[case]
name = channel

[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.0
small_noise_amplitude = 0.0
stats_sample_interval = 50
stats_write_interval = 20000
stats_file = channel_stats.h5
runtime_file = runtimedata.txt

; Uniform BASE-resolution reference (128x64x128, no refinement). Its grid lines
; ARE the refined case's level-0 (coarse core) lines bitwise, so comparing the
; refined coarse core against this isolates the 2:1-interface effect from the
; coarse-resolution deficit (the uniform-256 reference conflates the two).
[grid]
nx = 128
ny = 64
nz = 128
lx = 12.566370614359172
ly = 2.0
lz = 6.283185307179586

[grid.x]
distribution = uniform

[grid.y]
distribution = natural
stretch = 16
natural_dyw_plus = 0.5

[grid.z]
distribution = uniform

[flow]
re = 180.0
forcing_x = 1.0

[time]
dt = 1.0e-5
t_final = 5.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 3.125e-4

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[output]
field_interval = 4000
field_prefix = channel_field

[restart]
file = RESTART_PLACEHOLDER
