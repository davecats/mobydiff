[case]
name = generic

; GATE 2 -- uniform-flow exactness through an embedded refined patch (the
; edge/corner transfer + projection consistency check). A constant velocity on a
; fully-periodic box with no forcing is an exact steady state: advection of a
; constant = 0, diffusion of a constant = 0, divergence = 0, so the projection is
; idle. After N steps every cell must still hold (initial_u, initial_v,
; initial_w) to round-off and p must stay constant -- otherwise the 2:1 transfer
; (RESTRICT/PROLONG/copy) at the patch faces/edges/corners is not exact for
; constants. Run with the PRODUCTION interface settings (const-1/2 default,
; momentum_reflux off) so this also certifies those paths are exact at
; edges/corners. Central 2x2x2-block patch -> all 6 faces, 12 edges, 8 corners.

[grid]
nx = 32
ny = 32
nz = 32
lx = 6.283185307179586
ly = 6.283185307179586
lz = 6.283185307179586

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 4
refine = 1.6 4.7 1.6 4.7 1.6 4.7
refine_levels = 1
momentum_reflux = false
interface_constant_half = true

[ibm]
enabled = false

[flow]
initial = uniform
initial_u = 1.0
initial_v = 0.5
initial_w = 0.25
re = 100.0

[time]
dt = 1.0e-3
nsteps = 10
t_final = 100.0
cflmax = 0.5
pecletmax = 0.5
dtmax = 0.1

[pressure]
niter = 50
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = true
periodic_y = true
periodic_z = true

[output]
field_interval = 10
field_prefix = uniform_patch
