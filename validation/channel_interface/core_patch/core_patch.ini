[case]
name = channel

; ============================================================================
; 2:1 INTERFACE -- EDGE/CORNER validation (single embedded core patch).
; Re_tau = 180 channel, base 128x64x128, with ONE level-1 refined box floating
; in the core (NOT at the wall). The box exercises ALL interface orientations:
; 6 faces, 12 edges, 8 corners, all genuine fine<->coarse (no degenerate wall
; edges). It is centred in y, so the two y-interfaces are mirror images about
; the centreline (orientation-symmetry check); both y-interfaces + the 4 side
; faces sit at y+ ~ 54.5 (log layer) where the base grid is already adequate --
; so any localised band/excess at a face/edge/corner is unambiguously the
; interface treatment, not coarse-resolution deficit (clean attribution; the
; whole point of choosing the core over a wall patch). See
; docs/next_session_edges_les.md open item 1.
;
; const-1/2 interface is the DEFAULT; momentum_reflux is OFF (the reflux was the
; flat-face u'/v' band -- a conservation-correct resolved-stress injection into
; the coarse cell; resolved 2026-06-29). Edges/corners keep plain injection for
; the velocity prolong, so this case tests the transfer + projection consistency
; there in real turbulence.
; ============================================================================

[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.0
small_noise_amplitude = 0.0
stats_sample_interval = -1
stats_write_interval = -1

[grid]
nx = 128
ny = 64
nz = 128
lx = 12.566370614359172
ly = 2.0
lz = 6.283185307179586

[grid.x]
distribution = uniform
[grid.y]
distribution = natural
stretch = 16
natural_dyw_plus = 0.5
[grid.z]
distribution = uniform

; Single core patch: x-blocks 6-9, z-blocks 6-9, y-rows 2-5 (a 4x4x4 base-block
; box). Box edges are mid-cell inside the first/last selected block so exactly
; those blocks refine. The IC (make_channel_restart --mode patch --refine-box
; <same 6 numbers>) reproduces the solver's leaf enumeration.
[blocks]
nb = 8
refine = 4.76147636559703 7.804894248762142 0.3202674414922831 1.679732558507717 2.380738182798515 3.902447124381071
refine_levels = 1
interface_constant_half = true

[flow]
re = 180.0
forcing_x = 1.0

[time]
dt = 1.0e-5
t_final = 100.0
nsteps = 250
cflmax = 0.8
pecletmax = 0.5
dtmax = 3.125e-4

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[output]
field_interval = 250
field_prefix = channel_field

[mpi]
dims = 1 1 1

[restart]
file = IC.h5
