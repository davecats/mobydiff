[case]
name = channel

; Base-128 control for the gate-4 edge/corner banding metric: the SAME channel
; as core_patch.ini but with NO refinement. Its level-0 field is bit-identical to
; the patch run's coarse leaves at t=0 (both from make_channel_restart base/patch
; coarse interpolation), so the cell-by-cell difference after the same steps
; isolates the interface footprint. Compare with tools/patch_interface_diff.py.

[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.0
small_noise_amplitude = 0.0
stats_sample_interval = -1
stats_write_interval = -1

[grid]
nx = 128
ny = 64
nz = 128
lx = 12.566370614359172
ly = 2.0
lz = 6.283185307179586

[grid.x]
distribution = uniform
[grid.y]
distribution = natural
stretch = 16
natural_dyw_plus = 0.5
[grid.z]
distribution = uniform

[blocks]
nb = 8

[flow]
re = 180.0
forcing_x = 1.0

[time]
dt = 1.0e-5
t_final = 100.0
nsteps = 250
cflmax = 0.8
pecletmax = 0.5
dtmax = 3.125e-4

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[output]
field_interval = 250
field_prefix = base_field

[mpi]
dims = 1 1 1

[restart]
file = base_IC.h5
