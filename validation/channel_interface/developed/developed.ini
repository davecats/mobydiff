[case]
name = channel

; ============================================================================
; DEVELOPED 2:1 wall-band channel -- PHASE 2: statistics (t = 5 .. 25).
; Restarts from the transient.ini final field; ACCUMULATES time-averaged
; statistics (mean U/V/W, uu/vv/ww/uv/uw/vw, u-p/v-p/w-p, k, eps) per
; wall-normal row per refinement level into channel_stats.h5 (+ _l1 for the
; refined level). RUN THIS IN A FRESH DIRECTORY (no pre-existing
; channel_stats.h5) so the accumulator starts from zero at t=5.
; Post-process with tools/plot_channel_stats.py.
; ============================================================================

[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.0
small_noise_amplitude = 0.0
; statistics ON: sample every 50 steps, flush the stats file every 20000.
stats_sample_interval = 50
stats_write_interval = 20000
stats_file = channel_stats.h5
runtime_file = runtimedata.txt

[grid]
nx = 128
ny = 64
nz = 128
lx = 12.566370614359172
ly = 2.0
lz = 6.283185307179586

[grid.x]
distribution = uniform
[grid.y]
distribution = natural
stretch = 16
natural_dyw_plus = 0.5
[grid.z]
distribution = uniform

[blocks]
nb = 8
refine = -1.0 13.6 -1.0 0.598617012688 -1.0 7.3
refine = -1.0 13.6 1.401382987312 3.0 -1.0 7.3
refine_levels = 1
; interface_constant_half = true   (default; energy-conserving / stable)

[flow]
re = 180.0
forcing_x = 1.0

[time]
dt = 1.0e-5
t_final = 25.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 3.125e-4

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[output]
field_interval = 0
field_prefix = channel_field

[mpi]
dims = 2 1 1

[restart]
file = ../transient_t5.h5
