[case]
name = channel

; ============================================================================
; DEVELOPED 2:1 wall-band channel -- PHASE 1: transient (t = 0 .. 5, discarded).
; Energy-conserving constant-1/2 interface is the DEFAULT now
; ([blocks] interface_constant_half = true, implicit). Statistics are OFF here
; so they are NOT polluted by the interpolated-IC transient; the final field
; (channel_field_<step>.h5) is the restart for developed.ini.
; Re_tau = 180, Lx x Ly x Lz = 4pi x 2 x 2pi, 128 x 64 x 128 base, wall bands
; refined to level 1. See README.md for the full run recipe (incl. 2 GPU).
; ============================================================================

[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.0
small_noise_amplitude = 0.0
; statistics OFF during the transient
stats_sample_interval = -1
stats_write_interval = -1

[grid]
nx = 128
ny = 64
nz = 128
lx = 12.566370614359172
ly = 2.0
lz = 6.283185307179586

[grid.x]
distribution = uniform
[grid.y]
distribution = natural
stretch = 16
natural_dyw_plus = 0.5
[grid.z]
distribution = uniform

[blocks]
nb = 8
refine = -1.0 13.6 -1.0 0.598617012688 -1.0 7.3
refine = -1.0 13.6 1.401382987312 3.0 -1.0 7.3
refine_levels = 1

[flow]
re = 180.0
forcing_x = 1.0

[time]
dt = 1.0e-5
t_final = 5.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 3.125e-4

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[output]
field_interval = 0
field_prefix = channel_field

; MPI decomposition: split the HOMOGENEOUS streamwise x (or spanwise z), NOT y,
; so the 2:1 wall-band interfaces stay WHOLE on each rank (no cross-level
; exchange across a rank boundary). For 2 ranks/2 GPUs:
[mpi]
dims = 2 1 1

[restart]
file = ../IC.h5
