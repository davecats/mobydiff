[case]
name = channel

[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.0
small_noise_amplitude = 0.0
stats_sample_interval = 50
stats_write_interval = 5000
stats_file = channel_stats.h5
runtime_file = runtimedata.txt

[grid]
nx = 128
ny = 64
nz = 128
lx = 12.566370614359172
ly = 2.0
lz = 6.283185307179586

[grid.x]
distribution = uniform

[grid.y]
distribution = natural
stretch = 16
natural_dyw_plus = 0.5

[grid.z]
distribution = uniform

; Both wall bands refined to level 1: 3 block rows = 24 base cells,
; interface at y = 0.6205 (y+ = 112). Box edges sit inside the last
; refined block row so exactly rows 0-2 are refined (and mirrored at the
; top wall). 12800 leaves, 12288 fine.
[blocks]
nb = 8
refine = -1.0 13.6 -1.0 0.598617012688 -1.0 7.3
refine = -1.0 13.6 1.401382987312 3.0 -1.0 7.3
refine_levels = 1
; Berger-Colella momentum reflux at the 2:1 interface (conserves the
; interface momentum flux -- the -<u'v'> defect); see validation/momentum_interface.

[flow]
re = 180.0
forcing_x = 1.0

[time]
dt = 1.0e-5
t_final = 5.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 3.125e-4

[pressure]
niter = 6
; Damped-Jacobi projection (claude/jacobi-interface): sor (omega) < 1 REQUIRED --
; simple Jacobi DIVERGES for sor > 0.8 (the old red-black SOR used 1.5). niter = 6
; = the old 3 red-black iterations x 2 colours; the projection is UNDER-CONVERGED
; at this niter (plateaus on the large scales), a multi-level Schwarz is the
; planned fix. accel = chebyshev (Chebyshev-Jacobi) holds ~3.4x lower divergence
; than plain Jacobi at the SAME niter=6 for ~1.6% more cost (uniform reference,
; 1000 steps, see divergence_comparison.png) -- the default here.
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[output]
field_interval = 4000
field_prefix = channel_field

[restart]
file = RESTART_PLACEHOLDER
