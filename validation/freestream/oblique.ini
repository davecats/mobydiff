[case]
name = generic

; A0 gate (b): uniform oblique freestream through an EMPTY box with declared
; inlet/outlet faces (docs/next_session_airfoil.md). alpha = 20 deg:
; (u,v) = (cos a, sin a). Constants lie in the null space of every consistent
; operator, so the field must be preserved EXACTLY (max deviation 0.0) --
; any sign/metric error at the new outlet shows up immediately.
[grid]
nx = 32
ny = 32
nz = 32
lx = 1.0
ly = 1.0
lz = 1.0

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8

[ibm]
enabled = false

[flow]
re = 100.0
initial_u = 0.9396926207859084
initial_v = 0.3420201433256687
initial_w = 0.0

[time]
dt = 1.0e-3
nsteps = 200
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 1.0e-2

[pressure]
niter = 6
sor = 0.8

[boundary]
periodic_x = false
periodic_y = false
periodic_z = true
x_min_patch = inlet
x_min_u_value = 0.9396926207859084
x_min_v_value = 0.3420201433256687
y_min_patch = inlet
y_min_u_value = 0.9396926207859084
y_min_v_value = 0.3420201433256687
y_max_patch = inlet
y_max_u_value = 0.9396926207859084
y_max_v_value = 0.3420201433256687
x_max_patch = outlet

[output]
field_interval = 0
field_prefix = oblique
