[case]
name = generic

; A0 gate (d): a Lamb-Oseen vortex (make_vortex_ic.py overwrites the uniform
; template) advected by U = 1 through the x_max outlet. Quasi-2D (thin
; periodic z). Gates: no blow-up; the vortex exits; report the reflected
; fraction (perturbation energy after exit / initial).
[grid]
nx = 64
ny = 64
nz = 4
lx = 2.0
ly = 2.0
lz = 0.125

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 4

[ibm]
enabled = false

[flow]
re = 1000.0
initial_u = 1.0
initial_v = 0.0
initial_w = 0.0

[time]
dt = 1.0e-3
nsteps = 100000000
t_final = 2.5
cflmax = 0.8
pecletmax = 0.5
dtmax = 1.0e-2

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = false
periodic_y = false
periodic_z = true
x_min_patch = inlet
x_min_u_value = 1.0
y_min_patch = inlet
y_min_u_value = 1.0
y_max_patch = inlet
y_max_u_value = 1.0
x_max_patch = outlet

[restart]
file = IC_vortex.h5

[output]
field_interval = 25
field_prefix = lamboseen
