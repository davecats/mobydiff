[case]
name = generic

; A0 gate (c), inflow/outflow leg: SAME grid as pois_ref, x made non-periodic:
; parabolic Dirichlet inlet (peak 1) at x_min, Dirichlet-pressure outlet at
; x_max, y walls DECLARED (patch = wall). NO forcing -- the inlet flux + the
; outlet pressure sustain the flow. Restarts from the developed periodic
; reference (make_pois_ic.py); gates: profile matches the reference to
; discretization error, pressure linear in x and pinned at the outlet,
; drift-free over 10k steps.
[grid]
nx = 32
ny = 32
nz = 4
lx = 1.0
ly = 1.0
lz = 0.125

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 4

[ibm]
enabled = false

[flow]
re = 100.0
forcing_x = 0.0

[time]
dt = 1.0e-3
nsteps = 10000
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 2.0e-2

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = false
periodic_y = false
periodic_z = true
x_min_patch = inlet
x_min_u_value = 1.0
x_min_u_profile = parabola
x_max_patch = outlet
y_min_patch = wall
y_max_patch = wall

[restart]
file = IC_pois.h5

[output]
field_interval = 0
field_prefix = pois_io
