; Outlet gate, mirrored pair (docs/next_session_outlet.md): a short channel, parabolic
; inlet with a cross-flow component so the outflow is NOT parallel, walls in y.
; outlet_high has the inlet at x_min and the outlet at x_max; outlet_low is its
; mirror image in x. check_freestream.py mirror compares the two under
;   u(i) <-> -u(nx+2-i),  v, p (i) <-> (nx+1-i).
[case]
name = generic
[grid]
nx = 16
ny = 32
nz = 4
lx = 0.5
ly = 1.0
lz = 0.125
[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform
[blocks]
nb = 4
[ibm]
enabled = false
[flow]
re = 100.0
forcing_x = 0.0
[time]
dt = 1.0e-3
nsteps = 400
t_final = 0.0
cflmax = 0.0
pecletmax = 0.0
dtmax = 1.0e-3
[pressure]
niter = 12
sor = 0.8
accel = chebyshev
[boundary]
periodic_x = false
periodic_y = false
periodic_z = true
x_max_patch = inlet
x_max_u_value = -1.0
x_max_u_profile = parabola
x_max_v_value = 0.3
x_max_v_profile = parabola
x_min_patch = outlet
y_min_patch = wall
y_max_patch = wall
[output]
field_interval = 0
field_prefix = outlet_low
