[case]
name = generic

; A0 gate (c), reference leg: x/z-periodic plane Poiseuille sustained by
; forcing_x = 8*nu (continuous peak u = 1, H = 1). Run to steady state; the
; final field seeds the inflow/outflow twin (make_pois_ic.py) and its profile
; is the comparison target.
[grid]
nx = 32
ny = 32
nz = 4
lx = 1.0
ly = 1.0
lz = 0.125

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 4

[ibm]
enabled = false

[flow]
re = 100.0
forcing_x = 0.08

[time]
dt = 1.0e-3
nsteps = 100000000
t_final = 60.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 2.0e-2

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[output]
field_interval = 0
field_prefix = pois_ref
