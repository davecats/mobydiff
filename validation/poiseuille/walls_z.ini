[case]
name = generic

; Poiseuille + blowing/suction, walls in z (see walls_y.ini for the physics).
; Wall-normal = z (resolved, nz=64); flow in x (forcing_x); crossflow w=V blown
; in at z=0, sucked out at z=Lz. 1D in z, so x,y are thin/periodic. Cells CUBIC.
[grid]
nx = 4
ny = 4
nz = 64
lx = 0.0625
ly = 0.0625
lz = 1.0

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[ibm]
enabled = false

[flow]
re = 100.0
forcing_x = 0.08

[time]
dt = 1.0e-3
nsteps = 0
t_final = 5.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 0.05

[pressure]
niter = 3
sor = 1.5

[boundary]
periodic_x = true
periodic_y = true
periodic_z = false
z_min_u_value = 0.0
z_min_v_value = 0.0
z_min_w_value = 0.04
z_max_u_value = 0.0
z_max_v_value = 0.0
z_max_w_value = 0.04

[output]
field_interval = 0
field_prefix = poiseuille
