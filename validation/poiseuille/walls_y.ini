[case]
name = generic

; Plane Poiseuille flow with uniform wall blowing/suction (exact STEADY NS
; solution). Walls in y; crossflow V blown in at y=0, sucked out at y=Ly (so
; global mass is conserved); body force G=forcing_x sustains the profile:
;   nu u'' - V u' = -G,  u(y) = (G/V)[y - L(e^{Vy/nu}-1)/(e^{VL/nu}-1)],  v=V.
; Exercises momentum convection (V du/dy) + diffusion (nu u'') + the projection.
; IC = exact (MOBY_POISEUILLE=1); the flow stays within O(h^2) of it, so
; tools/check_poiseuille.py gives the spatial error (sweep ny for the order).
; 1D in y, so x,z are thin/periodic (just 4 cells). Cells are CUBIC (isotropic
; h): lx/nx = ly/ny = lz/nz = 1/64. To sweep the wall-normal resolution keep
; nx=nz=4 fixed and set ly/ny = lx/4, i.e. lx=lz=4/ny (the cell count stays tiny).
[grid]
nx = 4
ny = 64
nz = 4
lx = 0.0625
ly = 1.0
lz = 0.0625

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[ibm]
enabled = false

[flow]
re = 100.0
forcing_x = 0.08

[time]
dt = 1.0e-3
nsteps = 0
t_final = 5.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 0.05

[pressure]
niter = 3
sor = 1.5

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true
y_min_u_value = 0.0
y_min_v_value = 0.04
y_min_w_value = 0.0
y_max_u_value = 0.0
y_max_v_value = 0.04
y_max_w_value = 0.0

[output]
field_interval = 0
field_prefix = poiseuille
