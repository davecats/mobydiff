[case]
name = generic

; Poiseuille + blowing/suction, walls in x (see walls_y.ini for the physics).
; Wall-normal = x (resolved, nx=64); flow in y (forcing_y); crossflow u=V blown
; in at x=0, sucked out at x=Lx. 1D in x, so y,z are thin/periodic. Cells CUBIC.
[grid]
nx = 64
ny = 4
nz = 4
lx = 1.0
ly = 0.0625
lz = 0.0625

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[ibm]
enabled = false

[flow]
re = 100.0
forcing_y = 0.08

[time]
dt = 1.0e-3
nsteps = 0
t_final = 5.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 0.05

[pressure]
niter = 3
sor = 1.5

[boundary]
periodic_x = false
periodic_y = true
periodic_z = true
x_min_u_value = 0.04
x_min_v_value = 0.0
x_min_w_value = 0.0
x_max_u_value = 0.04
x_max_v_value = 0.0
x_max_w_value = 0.0

[output]
field_interval = 0
field_prefix = poiseuille
