[case]
name = airfoil

; R2D-3 fan bench: the R1a L5 ground-truth configuration re-oriented for
; 2D refinement — span along Y ([case.airfoil] span = y: chord x, LIFT
; z, freestream (U cos a, 0, U sin a), inlets x_min/z_min/z_max, outlet
; x_max), [blocks] refine_dims = xz so the span never pays 2^L cells.
; Same physics as the R1 L5 run (aoa 4, RANS SST, Re 1e5, t_final 1.5,
; dt 2e-4, remove-buried coefficients — forces meaningless by
; construction, fan metric only). L5 ring Delta = 7.32e-4 c.
[case.airfoil]
aoa = 4.0
u_inf = 1.0
chord = 1.0
span = y
force_sample_interval = 20
runtime_file = forces_xz_l5.txt

[grid]
nx = 512
ny = 8
nz = 512
lx = 12.0
ly = 0.1875
lz = 12.0

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8
refine_body = true
refine_levels = 5
refine_dims = xz

[ibm]
enabled = true
coeff_file = ibm_coeff_n0012_xz_l6.h5

[flow]
re = 1.0e5

[turbulence]
model = rans

[rans]
model = sst
tu = 5.0
nut_ratio = 10.0

[time]
dt = 2.0e-4
nsteps = 100000000
t_final = 1.5
cflmax = 0.8
pecletmax = 0.5
dtmax = 2.0e-4

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[output]
field_interval = 7500
field_prefix = n0012_xz_l5
