[case]
name = airfoil

; R2D-3 AoA sweep at L5-xz, aoa = 0: the A3 NACA 0012 SST sanity in
; the span-y orientation (chord x, LIFT z, inlets x_min/z_min/z_max,
; outlet x_max; refine_dims = xz: the span never pays 2^L cells).
; L5 surface Delta = 7.32e-4 c, KEEP-BURIED coefficients
; (load-bearing for the penalization forces), t_final 10, dt 2e-4.
; Fan bench twin: xz_l5.ini.
[case.airfoil]
aoa = 0.0
u_inf = 1.0
chord = 1.0
span = y
force_sample_interval = 20
runtime_file = forces_xz_aoa0.txt

[grid]
nx = 512
ny = 8
nz = 512
lx = 12.0
ly = 0.1875
lz = 12.0

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8
refine_body = true
refine_levels = 5
refine_dims = xz

[ibm]
enabled = true
coeff_file = ibm_coeff_n0012_xz_l6_kb.h5

[flow]
re = 1.0e5

[turbulence]
model = rans

[rans]
model = sst
tu = 5.0
nut_ratio = 10.0

[time]
dt = 2.0e-4
nsteps = 100000000
t_final = 10.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 2.0e-4

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[output]
field_interval = 50000
field_prefix = n0012_xz_aoa0
