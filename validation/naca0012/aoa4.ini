[case]
name = airfoil

; A3 INCREMENT 2: full-turbulent SST sanity on a NACA 0012 at Re_c = 1e5
; (transition = false, resolved walls). aoa sweep 0/4/8 by sed on this
; file (aoa + runtime_file). Gate: C_L(alpha) slope ~2pi-ish and C_D
; magnitude vs XFOIL/literature — sanity band, not tight.
;
; Grid: 12c x 12c x 0.1875c, base 512x512x8 (nb = 8, Delta0 = 0.0234c),
; refine_body refine_levels = 4 -> Delta4 = 1.465e-3c at the surface
; (y+_1 ~ 2-4 at the turbulent midchord — resolved-mode tolerable for a
; sanity gate). LE at (4.5, 6.0), chord along +x; the freestream carries
; the angle (the geometry never rotates).
;
; dtmax: the eddy-viscosity momentum correction is explicit and the
; Peclet limiter is molecular-only — 4e-4 respects Delta4^2/(6 nu_eff)
; at the expected nut/nu ~ 30-50 near the fine-level edge.
[case.airfoil]
aoa = 4.0
u_inf = 1.0
chord = 1.0
force_sample_interval = 20
runtime_file = forces_aoa4.txt

[grid]
nx = 512
ny = 512
nz = 8
lx = 12.0
ly = 12.0
lz = 0.1875

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8
refine_body = true
refine_levels = 4

[ibm]
enabled = true
coeff_file = ibm_coeff_n0012.h5

[flow]
re = 1.0e5

[turbulence]
model = rans

[rans]
model = sst
tu = 5.0
nut_ratio = 10.0

[time]
dt = 4.0e-4
nsteps = 100000000
t_final = 10.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 4.0e-4

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[output]
field_interval = 0
field_prefix = n0012_aoa4
