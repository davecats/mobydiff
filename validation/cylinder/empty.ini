[case]
name = airfoil

; A1/A2 gate (c): the airfoil case at aoa != 0 in an EMPTY domain (IBM off,
; coef = 0 everywhere): C_L = C_D = 0.0 exactly in forces.txt, freestream
; preserved (the case-composed twin of validation/freestream/oblique.ini).
[case.airfoil]
aoa = 5.0
u_inf = 1.0
chord = 1.0
force_sample_interval = 1
runtime_file = forces_empty.txt

[grid]
nx = 32
ny = 32
nz = 8
lx = 1.0
ly = 1.0
lz = 0.25

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8

[ibm]
enabled = false

[flow]
re = 100.0

[time]
dt = 1.0e-3
nsteps = 100
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 1.0e-2

[pressure]
niter = 6
sor = 0.8

[output]
field_interval = 0
field_prefix = cyl_empty
