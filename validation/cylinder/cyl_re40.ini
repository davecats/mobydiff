[case]
name = airfoil

; A1/A2 gate (a): steady cylinder at Re = 40 (impulsive start). Penalization
; C_D literature band 1.5-1.6 (16D domain, Dirichlet far-field, D/h = 32),
; C_L -> 0. The converged snapshot feeds the Gauss/CV cross-check (gate e).
; Cylinder D = 1 at (6.0, 8.02) -- the small y offset seeds the Re = 100
; shedding; at Re = 40 it is inconsequential.
[case.airfoil]
aoa = 0.0
u_inf = 1.0
chord = 1.0
force_sample_interval = 10
; Runtime forces = the CONTROL-VOLUME momentum budget over this box
; (D = 1 at (6.0, 8.02), so margin 1.5D in chord and lift); borders
; snapped to cell faces at setup. REQUIRED -- the penalization
; integral is gone. NOTE the budget reads the STORED pressure, so it
; needs a converged p: see the README's clean-p recipe before
; trusting a long production run's numbers.
cv_box = 4.0 8.0 6.5 9.5
runtime_file = forces_re40.txt

[grid]
nx = 512
ny = 512
nz = 8
lx = 16.0
ly = 16.0
lz = 0.25

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8

[ibm]
enabled = true
coeff_file = ibm_coeff_re40.h5

[flow]
re = 40.0

[time]
dt = 1.0e-3
nsteps = 100000000
t_final = 100.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 5.0e-3

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[output]
field_interval = 0
field_prefix = cyl_re40
