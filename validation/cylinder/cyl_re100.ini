[case]
name = airfoil

; A1/A2 gate (a): shedding cylinder at Re = 100 (impulsive start). Penalization
; C_D literature band 1.5-1.6 (16D domain, Dirichlet far-field, D/h = 32),
; C_L -> 0. The converged snapshot feeds the Gauss/CV cross-check (gate e).
; Cylinder D = 1 at (6.0, 8.02) -- the small y offset seeds the Re = 100
; shedding; at Re = 40 it is inconsequential.
[case.airfoil]
aoa = 0.0
u_inf = 1.0
chord = 1.0
force_sample_interval = 10
runtime_file = forces_re100.txt

[grid]
nx = 512
ny = 512
nz = 8
lx = 16.0
ly = 16.0
lz = 0.25

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8

[ibm]
enabled = true
coeff_file = ibm_coeff_re100.h5

[flow]
re = 100.0

[time]
dt = 1.0e-3
nsteps = 100000000
t_final = 200.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 5.0e-3

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[output]
field_interval = 0
field_prefix = cyl_re100
