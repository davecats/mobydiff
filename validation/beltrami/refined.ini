[case]
name = generic

; Fully 3D decaying Beltrami / ABC flow (exact incompressible-NS solution),
; triggered by MOBY_BELTRAMI=1. Every velocity component is non-trivial and
; depends on two coordinates, so unlike the 2D Taylor-Green vortex this
; exercises all three directions. The field decays self-similarly as
; exp(-nu k^2 t), k = 2*pi/Lx, on a 2*pi-periodic CUBE; tools/check_beltrami.py
; gives the exact error. Uniform single-block reference; sweep nx=ny=nz over
; 32/64/128 for the spatial convergence order.
[grid]
nx = 64
ny = 64
nz = 64
lx = 6.283185307179586
ly = 6.283185307179586
lz = 6.283185307179586

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
; Central 3D 2:1-refined cube patch (interfaces stressed in all 3 dirs).
nb = 8
refine = 1.6 4.7 1.6 4.7 1.6 4.7
refine_levels = 1

[ibm]
enabled = false

[flow]
re = 100.0

[time]
dt = 1.0e-3
nsteps = 0
t_final = 2.0
cflmax = 0.5
pecletmax = 0.5
dtmax = 0.1

[pressure]
niter = 200
sor = 1.5

[boundary]
periodic_x = true
periodic_y = true
periodic_z = true

[output]
field_interval = 0
field_prefix = beltrami
