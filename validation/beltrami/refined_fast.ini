[case]
name = generic

; FAST interface-trajectory discriminator (engineered 2026-06-23). Same 3D
; Beltrami / 2:1-patch setup as refined.ini but 32^3 (nb=4) instead of 64^3
; (nb=8): ~8x fewer cells, ~2x larger CFL dt -> ~16x cheaper per unit time.
; The central 2x2x2-block patch keeps interfaces in all 3 directions plus the
; patch edges/corners (the cells the both-worlds combo targets). Drive with
; tools/agglom_trajectory.py --src validation/beltrami/refined_fast.ini.
;
; VALIDATED 2026-06-23 (GPU, niter=10, t_final=20, interval 100): reproduces the
; 64^3 ranking EXACTLY with a ~20x larger signal and ~1 min/run (vs ~20 min):
;   per-cell+MP 1.086  <  off 1.187  <  flat 1.305     (64^3: 1.029 < 1.038 < 1.043)
; Keep re=100 and t_final=20. The discriminating signal is the LATE-time rise
; (the artifact slowly winning against viscous decay); the early floor INVERTS
; the ranking, so do NOT shorten t_final.
;
; DEAD END (do not retry): raising re to compress the time axis FAILS. At re=400
; the metric is dominated by the early transient (peak ~t=2) where per-cell+MP's
; higher floor wins -> ranking INVERTS (per-cell+MP 1.282 > off 1.233 at t=10).
; High re removes the viscous decay that the late-time discrimination needs. The
; only safe speed lever is fewer cells (this 32^3), not Re/time compression.
[grid]
nx = 32
ny = 32
nz = 32
lx = 6.283185307179586
ly = 6.283185307179586
lz = 6.283185307179586

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
; Central 2x2x2 block patch refined to level 1 (cells 8..24 of 32, nb=4 -> 8
; cells/block, so blocks 1 and 2 in each direction). Interfaces in all dirs.
nb = 4
refine = 1.6 4.7 1.6 4.7 1.6 4.7
refine_levels = 1

[ibm]
enabled = false

[flow]
initial = beltrami
re = 100.0

[time]
dt = 1.0e-3
nsteps = 0
t_final = 2.0
cflmax = 0.5
pecletmax = 0.5
dtmax = 0.1

[pressure]
niter = 200
sor = 0.8

[boundary]
periodic_x = true
periodic_y = true
periodic_z = true

[output]
field_interval = 0
field_prefix = beltrami
