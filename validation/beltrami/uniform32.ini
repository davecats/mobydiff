[case]
name = generic

; Fast single-step y-band slab for interface diagnostics (PREDONLY/PROJONLY/MANUF).
; 32^3, nb=8 -> 4 blocks/dim; the middle two y-block rows refined => a y-band with
; two 2:1 interfaces (no edges/corners), the channel-relevant geometry.
[grid]
nx = 32
ny = 32
nz = 32
lx = 6.283185307179586
ly = 6.283185307179586
lz = 6.283185307179586

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8



[ibm]
enabled = false

[flow]
initial = beltrami
re = 100.0

[time]
dt = 1.0e-3
nsteps = 1
t_final = 100.0
cflmax = 0.5
pecletmax = 0.5
dtmax = 0.1

[pressure]
niter = 50
sor = 0.8

[boundary]
periodic_x = true
periodic_y = true
periodic_z = true

[output]
field_interval = 0
field_prefix = diag
