; RANS T2 gate (a): laminar plane channel with the k-omega SST model ON.
; Re_tau = 10 (re = 10, forcing_x = 1, half-height 1) with a SMALL seed
; (tu = 1%): the run must settle onto the laminar parabola while k decays
; by orders of magnitude. (At Re_tau 30 with tu = 5% the no-transition
; SST finds its textbook weakly-turbulent branch -- k self-sustains and
; the parabola flattens 12% -- so the gate probes the genuinely
; subcritical regime.)

[case]
name = channel

[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.0
small_noise_amplitude = 0.0
stats_sample_interval = 0
stats_write_interval = 0

[grid]
nx = 16
ny = 64
nz = 8
lx = 6.283185307179586
ly = 2.0
lz = 3.141592653589793

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8

[flow]
re = 10.0
forcing_x = 1.0

[time]
dt = 1.0e-3
t_final = 60.0
nsteps = 100000000
cflmax = 0.5
pecletmax = 0.5
dtmax = 2.0e-2

[pressure]
niter = 6
sor = 0.8

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[turbulence]
model = rans

[rans]
model = sst
tu = 1.0
nut_ratio = 10.0

[output]
field_interval = 0
field_prefix = laminar

