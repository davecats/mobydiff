; RANS T2 gate (c) -- THE key IBM gate: the les_ibm off-grid file-IBM
; plane-wall channel (walls mid-cell at y = 0.259375 / 2.259375, fluid gap
; exactly 2.0, Re_tau ~ 180) run with the k-omega SST model through the
; IBM wall treatment (wall-cell omega pinning on the dwall_blocks
; distance). Must reproduce the gate-(b) log law through the immersed
; walls: rans_channel_check.py --mode loglaw --wall-lo 0.259375
; --wall-hi 2.259375 (uniform y: y+_1 ~ 2-3, so a looser tolerance).
;
; Needs ../rans_geometry/ibm_coeff_blocks_l1.h5 (mobygeom block-table with
; dwall_blocks; regenerate with ../rans_geometry/setup.sh) and the les_ibm
; IC (../channel_interface/les_ibm/IC.h5).

[case]
name = channel

[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.0
small_noise_amplitude = 0.0
stats_sample_interval = 0
stats_write_interval = 0

[grid]
nx = 64
ny = 80
nz = 64
lx = 12.566370614359172
ly = 2.5
lz = 6.283185307179586

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8

[flow]
re = 180.0
forcing_x = 1.0

[time]
dt = 1.0e-5
t_final = 100.0
nsteps = 100000000
cflmax = 0.5
pecletmax = 0.4
dtmax = 5.0e-4

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[ibm]
enabled = true
coeff_file = ../rans_geometry/ibm_coeff_blocks_l1.h5

[turbulence]
model = rans

[rans]
model = sst
tu = 5.0
nut_ratio = 10.0

[output]
field_interval = 0
field_prefix = ibm180

[restart]
file = ../channel_interface/les_ibm/IC.h5
