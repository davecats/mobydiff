; RANS T3 gate (c): ibm180 (the les_ibm off-grid file-IBM plane-wall
; channel, y+_1 ~ 2-3) run with wall_treatment = wall_function. At this
; resolution the k-based y+ keeps the blend on its viscous branch almost
; everywhere, so the result must NOT regress vs the T2 resolved ibm180:
; rans_channel_check.py --mode wallfn --reference <ibm180 field>
; --wall-lo 0.259375 --wall-hi 2.259375.

[case]
name = channel

[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.0
small_noise_amplitude = 0.0
stats_sample_interval = 0
stats_write_interval = 0

[grid]
nx = 64
ny = 80
nz = 64
lx = 12.566370614359172
ly = 2.5
lz = 6.283185307179586

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8

[flow]
re = 180.0
forcing_x = 1.0

[time]
dt = 1.0e-5
t_final = 100.0
nsteps = 100000000
cflmax = 0.5
pecletmax = 0.4
dtmax = 5.0e-4

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[ibm]
enabled = true
coeff_file = ../rans_geometry/ibm_coeff_blocks_l1.h5

[turbulence]
model = rans

[rans]
model = sst
wall_treatment = wall_function
tu = 5.0
nut_ratio = 10.0

[output]
field_interval = 0
field_prefix = ibm180wf

[restart]
file = ../channel_interface/les_ibm/IC.h5
