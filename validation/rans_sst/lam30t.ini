; RANS T4 gate (a), the DISCRIMINATING laminar gate: the same Re_tau = 30
; / tu = 5% channel as lam30.ini, but with the gamma-Re_thetat transition
; model ON. Where plain SST self-sustains on its weakly-turbulent branch,
; the transition model must keep the flow LAMINAR: gamma low in the wall
; layer, P_k suppressed, parabola recovered. NOTE the gamma floor
; 1/ce2 = 0.02 keeps 2% of P_k, so k equilibrates at a small stationary
; residual (~9e-3) instead of decaying outright -- the laminar check runs
; with --k-max 0.02 (see check_gates.sh).

[case]
name = channel

[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.0
small_noise_amplitude = 0.0
stats_sample_interval = 0
stats_write_interval = 0

[grid]
nx = 16
ny = 64
nz = 8
lx = 6.283185307179586
ly = 2.0
lz = 3.141592653589793

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8

[flow]
re = 30.0
forcing_x = 1.0

[time]
dt = 1.0e-3
t_final = 150.0
nsteps = 100000000
cflmax = 0.5
pecletmax = 0.5
dtmax = 2.0e-2

[pressure]
niter = 6
sor = 0.8

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[turbulence]
model = rans

[rans]
model = sst
transition = true
tu = 5.0
nut_ratio = 10.0

[output]
field_interval = 0
field_prefix = lam30t

