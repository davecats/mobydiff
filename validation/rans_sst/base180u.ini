; RANS T2 gate (d), reference half: uniform-y single-level RANS channel at
; Re_tau 180 (y+_1 ~ 1.4). Twin of refine180.ini without the refinement --
; the refined case must show no interface band in k/omega/nut against this.

[case]
name = channel

[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.0
small_noise_amplitude = 0.0
stats_sample_interval = 0
stats_write_interval = 0

[grid]
nx = 8
ny = 128
nz = 8
lx = 3.141592653589793
ly = 2.0
lz = 1.5707963267948966

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8

[flow]
re = 180.0
forcing_x = 1.0

[time]
dt = 1.0e-4
t_final = 200.0
nsteps = 100000000
cflmax = 0.5
pecletmax = 0.4
dtmax = 5.0e-2

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[turbulence]
model = rans

[rans]
model = sst
tu = 5.0
nut_ratio = 10.0

[output]
field_interval = 0
field_prefix = base180u
