; RANS T4 gate (a), subcritical control: laminar.ini (Re_tau = 10,
; tu = 1%) with the transition model ON -- must stay laminar exactly like
; the T2 no-transition run (parabola + k decay).

[case]
name = channel

[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.0
small_noise_amplitude = 0.0
stats_sample_interval = 0
stats_write_interval = 0

[grid]
nx = 16
ny = 64
nz = 8
lx = 6.283185307179586
ly = 2.0
lz = 3.141592653589793

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8

[flow]
re = 10.0
forcing_x = 1.0

[time]
dt = 1.0e-3
t_final = 60.0
nsteps = 100000000
cflmax = 0.5
pecletmax = 0.5
dtmax = 2.0e-2

[pressure]
niter = 6
sor = 0.8

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[turbulence]
model = rans

[rans]
model = sst
transition = true
tu = 1.0
nut_ratio = 10.0

[output]
field_interval = 0
field_prefix = laminart

