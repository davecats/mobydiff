; RANS T4 control (informational, transition OFF): Re_tau = 30 channel
; with tu = 5% -- exactly where the plain no-transition SST finds its
; textbook weakly-turbulent branch (k self-sustains, the parabola
; flattens ~12%; T2 README). Documents WHY the transition gate at the
; same conditions is discriminating.

[case]
name = channel

[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.0
small_noise_amplitude = 0.0
stats_sample_interval = 0
stats_write_interval = 0

[grid]
nx = 16
ny = 64
nz = 8
lx = 6.283185307179586
ly = 2.0
lz = 3.141592653589793

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8

[flow]
re = 30.0
forcing_x = 1.0

[time]
dt = 1.0e-3
t_final = 150.0
nsteps = 100000000
cflmax = 0.5
pecletmax = 0.5
dtmax = 2.0e-2

[pressure]
niter = 6
sor = 0.8

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[turbulence]
model = rans

[rans]
model = sst
tu = 5.0
nut_ratio = 10.0

[output]
field_interval = 0
field_prefix = lam30

