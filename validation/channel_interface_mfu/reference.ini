[case]
name = channel

[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.0
small_noise_amplitude = 0.0
stats_sample_interval = 50
stats_write_interval = 5000
stats_file = channel_stats.h5
runtime_file = runtimedata.txt

; Minimal-flow-unit reference: a uniform 2x2x2 box. Its grid is the band-refined
; cases' COARSE (centre) level bitwise -- the midpoint subdivision of the
; 24x64x40 native lines ([grid.*] subdivided = true). So the refined case has
; the same resolution as the reference in the centre and is 2x finer (one more
; subdivision) at the walls: the block-refined case is never coarser than the
; reference, and the coarse side of each interface carries the same spectral
; content as the reference (no under-resolution aliasing). The y-line matches
; the full channel_interface case's fine level.
[grid]
nx = 48
ny = 128
nz = 80
lx = 2.0
ly = 2.0
lz = 2.0

[grid.x]
distribution = uniform
subdivided = true

[grid.y]
distribution = natural
stretch = 16
natural_dyw_plus = 0.5
subdivided = true

[grid.z]
distribution = uniform
subdivided = true

[flow]
re = 180.0
forcing_x = 1.0

[time]
dt = 1.0e-5
t_final = 5.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 3.125e-4

[pressure]
niter = 3
sor = 1.5

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[output]
field_interval = 4000
field_prefix = channel_field

[restart]
file = RESTART_PLACEHOLDER
