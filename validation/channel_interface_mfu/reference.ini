[case]
name = channel

[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.0
small_noise_amplitude = 0.0
stats_sample_interval = 50
stats_write_interval = 5000
stats_file = channel_stats.h5
runtime_file = runtimedata.txt

; Minimal-flow-unit reference: a 2x2x2 box at (close to) the full channel's
; near-wall resolution. Uniform; every line is the midpoint subdivision of the
; refined cases' 24x64x40 base lines ([grid.*] subdivided = true), so the
; refined fine level shares this grid bitwise. The y-line is identical to the
; full channel_interface case.
[grid]
nx = 48
ny = 128
nz = 80
lx = 2.0
ly = 2.0
lz = 2.0

[grid.x]
distribution = uniform
subdivided = true

[grid.y]
distribution = natural
stretch = 16
natural_dyw_plus = 0.5
subdivided = true

[grid.z]
distribution = uniform
subdivided = true

[flow]
re = 180.0
forcing_x = 1.0

[time]
dt = 1.0e-5
t_final = 5.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 3.125e-4

[pressure]
niter = 3
sor = 1.5

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[output]
field_interval = 4000
field_prefix = channel_field

[restart]
file = RESTART_PLACEHOLDER
