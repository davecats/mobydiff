[case]
name = channel

[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.0
small_noise_amplitude = 0.0
stats_sample_interval = 50
stats_write_interval = 5000
stats_file = channel_stats.h5
runtime_file = runtimedata.txt

; Minimal-flow-unit reference: a uniform 2x2x2 box at the refined cases' BASE
; (coarse) resolution, so the band-refined case is never coarser than the
; reference -- equal in the coarse interior, 2x finer in the wall bands. The
; coarse side of each interface then carries the same spectral content as the
; reference, so interface artifacts are not confused with under-resolution
; aliasing. The grid is the refined cases' base lines bitwise (native, not
; subdivided); the refined fine level is the subdivision of this grid. The
; y-line is identical to the full channel_interface case.
[grid]
nx = 24
ny = 64
nz = 40
lx = 2.0
ly = 2.0
lz = 2.0

[grid.x]
distribution = uniform

[grid.y]
distribution = natural
stretch = 16
natural_dyw_plus = 0.5

[grid.z]
distribution = uniform

[flow]
re = 180.0
forcing_x = 1.0

[time]
dt = 1.0e-5
t_final = 5.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 3.125e-4

[pressure]
niter = 3
sor = 1.5

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[output]
field_interval = 4000
field_prefix = channel_field

[restart]
file = RESTART_PLACEHOLDER
