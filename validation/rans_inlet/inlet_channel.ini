[case]
name = generic

; A3 INCREMENT 1 gate (b): RANS (SST) plane channel with a declared
; Poiseuille INLET and OUTLET. The inlet face must hold the freestream
; scalar values (k_inf = 1.5 (tu/100 U_inf)^2 with U_inf = 1 the profile
; peak; omega_inf = k_inf Re / nut_ratio) via the new SCALAR_BC_VALUE
; ghosts; report_patch_types must show inlet/outlet/wall as declared.
[grid]
nx = 64
ny = 32
nz = 8
lx = 8.0
ly = 2.0
lz = 0.5

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8

[ibm]
enabled = false

[flow]
re = 100.0
initial_u = 1.0

[turbulence]
model = rans

[rans]
model = sst
tu = 5.0
nut_ratio = 10.0

[time]
dt = 2.0e-3
nsteps = 500
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 2.0e-3

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = false
periodic_y = false
periodic_z = true
x_min_patch = inlet
x_min_u_value = 1.0
x_min_u_profile = parabola
x_max_patch = outlet
y_min_patch = wall
y_max_patch = wall

[output]
field_interval = 0
field_prefix = inlet_channel
