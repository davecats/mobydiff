[case]
name = generic
; one case file serves this run AND the template mint (run_blasius.sh):
; same grid, same blocks, same rank count
file = blasius.case.h5

; Quasi-2D laminar zero-pressure-gradient flat-plate boundary layer, the
; precursor of the turbulent-BL case. Lengths are nondimensionalized with
; the INLET momentum thickness theta_in = 1, velocities with U_inf = 1, so
; [flow] re = Re_theta at the inlet. The x_min inlet carries the Blasius
; similarity profile (u AND the v entrainment component); x_max is a
; pressure-Dirichlet outlet; the top (y_max) uses the same outlet treatment
; (zero-gradient velocity + Dirichlet p) so the displacement-driven
; entrainment can leave; y_min is the no-slip plate.
;   Re_theta,in = 100  ->  virtual origin x_v = Re_theta/beta^2 = 226.7,
;   delta99_in ~ 7.5, Re_theta at the outlet (x = 400) ~ 166 (still well
;   below the ~200 Tollmien-Schlichting threshold: steady laminar).
; Verify with compare_blasius.py <last snapshot>.

[grid]
nx = 384
ny = 160
nz = 4
lx = 400.0
ly = 100.0
lz = 4.0

[grid.x]
distribution = uniform
[grid.y]
; one-sided natural stretching: dy_wall ~ 0.18 theta, 31 points inside the
; inlet delta99, 3.8% max growth
distribution = natural
one_sided = true
stretch = 40.0
dyw_plus = 1.0
[grid.z]
distribution = uniform

[ibm]
enabled = false

[flow]
re = 100.0
initial_u = 1.0

[time]
dt = 1.0e-2
nsteps = 4000
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 0.5

[pressure]
niter = 12
sor = 0.8
; Plain damped Jacobi. The B0-era note that Chebyshev pumps a 2-dx pressure
; mode here is OBSOLETE on main: Chebyshev-Jacobi at niter 12 is stable to
; t = 2000 at dt 0.5 and lands on the converged-projection answer (README,
; the four-projection table; numerics review F3 retraction 2026-09-27).
; Jacobi is kept as the documented gate configuration.

[boundary]
periodic_x = false
periodic_y = false
periodic_z = true
x_min_patch = inlet
x_min_u_value = 1.0
x_min_u_profile = blasius
x_min_v_value = 1.0
x_min_v_profile = blasius
blasius_theta = 1.0
x_max_patch = outlet
y_min_patch = wall
y_max_patch = outlet

[restart]
; the Blasius similarity field (make_blasius_ic.py; mint the template with
; template.ini first) -- the run then only has to hold the solution
file = IC_blasius.h5

[output]
field_interval = 2000
field_prefix = blasius2d
