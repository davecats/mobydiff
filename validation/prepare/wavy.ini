; P0 gate 1 (docs/prepare_solve_strategy.md): analytic wavy-wall channel,
; single-level blocks + [rans] geometry. moby_prepare writes the case file
; from THIS ini; the solve twin (generated by run_gates.sh) adds
; [ibm] coeff_file and must be bit-exact vs the inline analytic run.
; Cold start, 1 step -- fields + the ransgeom dump carry the whole init.

[grid]
nx = 64
ny = 64
nz = 16
lx = 1.0
ly = 1.0
lz = 0.25

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8

[flow]
re = 100.0
forcing_x = 1.0

[time]
dt = 1.0e-4
nsteps = 1

[pressure]
niter = 3
sor = 0.8

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[ibm]
enabled = true

[rans]
dump_geometry = true

[output]
field_interval = 0
field_prefix = wavy

[mpi]
dims = 1 1 1
