; P0 gate 3: solid-block removal through the case file. The Phase-2
; wavychannel geometry (200^3, nb = 4) buries blocks under the wave crests;
; moby_prepare writes block_active + the compacted blocks table +
; coef_blocks, and the solve twin must be bit-exact vs the inline
; analytic-removal run.

[grid]
nx = 200
ny = 200
nz = 200
lx = 1.0
ly = 1.0
lz = 1.0

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 4
remove_solid = true

[flow]
re = 100.0
forcing_x = 1.0

[time]
dt = 1.0e-4
nsteps = 5
cflmax = 0.0
pecletmax = 0.5
dtmax = 1.0e-4

[pressure]
niter = 3

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[ibm]
enabled = true

[output]
field_interval = 0
field_prefix = wavys

[mpi]
dims = 1 1 1
