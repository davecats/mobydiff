; P0 gate 4 (2026-10-06): geometry-driven refinement of an EGG-CARTON wall.
; The classification must see the configured wall, not the default wavy one
; (the defect fixed 2026-10-06: classify_* ran before set_ibm_geometry and
; reset the geometry themselves). Checked against check_eggclass.py, an
; independent transcription of the touch rule on the level-0 lattice, and
; against the default-wall twin (its masks must DIFFER).

[grid]
nx = 64
ny = 64
nz = 16
lx = 1.0
ly = 1.0
lz = 0.25

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8
refine_body = true
refine_levels = 1

[flow]
re = 100.0
forcing_x = 1.0

[time]
dt = 1.0e-4
nsteps = 1

[pressure]
niter = 3
sor = 0.8

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[output]
field_interval = 0
field_prefix = eggc

[mpi]
dims = 1 1 1
[ibm]
enabled = true
wall_shape = eggcarton
amp_x = 0.15
wall_offset = 0.15
n_wave_x = 2
n_wave_z = 1
phase_x = 1.5707963267948966
phase_z = 1.5707963267948966
