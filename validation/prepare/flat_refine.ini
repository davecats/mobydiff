; P1 gate 2: the flat STL case under refine_body (2 levels) -- per-level
; STL touch/buried masks + multi-level coef/dwall tiles. Reference: the
; committed mobygeom validation/rans_geometry/ibm_coeff_blocks_l2.h5.

[grid]
nx = 64
ny = 80
nz = 64
lx = 12.566370614359172
ly = 2.5
lz = 6.283185307179586

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8
refine_body = true
refine_levels = 1

[flow]
re = 180.0
forcing_x = 1.0

[time]
dt = 1.0e-5
nsteps = 1

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[ibm]
enabled = true
stl_file = ../channel_interface/les_ibm/wall_lo.stl ../channel_interface/les_ibm/wall_hi.stl

[rans]
dump_geometry = true

[output]
field_interval = 0
field_prefix = flatr

[mpi]
dims = 1 1 1
