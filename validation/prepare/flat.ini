; P1 gate 1: STL geometry through moby_prepare -- the les_ibm plane-wall
; channel (committed wall_lo/wall_hi STLs, walls mid-cell at y = 0.259375 /
; 2.259375), single level, nb = 8. Reference: the committed mobygeom
; block-table file validation/rans_geometry/ibm_coeff_blocks_l1.h5
; (blocks/masks identical; coef/dwall to the bisection tolerance).

[grid]
nx = 64
ny = 80
nz = 64
lx = 12.566370614359172
ly = 2.5
lz = 6.283185307179586

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8

[flow]
re = 180.0
forcing_x = 1.0

[time]
dt = 1.0e-5
nsteps = 1

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[ibm]
enabled = true
stl_file = ../channel_interface/les_ibm/wall_lo.stl
stl_file = ../channel_interface/les_ibm/wall_hi.stl

[rans]
dump_geometry = true

[output]
field_interval = 0
field_prefix = flat

[mpi]
dims = 1 1 1
