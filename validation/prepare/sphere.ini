; P1 gate 3: STL sphere (r = 0.2 at the domain centre), all-periodic 64^3,
; refine_body 2 levels -- curved surface, multi-level masks, buried leaves
; inside the sphere. Reference: mobygeom block-table on the same STL
; (run_gates_stl.sh generates both; needs the ibmc venv).

[grid]
nx = 64
ny = 64
nz = 64
lx = 1.0
ly = 1.0
lz = 1.0

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8
refine_body = true
refine_levels = 1

[flow]
re = 100.0
forcing_x = 1.0

[time]
dt = 1.0e-4
nsteps = 1

[pressure]
niter = 3
sor = 0.8

[boundary]
periodic_x = true
periodic_y = true
periodic_z = true

[ibm]
enabled = true
stl_file = sphere.stl

[rans]
dump_geometry = false

[output]
field_interval = 0
field_prefix = sphere

[mpi]
dims = 1 1 1
