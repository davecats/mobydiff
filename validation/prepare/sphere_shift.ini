; P1 gate 4: the same sphere centred at x = 0 -- STRADDLING the x-periodic
; boundary. Shift-invariance self-gate (shift_check.py): its masks/blocks
; must be the x-shifted copy of the centred sphere's, and matching leaves'
; coef/dwall tiles equal to round-off. Gates the minimum-image logic with
; no external tolerance.

[grid]
nx = 64
ny = 64
nz = 64
lx = 1.0
ly = 1.0
lz = 1.0

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8
refine_body = true
refine_levels = 1

[flow]
re = 100.0
forcing_x = 1.0

[time]
dt = 1.0e-4
nsteps = 1

[pressure]
niter = 3
sor = 0.8

[boundary]
periodic_x = true
periodic_y = true
periodic_z = true

[ibm]
enabled = true
stl_file = sphere_shift.stl

[rans]
dump_geometry = false

[output]
field_interval = 0
field_prefix = spheres

[mpi]
dims = 1 1 1
