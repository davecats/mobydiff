; RANS T1 gate 2: y_eff vs the analytic wavy-wall surface on a wavychannel
; section (the analytic IBM path: single bottom wall, amp 2.5e-2, one wave,
; offset 1e-2). Cold start, 1 step -- only the init-time geometry matters.

[grid]
nx = 64
ny = 64
nz = 16
lx = 1.0
ly = 1.0
lz = 0.25

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8

[flow]
re = 100.0
forcing_x = 1.0

[time]
dt = 1.0e-4
nsteps = 1

[pressure]
niter = 3
sor = 0.8

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[ibm]
enabled = true

[rans]
dump_geometry = true

[output]
field_interval = 0
field_prefix = wavy

[mpi]
dims = 1 1 1
