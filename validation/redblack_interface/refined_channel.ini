[case]
name = channel

; Red-black SOR across a 2:1 interface (R1). tutorials/min_channel retiled for
; a gate: both wall bands refined to level 1, so every block row next to a wall
; carries a coarse-fine interface, and the flow is real (phi /= 0 at the
; interface) -- which is exactly what the uniform-flow gate cannot test.
;
; solver = redblack with sor = 1.5 (over-relaxation; the Jacobi damping 0.8 is
; not the right setting for SOR) and niter = 3, the setting red-black reaches
; Jacobi-niter-6 quality at.

[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.1
small_noise_amplitude = 0.01
stats_sample_interval = 0
stats_write_interval = 0
stats_file = rb_stats.h5
runtime_file = rb_runtime.txt

[grid]
nx = 128
ny = 64
nz = 8
lx = 12.566370614359172
ly = 2.0
lz = 0.39269908169872414

[grid.x]
distribution = uniform

[grid.y]
distribution = natural
stretch = 16
natural_dyw_plus = 0.5

[grid.z]
distribution = uniform

[blocks]
nb = 8
refine = -1.0 13.6 -1.0 0.598617012688 -1.0 7.3
refine = -1.0 13.6 1.401382987312 3.0 -1.0 7.3
refine_levels = 1

[flow]
re = 180.0
forcing_x = 1.0

[time]
nsteps = 20
dt = 1.0e-5
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 3.125e-4

[pressure]
niter = 3
sor = 1.5
solver = redblack

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[output]
field_interval = 20
field_prefix = gate
