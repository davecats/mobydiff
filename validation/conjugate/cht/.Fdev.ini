[case]
name = channel

; ============================================================================
; CONJUGATE HEAT TRANSFER in a turbulent channel -- the physics validation the
; C1-C3 gate suite does not provide. Every conjugate gate so far is
; manufactured, analytic or a self-consistency identity; this is the first
; case where the scheme has to reproduce a TURBULENCE result.
;
; SETUP (Re_tau = 180, Pr = 0.71, the most-tabulated thermal-channel point):
;   * fluid gap EXACTLY 2.0 (y in [0.6, 2.6]) with solid slabs d+ = 108 on
;     both sides, so the domain is y in [0, 3.2]. The thickness is SIZED FROM
;     THE MEASUREMENT, not guessed: the first campaign (d+ = 180) showed the
;     interface variance decaying to 0.3-1 % of its interface value by
;     d+ = 108 and to 1.6e-7 at d+ = 180, so the deepest 70 wall units were
;     buying nothing and their cells are better spent on x-z resolution.
;     (Flageul's wall is d+ = 149 with a Neumann outer face; their figure 12
;     has 1e-3 of the fluid-side variance left at y+ = -77.);
;   * the interface is GRID-ALIGNED -- it sits on a cell FACE, so the two
;     straddling cell centres are symmetric about it and the level-set weight
;     is w = 1/2 to the last bit. That is deliberate (strategy doc Section 0):
;     there the cut-face coefficient is the textbook two-resistance harmonic
;     mean and is EXACT, so anything this case measures is the conjugate
;     PHYSICS and not the immersed-boundary approximation;
;   * uniform y at dy+ = 1.5 (first cell centre at y+ = 0.75), dx+ = 14.1,
;     dz+ = 5.1 in a 4pi x 2pi box -- COMPARABLE TO FLAGEUL's 14.9 and 5.0,
;     which is the point of this resolution: their paper warns that "the
;     accurate resolution of the scalar evolution equation is very demanding
;     in terms of grid spacing", and the first campaign at dx+ = 17.7,
;     dz+ = 8.8 came out 37 % high in the temperature VARIANCE (at every
;     boundary condition, so not an interface error) while its mean profile
;     and its wall/peak ratio were right;
;   * KASAGI SOURCE at Re_tau = 149 -- the LIKE-FOR-LIKE case. This replaces
;     the uniform source of cht180_bulk.ini by beta*u_x, the fully-developed
;     channel source of Kasagi, Tomita & Kuroda (1992), which is the source
;     Flageul et al. use. Writing T = beta x + theta with theta homogeneous in
;     x turns u.grad T into beta u + u.grad theta, so the extra term is
;     proportional to the INSTANTANEOUS streamwise velocity. The steady mean
;     balance is then dJ/dy = beta <u>, i.e. the flux follows the CUMULATIVE
;     FLOW RATE rather than falling linearly -- exactly their flux profile,
;     not an approximation to it.
;     re is 149, not 180, so the Reynolds number matches theirs as well: the
;     two structural differences behind the residual ~20 % peak deficit are
;     both removed in this case.
;     `source` is scaled so that theta_tau = J_wall = source*int(u dy) ~ 1;
;     the scalar problem is LINEAR, so that choice is pure conditioning.
;
;   * (superseded) BULK HEATING: a uniform volumetric source S = 1 in the FLUID (none in
;     the solid) with BOTH outer solid faces held at theta = 0. The steady
;     mean balance is dJ/dy = S, so the wall-normal flux falls LINEARLY to
;     zero at the centreline -- the same structure as Flageul's case, whose
;     source is Kasagi's f_T u_x. The two differ only in the source's shape:
;     theirs follows u(y), ours is uniform, which is a <= 7 % difference in
;     the flux profile and 2-4 % in the near-wall comparison region, against
;     the 100 % difference at the centreline that a CONSTANT flux gives.
;
;     Two things this buys that the antisymmetric case could not:
;       - J_wall = S h EXACTLY, independent of kappa_s, so theta_tau is
;         identical for all six scalars by construction (= 1 here);
;       - the solid mean is then known in closed form, theta_i = J R_s, so
;         the seed is EXACT and there is no slow solid relaxation to wait out
;         or re-seed. That was the hardest practical problem in the
;         antisymmetric campaigns.
;
; THE SWEEP. Six scalars ride ONE velocity field, so every comparison between
; them is at the SAME turbulence realisation -- no sampling difference. The
; conjugate response of a wall to interface temperature fluctuations is
; governed by its thermal EFFUSIVITY ratio
;     K = sqrt(k_s rho_s c_s / (k_f rho_f c_f)) = sqrt(kappa_s C_s)
; (the semi-infinite-solid surface response to a harmonic flux depends on
; sqrt(k rho c) alone), and the literature's ideal limits are K -> infinity
; (isothermal wall, theta'_wall = 0) and K -> 0 (isoflux wall, theta'_wall
; maximal). The six are chosen so that
;   (a) k1/k2/k3 hold kappa_s = 1 and sweep C_s: the MEAN field is then
;       IDENTICAL for all three (capacity is irrelevant at steady state --
;       C1 gated that to 1e-13), so K alone varies. That is the clean
;       fluctuation-only sweep;
;   (b) a1/a2/a3 hold alpha_s = kappa_s/C_s = 1 and sweep K = kappa_s = C_s,
;       which changes the mean solid resistance too;
;   (c) k2 and a2 have the SAME K = 10 with different (kappa_s, C_s) and
;       different alpha_s, as do k3 and a3 at K = 100. Their normalised
;       interface fluctuations must AGREE if the effusivity scaling holds --
;       a physics prediction the implementation cannot fake.
; alpha_s <= 1 = alpha_f throughout, so the explicit limiter costs nothing:
; the solid never binds the time step.
;
;   scalar   kappa_s   C_s      K = sqrt(kappa_s C_s)   alpha_s
;   k1        1        1          1                      1
;   k2        1        100       10                      0.01
;   k3        1        10000    100                      1e-4
;   a1        0.1      0.1        0.1                    1
;   a2       10       10         10                      1
;   a3      100      100        100                      1
;
; Placeholders substituted by run_cht.sh: cht149_flageul.h5 Fdev 80000 80000
; IC_flageul.h5 0 0 x
; ============================================================================

[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.0
small_noise_amplitude = 0.0
; velocity statistics: the channel must be shown to BE a Re_tau 180 DNS
; before its thermal statistics mean anything.
stats_sample_interval = 0
stats_write_interval = 0
stats_file = Fdev_vel.h5
runtime_file = cht_runtime.txt

[grid]
nx = 224
ny = 224
nz = 224
lx = 12.566370614359172
ly = 4.0
lz = 6.283185307179586

[grid.x]
distribution = uniform
[grid.y]
; The y line is READ FROM A FILE (make_ynodes.py): no analytic distribution
; clusters at INTERIOR points, and this case needs the two fluid/solid
; interfaces resolved AND landing exactly on cell faces.
;   solid 53 + fluid 118 + solid 53 = 224 cells
;   dy+ = 0.490 at the walls -> 4.87 at the centreline (Flageul's 0.49 / 4.8)
nodes_file = ynodes_f149.dat

[grid.z]
distribution = uniform

[blocks]
; nb is the single-level BLOCK SIZE, not refinement: this case sets no
; refine/refine_body/refine_levels, so it has 240 leaves at level 0 and ZERO
; 2:1 interfaces. 32 rather than the default is a measured decomposition
; choice (4.3x cheaper projection exchange, identical physics), and nb must be
; set at all because a prepared case file's block table cannot depend on the
; rank count.
nb = 32
; LOAD-BEARING for a conjugate run and checked at init: buried blocks carry
; the solid temperature field.
remove_solid = false
keep_buried = true

[flow]
re = 149.0
forcing_x = 1.0

[ibm]
enabled = true
coeff_file = cht149_flageul.h5

[scalar]
count = 6
stats_layout = profile
stats_sample_interval = 0
stats_write_interval = 0
stats_file = x

[scalar.1]
name = k1
pr = 0.71
ibm_wall = conjugate
solid_k = 1.0
solid_rhocp = 1.0
source = 0.064631
source_type = velocity
y_min_type = neumann
y_min_value = 105.790000
y_max_type = neumann
y_max_value = -105.790000

[scalar.2]
name = k2
pr = 0.71
ibm_wall = conjugate
solid_k = 1.0
solid_rhocp = 100.0
source = 0.064631
source_type = velocity
y_min_type = neumann
y_min_value = 105.790000
y_max_type = neumann
y_max_value = -105.790000

[scalar.3]
name = k3
pr = 0.71
ibm_wall = conjugate
solid_k = 1.0
solid_rhocp = 10000.0
source = 0.064631
source_type = velocity
y_min_type = neumann
y_min_value = 105.790000
y_max_type = neumann
y_max_value = -105.790000

[scalar.4]
name = a1
pr = 0.71
ibm_wall = conjugate
solid_k = 0.1
solid_rhocp = 0.1
source = 0.064631
source_type = velocity
y_min_type = neumann
y_min_value = 1057.900000
y_max_type = neumann
y_max_value = -1057.900000

[scalar.5]
name = a2
pr = 0.71
ibm_wall = conjugate
solid_k = 10.0
solid_rhocp = 10.0
source = 0.064631
source_type = velocity
y_min_type = neumann
y_min_value = 10.579000
y_max_type = neumann
y_max_value = -10.579000

[scalar.6]
name = a3
pr = 0.71
ibm_wall = conjugate
solid_k = 100.0
solid_rhocp = 100.0
source = 0.064631
source_type = velocity
y_min_type = neumann
y_min_value = 1.057900
y_max_type = neumann
y_max_value = -1.057900

[time]
dt = 1.0e-4
nsteps = 80000
t_final = 0.0
cflmax = 0.8
pecletmax = 0.4
dtmax = 2.0e-3

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[output]
field_interval = 80000
field_prefix = Fdev

[restart]
file = IC_flageul.h5
