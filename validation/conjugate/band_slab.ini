[case]
name = generic

; F2 gate: the 1D THREE-MATERIAL SLAB -- the statement that the solid's
; second material band (`[scalar.N] solid_thickness`) is where it claims to
; be, and that its face coefficient is the right series resistance.
;
; Same geometry as the C1 two-material slab (slab.ini): a flat solid slab
; fills y < y_wall, written as an ASCII STL so the interface plane is exact in
; float64 and moby_prepare's FILE path is the one exercised. No flow: the
; velocity stays 0 to the last bit and the problem is pure conduction.
;
; What F2 adds is that the SOLID is now two materials, split by the iso-
; surface phi = -solid_thickness -- here, because phi is the distance to the
; plane, simply y = y_wall - d:
;
;   y < y_wall - d   OUTER band, kappa_o = @OUTERK@, no source
;   y_wall - d < y < y_wall   SHELL, kappa_s = @KAPPA@
;   y > y_wall       fluid, kappa = 1
;
; with T(0) = 0 and T(L) = 1 on the two y faces. The steady solution is
; piecewise LINEAR in three layers,
;
;   R = (y_wall - d)/kappa_o + d/kappa_s + (L - y_wall),   q = 1/R
;
; and a piecewise-linear field is an exact FIXED POINT of the discrete
; operator only if BOTH internal faces carry the true series resistance --
; the body-surface one (C1's level-set weight on phi) and the band one (the
; same weight on the shifted level set psi = phi + d). Nothing else in this
; gate can absorb an error in where the band boundary sits, which is the
; whole point: run_gates_pipe.sh sweeps that boundary through a full cell.
;
; kappa_o = 0 is the INSULATOR the pipe campaign uses. The series resistance
; is then infinite: the shell and the fluid sit at 1, the outer band is inert
; at solid_init, and the y = 0 Dirichlet face is disconnected from everything.
;
; Placeholders substituted by run_gates_pipe.sh: @STL@ @CASE@ @KAPPA@ @CAP@
; @DEPTH@ @OUTERK@ @OUTERC@ @INIT@ @PREFIX@ @NSTEPS@ @WRITE@

[grid]
nx = 4
ny = 16
nz = 4
lx = 0.25
ly = 1.0
lz = 0.25

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 4
remove_solid = false

[ibm]
enabled = true
stl_file = @STL@
coeff_file = @CASE@

[flow]
re = 1.0

[scalar]
count = 1

[scalar.1]
name = theta
pr = 1.0
initial = 0.0
ibm_wall = conjugate
solid_k = @KAPPA@
solid_rhocp = @CAP@
solid_init = @INIT@
solid_thickness = @DEPTH@
solid_outer_k = @OUTERK@
solid_outer_rhocp = @OUTERC@
y_min_type = dirichlet
y_min_value = 0.0
y_max_type = dirichlet
y_max_value = 1.0

[time]
dt = 1.0e-3
nsteps = @NSTEPS@
t_final = 0.0
cflmax = 0.0
pecletmax = 0.4
dtmax = 1.0e-2

[pressure]
niter = 2
sor = 0.8

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[output]
field_interval = @WRITE@
field_prefix = @PREFIX@
