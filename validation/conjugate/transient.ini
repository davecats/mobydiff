[case]
name = generic

; C3 gate 1: the TRANSIENT two-material slab -- the gate the
; fluid-fraction-weighted capacity exists for.
;
; The geometry is C1's slab (an ASCII STL through moby_prepare, so the
; interface plane is exact in float64), but both ends are held at ZERO, which
; makes the problem an eigenvalue problem: its lowest mode decays as
; exp(-mu t) with mu fixed by
;     kappa_s k_s cot(k_s y_w) + k_f cot(k_f (L - y_w)) = 0
; (check_transient.py). The run is seeded with that mode and compared with it
; at a later time -- field, interface flux and the DECAY RATE itself.
;
; Why this and not the C1 steady slab: mu is a global functional of the
; capacity distribution, so a cut cell that carries one material's whole heat
; capacity is an O(1) error on an O(h) band and shows up as a FIRST-order
; error in everything above. The C1 steady state cannot see it at all -- the
; capacity divides an rhs that vanishes.
;
; THE TIME STEP IS FIXED (pecletmax = 0, an explicit dt ~ h^2), NOT taken from
; the limiter. The control leg of this gate runs the archived C2 binary, whose
; cut-cell rate convention differs, and a gate that let dt move between the
; two legs would be comparing two things at once.
;
; Placeholders substituted by run_gates_c3.sh: @STL@ @CASE@ @NY@ @KAPPA@
; @CAP@ @PREFIX@ @NSTEPS@ @WRITE@ @DT@ @HEAT@ @HEATFILE@

[grid]
nx = 4
ny = @NY@
nz = 4
lx = 0.25
ly = 1.0
lz = 0.25

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 4
remove_solid = false

[ibm]
enabled = true
stl_file = @STL@
coeff_file = @CASE@

[flow]
re = 1.0

[scalar]
count = 1
heat_interval = @HEAT@
heat_file = @HEATFILE@

[scalar.1]
name = theta
pr = 1.0
initial = 0.0
ibm_wall = conjugate
solid_k = @KAPPA@
solid_rhocp = @CAP@
solid_init = 0.0
y_min_type = dirichlet
y_min_value = 0.0
y_max_type = dirichlet
y_max_value = 0.0

[time]
dt = @DT@
nsteps = @NSTEPS@
t_final = 0.0
cflmax = 0.0
pecletmax = 0.0
dtmax = @DT@

[pressure]
niter = 2
sor = 0.8

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[output]
field_interval = @WRITE@
field_prefix = @PREFIX@
