[case]
name = generic

; F1 gate 1: [scalar.N] source_dir against a CLOSED FORM, all three branches.
;
; A triply-periodic cube carrying the uniform velocity (u, v, w) = (1, 2, 3).
; A uniform field is an exact steady solution -- convection, diffusion and the
; projection all vanish identically -- and a uniform scalar has no gradient,
; so the Kasagi source integrates exactly:
;
;     theta(t) = source * u_@SDIR@ * t,   i.e. 1*t, 2*t or 3*t.
;
; The three directions therefore give three DIFFERENT exact answers, which is
; what makes this a test of the direction and not just of the magnitude: a
; branch reading the wrong component lands on another direction's number.
;
; [ibm] enabled = false is LOAD-BEARING, not boilerplate: dns%ibm_enabled
; defaults to .true. (init.f90), so an ini with no [ibm] section silently runs
; the default analytic WAVY WALL, which is a y wall modulated sinusoidally in
; x. It destroys the uniform state this gate is built on. It cost an hour.
;
; Placeholders from run_gates_pipe.sh: @SDIR@ @PREFIX@ @STEPS@

[grid]
nx = 16
ny = 16
nz = 16
lx = 6.283185307179586
ly = 6.283185307179586
lz = 6.283185307179586

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[ibm]
enabled = false

[flow]
re = 100.0
initial_u = 1.0
initial_v = 2.0
initial_w = 3.0

[scalar]
count = 1

[scalar.1]
name = theta
pr = 0.71
initial = 0.0
source = 1.0
source_type = velocity
source_dir = @SDIR@

[time]
dt = 2.0e-3
nsteps = @STEPS@
t_final = 0.0
cflmax = 0.0
pecletmax = 0.4
dtmax = 2.0e-3

[pressure]
niter = 40
sor = 0.8

[boundary]
periodic_x = true
periodic_y = true
periodic_z = true

[output]
field_interval = @STEPS@
field_prefix = @PREFIX@
