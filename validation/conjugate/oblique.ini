[case]
name = generic

; C2 gate 1: the OBLIQUE PLANE interface.
;
; A solid half-space below a plane tilted by theta from the x axis (an ASCII
; STL through moby_prepare -- the FILE geometry path), invariant in z, so
; every cut face carries a direction cosine a < 1 and a tangential gradient:
; exactly the configuration the C1 baseline's dropped term is about, and the
; one no C1 gate could exercise (the slab is grid-aligned, so s_t = 0 there
; by construction).
;
; The manufactured solution is
;     T = q_n xi/k(side) + A (t.x),      xi = n.(x - x0)
; with |grad_t T|/|d_n T| = A/q_n = r on the fluid side -- the CONTROLLED
; RATIO. It is an exact conjugate solution for any kappa_s.
;
; BOUNDARY CONDITIONS. z is periodic (the geometry and the solution are both
; z-invariant). x and y carry the exact CONSTANT Neumann value @GX@ / @GY@ of
; the manufactured field. That is consistent on every face -- cut faces
; included -- only when q_n = 0, because grad T then has no jump; this ini is
; therefore solved only in the r = infinity case, and the finite-r ratios are
; measured face by face on the analytic field (check_oblique.py flux), which
; needs no boundary condition at all. Pure Neumann fixes T up to a constant,
; which the checker removes.
;
; No flow: no forcing, zero initial velocity, so this is pure conduction.
;
; Placeholders substituted by run_gates_c2.sh: @STL@ @CASE@ @KAPPA@ @CAP@
; @PREFIX@ @NSTEPS@ @WRITE@ @NX@ @NY@ @NZ@ @LX@ @LY@ @LZ@ @NB@ @GX@ @GY@
; @DT@ @IND@ @TANG@

[grid]
nx = @NX@
ny = @NY@
nz = @NZ@
lx = @LX@
ly = @LY@
lz = @LZ@

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = @NB@
remove_solid = false

[ibm]
enabled = true
stl_file = @STL@
coeff_file = @CASE@

[flow]
re = 1.0

[scalar]
count = 1
indicator_interval = @IND@

[scalar.1]
name = theta
pr = 1.0
initial = 0.0
ibm_wall = conjugate
solid_k = @KAPPA@
solid_rhocp = @CAP@
solid_init = 0.0
tangential_correction = @TANG@
x_min_type = neumann
x_min_value = @GX@
x_max_type = neumann
x_max_value = @GX@
y_min_type = neumann
y_min_value = @GY@
y_max_type = neumann
y_max_value = @GY@

[time]
dt = @DT@
nsteps = @NSTEPS@
t_final = 0.0
cflmax = 0.0
pecletmax = 0.4
dtmax = @DT@

[pressure]
niter = 2
sor = 0.8

[boundary]
periodic_x = false
periodic_y = false
periodic_z = true

[output]
field_interval = @WRITE@
field_prefix = @PREFIX@
