[case]
name = generic

; C1 gates 3 + 4: CONSERVATION and DETERMINISM on the ANALYTIC geometry path.
;
; The analytic wavy bottom wall of ibm.f90 (y < 0.0125 (1 + sin(2 pi x/lx))
; + 0.01, i.e. 0.010 .. 0.035 tall over ly = 0.25 / ny = 32, a 1.3 .. 4.5
; cell staircase) is used here precisely because it is OBLIQUE: every cut
; face carries a direction cosine a < 1, so the level-set weight, the
; grazing-arm guard and the masked convection are all exercised on a surface
; that is nowhere grid-aligned. It is also the second geometry path --
; fill_body_distance_analytic rather than the case file's dwall_blocks tiles.
;
; CONSERVATION: the box is insulated. x and z are periodic, both y walls are
; Neumann 0 (the PATCH_WALL default), there is no source and no penalization
; anywhere, so the ONLY thing that can change sum(C theta dV) is a bug. The
; initial condition is a step -- fluid 1, solid 0 -- which needs no seeding
; tool and puts the entire initial content of the invariant across the
; interface the scheme has to transport it through. The flow is ON (forcing
; in x), so the masked convective flux is part of the statement: the mask is
; symmetric across a face, the divergence form telescopes, and the skew term
; is off, so the invariant is exact.
;
; kappa_s = 5, C_s = 2 (alpha_s/alpha_f = 2.5): a real contrast in BOTH
; material properties, so neither a kappa nor a C bug can hide.

[grid]
nx = 32
ny = 32
nz = 8
lx = 1.0
ly = 0.25
lz = 0.25

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8
; LOAD-BEARING and checked at init: a buried block carries the solid
; temperature field, so removing it would delete part of the solution domain.
remove_solid = false

[ibm]
enabled = true

[flow]
re = 100.0
forcing_x = 1.0

[scalar]
count = 1

[scalar.1]
name = theta
pr = 0.71
ibm_wall = conjugate
solid_k = 5.0
solid_rhocp = 2.0
initial = 1.0
solid_init = 0.0

[time]
dt = 2.0e-4
nsteps = 200
t_final = 0.0
cflmax = 0.0
pecletmax = 0.0
dtmax = 2.0e-4

[pressure]
niter = 40
sor = 0.8

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[output]
field_interval = 100
field_prefix = wavy
