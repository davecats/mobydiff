[case]
name = generic

; F1 gate 2: source_dir = x and source_dir = z on a SPATIALLY VARYING field.
;
; A laminar channel between y walls, driven along the x-z DIAGONAL by equal
; body forces. The flow is then u(y) = w(y) -- both cell-centred in y, both
; uniform in x and z -- so the x and the z Kasagi source are the same number
; cell by cell, and the two runs must agree BIT FOR BIT. That tests the z
; branch's staggered pair and its averaging against the x branch the whole
; suite already pins, on a field with real structure rather than a constant.
;
; Why not a rotation of a 3D field: the one x<->z-symmetric initial condition
; on offer, `tgv3d`, is a pure GRADIENT (u = grad[-cos(kx)cos(ky)cos(kz)/k]),
; so the projection annihilates it and the comparison is left measuring the
; projection residue. Measured: velocity 4e-8 instead of O(1).
;
; [ibm] enabled = false: see kasagi_uniform.ini -- the default is .true.
;
; Placeholders from run_gates_pipe.sh: @SDIR@ @PREFIX@ @STEPS@

[grid]
nx = 8
ny = 32
nz = 8
lx = 2.0
ly = 2.0
lz = 2.0

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[ibm]
enabled = false

[flow]
re = 100.0
forcing_x = 1.0
forcing_z = 1.0

[scalar]
count = 1

[scalar.1]
name = theta
pr = 0.71
initial = 0.0
source = 1.0
source_type = velocity
source_dir = @SDIR@
y_min_type = dirichlet
y_min_value = 0.0
y_max_type = dirichlet
y_max_value = 0.0

[time]
dt = 1.0e-3
nsteps = @STEPS@
t_final = 0.0
cflmax = 0.0
pecletmax = 0.4
dtmax = 1.0e-3

[pressure]
niter = 40
sor = 0.8

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true
y_min_patch = wall
y_max_patch = wall

[output]
field_interval = @STEPS@
field_prefix = @PREFIX@
