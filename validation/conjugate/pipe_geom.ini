[case]
name = generic

; F5 gate: the ANNULAR pipe body through moby_prepare.
;
; The immersed body is EVERYTHING outside r_inner -- the fluid is the hole --
; so make_geometry_stl.py's `annulus` closes the solid with padding whose only
; job is to stay out of the way. check_annulus.py then rebuilds phi from the
; case file (dwall_blocks for the magnitude, coef_p_blocks for the sign) and
; compares it with the analytic distance to the FACETED polygon, which is the
; actual geometry; it also checks the property the pipe campaign's F2 needs
; and the handout says to verify rather than assume -- that inside the domain
; the pipe wall, not the padding, is the nearest surface everywhere.
;
; No solver step is run from this ini: it is a prepare-only case.
;
; Placeholders from run_gates_pipe.sh: STL CASE N NZ L LZ NB (written
; without their @ markers here, so the gate script can assert that no
; placeholder survives substitution by grepping the generated ini).

[grid]
nx = @N@
ny = @N@
nz = @NZ@
lx = @L@
ly = @L@
lz = @LZ@

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = @NB@
remove_solid = false

[ibm]
enabled = true
stl_file = @STL@
coeff_file = @CASE@

[flow]
re = 1.0

[scalar]
count = 1

[scalar.1]
name = theta
pr = 1.0
initial = 0.0
ibm_wall = conjugate
solid_k = 2.0
solid_rhocp = 1.0

[time]
dt = 1.0e-5
nsteps = 1
t_final = 0.0
cflmax = 0.0
pecletmax = 0.4
dtmax = 1.0e-5

[pressure]
niter = 2
sor = 0.8

[boundary]
periodic_x = false
periodic_y = false
periodic_z = true

[output]
field_interval = 0
field_prefix = pipe_geom
