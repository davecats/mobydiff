[case]
name = generic

; C1 gate 1: the 1D TWO-MATERIAL SLAB -- the sharpest statement the conjugate
; baseline can make, and the one that validates the single genuinely new
; ingredient, the level-set weight w.
;
; A flat solid slab fills y < y_wall (an ASCII STL through moby_prepare, so
; the interface plane is exact in float64 and the FILE geometry path is the
; one exercised); the fluid fills y > y_wall. No flow anywhere: no forcing,
; zero initial velocity, so u stays 0 to the last bit and the problem is pure
; conduction through two materials in series.
;
;   T(0) = 0   (a Dirichlet domain face INSIDE the solid)
;   T(L) = 1   (a Dirichlet domain face in the fluid)
;
; The steady solution is piecewise linear with the exact series resistance
;   R = y_wall/kappa_s + (L - y_wall),      q = 1/R
;   T = q y/kappa_s      (y <= y_wall)
;   T = q [y_wall/kappa_s + (y - y_wall)]   (y >= y_wall)
; and a piecewise-linear field is an EXACT fixed point of the discrete
; operator: the flux form is exact for a linear profile in each material, the
; Dirichlet mirror ghosts are exact for a linear profile, and the cut face's
; distance-weighted harmonic mean IS the series resistance. So this is an
; equality gate, not a convergence gate -- run_gates_c1.sh sweeps the cut
; position through a full cell and kappa_s over five decades.
;
; solid_rhocp is swept WITH solid_k (alpha_s = kappa_s/C_s = 1) so the
; explicit diffusive limit is the fluid's at every contrast: the capacity is
; irrelevant at steady state (strategy doc Section 6), which the `capacity`
; group then checks directly.
;
; Placeholders substituted by run_gates_c1.sh: @STL@ @CASE@ @KAPPA@ @CAP@
; @PREFIX@ @NSTEPS@ @WRITE@

[grid]
nx = 4
ny = 16
nz = 4
lx = 0.25
ly = 1.0
lz = 0.25

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
; moby_prepare writes block-table case files, so nb is required. 4 divides
; 4 x 16 x 4. remove_solid MUST be false: a buried block carries the solid
; temperature field, and the solver rejects the case otherwise.
nb = 4
remove_solid = false

[ibm]
enabled = true
stl_file = @STL@
coeff_file = @CASE@

[flow]
re = 1.0

[scalar]
count = 1

[scalar.1]
name = theta
pr = 1.0
initial = 0.0
ibm_wall = conjugate
solid_k = @KAPPA@
solid_rhocp = @CAP@
solid_init = 0.0
y_min_type = dirichlet
y_min_value = 0.0
y_max_type = dirichlet
y_max_value = 1.0

[time]
dt = 1.0e-3
nsteps = @NSTEPS@
t_final = 0.0
cflmax = 0.0
pecletmax = 0.4
dtmax = 1.0e-2

[pressure]
niter = 2
sor = 0.8

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[output]
field_interval = @WRITE@
field_prefix = @PREFIX@
