[case]
name = channel

; C3 gate 3: the CONDUCTING CHANNEL WALL -- the conjugate scheme on the full
; production stack (WALE LES + file-based IBM + optionally 2:1 block
; refinement), on the geometry of validation/channel_interface/les_ibm.
;
; Why that geometry: its two flat walls sit MID-CELL (y = 8.3 dy = 0.259375
; and 72.3 dy = 2.259375 on a uniform dy = 0.03125 line), so every cut cell
; has a NON-TRIVIAL fluid fraction -- which is what this increment changed --
; while the interface itself stays grid-aligned, where the C1 cut-face
; coefficient is EXACT. That combination is what makes it a clean regression:
; anything the gate sees is the capacity, the diagnostic or the stack, not the
; interface scheme's own truncation.
;
; The scalar box is INSULATED (periodic x and z, Neumann 0 on both y faces,
; which lie inside the solid slabs) and starts as a step -- fluid 1, solid 0.
; The whole content of the run is then transport across the interface, and the
; discrete fluid-cell energy budget
;     d/dt sum_fluid C theta dV  =  the interface heat
; is an identity the diagnostic must satisfy at any time, with nu_t active.
;
; The coefficient file is NOT the committed ibm_coeff.h5: that one predates
; S3 and carries neither coef_p_blocks nor dwall_blocks. It is prepared here
; from the same two wall STLs (setup_chan.sh), which is also the P1b path.
;
; Placeholders substituted by run_gates_c3.sh: @CASE@ @PREFIX@ @NSTEPS@
; @WRITE@ @HEAT@ @HEATFILE@ @REFINE@ @RESTART@

[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.0
small_noise_amplitude = 0.0
stats_sample_interval = 0
stats_write_interval = 0

[grid]
nx = 64
ny = 80
nz = 64
lx = 12.566370614359172
ly = 2.5
lz = 6.283185307179586

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8
; LOAD-BEARING for a conjugate run, and checked at init: buried blocks carry
; the solid temperature field.
remove_solid = false
keep_buried = true
@REFINE@

[flow]
re = 180.0
forcing_x = 1.0

[time]
dt = 1.0e-5
t_final = 0.0
nsteps = @NSTEPS@
cflmax = 0.8
pecletmax = 0.5
dtmax = 5.0e-4

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[ibm]
enabled = true
coeff_file = @CASE@

[les]
model = wale

[scalar]
count = 1
heat_interval = @HEAT@
heat_file = @HEATFILE@

[scalar.1]
name = theta
pr = 0.71
initial = 1.0
ibm_wall = conjugate
solid_k = 5.0
solid_rhocp = 2.0
solid_init = 0.0
y_min_type = neumann
y_min_value = 0.0
y_max_type = neumann
y_max_value = 0.0

[output]
field_interval = @WRITE@
field_prefix = @PREFIX@

[mpi]
dims = 1 1 1

[restart]
file = @RESTART@
