[case]
name = generic

; S3 gates (n) + (o): the analytic wavy bottom wall with TWO scalars, one in
; each immersed-body mode.
;   theta  ibm_wall = dirichlet, ibm_value = 1 -> every SOLID cell must hold
;          exactly 1 (the penalization coefficient inside the body is
;          SOLID/Re, so mu_s underflows and the cell is the body value to the
;          last bit), while the domain walls stay adiabatic.
;   phi    ibm_wall = adiabatic -> the six p-cell faces whose staggered
;          velocity coefficient is solid carry NO convective and NO diffusive
;          flux. The mask is symmetric across a face, so the flux form still
;          telescopes and int phi dV is conserved to round-off: x and z are
;          periodic and the y walls are Neumann 0, so there is no other sink.
;
; The wall is y < 0.025/2 (1 + sin(2 pi x/lx)) + 0.01 (ibm.f90
; wavy_wall_height), i.e. 0.010 .. 0.035 tall; with ly = 0.25 over ny = 32
; that is a 1.3 .. 4.5 cell staircase, deep enough to hold interior solid
; cells at every x.

[grid]
nx = 32
ny = 32
nz = 8
lx = 1.0
ly = 0.25
lz = 0.25

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8
remove_solid = false

[ibm]
enabled = true

[flow]
re = 100.0
forcing_x = 1.0

[scalar]
count = 2

[scalar.1]
name = theta
pr = 0.71
ibm_wall = dirichlet
ibm_value = 1.0

[scalar.2]
name = phi
pr = 1.0
ibm_wall = adiabatic

[time]
dt = 2.0e-4
nsteps = 200
t_final = 0.0
cflmax = 0.0
pecletmax = 0.0
dtmax = 2.0e-4

[pressure]
niter = 40
sor = 0.8

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[output]
field_interval = 200
field_prefix = ibmwavy
