[case]
name = generic

; S1 gate (c): PURE CONDUCTION between Dirichlet walls on a STRETCHED grid.
; No flow (zero velocity, no forcing), one scalar with a constant volumetric
; source; the steady solution is the parabola
;   s(y) = s0 + (s1 - s0) y/L + Q/(2D) y (L - y),   D = 1/(Re Pr) = 1
; which the face-flux operator must reproduce at order 2 as ny is refined
; (run_gates.sh sweeps ny = 16/32/64). The source-free variant (Q = 0,
; different wall values) has a LINEAR steady solution, which the operator
; reproduces EXACTLY -- gated separately at round-off.
[grid]
nx = 4
ny = 16
nz = 4
lx = 0.25
ly = 2.0
lz = 0.25

[grid.x]
distribution = uniform
[grid.y]
distribution = tanh
stretch = 1.2
[grid.z]
distribution = uniform

[ibm]
enabled = false

[flow]
re = 1.0

[scalar]
count = 1

[scalar.1]
name = s1
pr = 1.0
initial = 0.0
source = 1.0
y_min_type = dirichlet
y_min_value = 0.0
y_max_type = dirichlet
y_max_value = 0.0

[time]
dt = 1.0e-5
t_final = 4.0
nsteps = 100000000
cflmax = 0.5
pecletmax = 0.4
dtmax = 1.0e-2

[pressure]
niter = 6
sor = 0.8

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[output]
field_interval = 0
field_prefix = conduction
