[case]
name = channel

; S5b-adjacent gate (y): the THERMAL WALL FUNCTION AT AN IMMERSED WALL.
;
; S5a validated the Kader/Jayatilleke closure on DOMAIN walls only. Its open
; item: an immersed body whose wall cells reach the LOG layer, where the
; Dirichlet penalization and the thermal wall function act on the SAME cell.
; T3's only IBM wall-function case (../rans_sst/ibm180wf.ini) sits at
; y+_k ~ 2-3, i.e. the conduction branch, where the wall diffusivity is
; exactly zero and nothing new happens.
;
; Geometry: the les_ibm plane-wall slabs (../channel_interface/les_ibm/
; wall_{lo,hi}.stl), walls mid-cell at y = 0.259375 / 2.259375, fluid gap
; EXACTLY 2.0 -> Re_tau ~ 180 with re = 180, forcing_x = 1 (u_tau = 1).
; The slabs are padded well past the domain in x/z, so a small x/z box is
; covered by the same STLs; RANS here is a 1-D problem and 8 x 8 is ample.
;
; Grid: ly = 2.5 over ny = 8 -> dy = 0.3125. Cell centres 0.15625, 0.46875,
; ... : the first FLUID centre is 0.209 from the wall (y+ ~ 37.6, the log
; branch of both wall functions, y+_T = 12.178 at Pr 0.71), and the cell
; BELOW it -- centre inside the solid, one fluid staggered face -- is the
; classified wall cell that carries the penalization at the same time.
; ../rans_sst/ibm180.ini's resolution (ny = 80, y+_1 ~ 2.8) is the resolved
; reference twin, ibmwf180_res.ini.
;
; Thermal driving: ONE body value serves both walls (ibm_value is per
; scalar, not per surface), so the S5a antisymmetric +1/-1 walls are not
; available here. Instead: isothermal walls at 0 and a constant volumetric
; source, i.e. uniformly heated fluid cooled through both walls. In steady
; state each wall carries source*(gap/2) = source, so with u_tau = 1
; theta_tau = source EXACTLY -- a closed-form target for the wall flux, and
; the solver's own runtime heat file must reproduce it (the S4
; cancellation-free body-integral form).
;
; PREPARE: the case file must carry coef_p_blocks (S3), so it is built from
; THIS ini with moby_prepare (run_gates_s5b.sh does it).

[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.0
small_noise_amplitude = 0.0
stats_sample_interval = 0
stats_write_interval = 0

[grid]
nx = 8
ny = 8
nz = 8
lx = 3.141592653589793
ly = 2.5
lz = 1.5707963267948966

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
; moby_prepare writes a block-table case file, which needs an explicit nb;
; 4 divides 8 (and the reference twin's 80) in every direction.
nb = 4
; Buried blocks must survive: the body integral and the wall-cell
; classification both read them (CLAUDE.md A2 / S3's keep_buried note).
remove_solid = false

[flow]
re = 180.0
forcing_x = 1.0

[ibm]
enabled = true
stl_file = ../channel_interface/les_ibm/wall_lo.stl
stl_file = ../channel_interface/les_ibm/wall_hi.stl

[scalar]
count = 1
stats_sample_interval = 0
stats_write_interval = 0
stats_file = ibmwf180_stats.h5
stats_layout = profile
heat_interval = 0
heat_file = ibmwf180_heat.txt

[scalar.1]
name = theta
pr = 0.71
prt = 0.85
prt_model = constant
initial = 0.0
source = 0.05
ibm_wall = dirichlet
ibm_value = 0.0

[time]
dt = 1.0e-4
t_final = 1000.0
nsteps = 40000
cflmax = 0.5
pecletmax = 0.4
dtmax = 5.0e-2

[pressure]
niter = 6
sor = 0.8

[boundary]
periodic_x = true
periodic_z = true
periodic_y = false

[turbulence]
model = rans

[rans]
model = sst
wall_treatment = wall_function
tu = 5.0
nut_ratio = 10.0

[output]
field_interval = 40000
field_prefix = ibmwf180
