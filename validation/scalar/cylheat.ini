[case]
name = airfoil

; S3 gate (s): HEATED CYLINDER at Re = 40, Pr = 0.71 -- the quantitative
; body gate. Geometry, grid and far field are ../cylinder/cyl_re40.ini
; verbatim (D = 1 at (6.0, 8.02) in a 16 x 16 x 0.25 box, uniform h = 1/32),
; so the velocity field is the A2-validated steady cylinder wake and this
; case adds only the thermal problem: an isothermal body (theta = 1) in a
; theta = 0 freestream.
;
; The Nusselt number is measured TWICE from the same snapshot:
;   * from the penalization integral Q = int coef_p (1 - theta)/Pr dV, and
;   * from the Gauss/CV border flux of (u theta - D_th grad theta) through a
;     box in the fluid around the body (the A2 cross-check method).
; In steady state the two must agree; unlike the momentum cross-check this
; one never touches the pressure, so the niter = 6 pn-drift caveat of
; ../cylinder/README.md does not apply.
;
; This ini is the moby_prepare input (it carries [ibm] stl_file and NO
; coeff_file); run_gates_s3.sh derives the solve twin from it.
;
; remove_solid = false is the A2 rule for a body-integrated diagnostic
; ([blocks] keep_buried is the refine_body branch's spelling of the same
; thing, and is set for anyone who adds refinement here): a removed buried
; core would sit outside the coefficient bookkeeping. For the THERMAL
; integral the deep-solid cells contribute exactly zero anyway -- they hold
; the body value to the last bit (gate (n)) -- but honouring the rule costs
; 4 of 4096 leaves and removes the question.

[case.airfoil]
aoa = 0.0
u_inf = 1.0
chord = 1.0
force_sample_interval = 100
runtime_file = forces_cylheat.txt

[grid]
nx = 512
ny = 512
nz = 8
lx = 16.0
ly = 16.0
lz = 0.25

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8
remove_solid = false
keep_buried = true

[ibm]
enabled = true
stl_file = ../cylinder/cylinder.stl

[flow]
re = 40.0

[scalar]
count = 1

[scalar.1]
name = theta
pr = 0.71
ibm_wall = dirichlet
ibm_value = 1.0
initial = 0.0
inlet = 0.0

[time]
dt = 1.0e-3
nsteps = 100000000
; The velocity restart is the converged steady A2 field at t = 100; the
; thermal problem starts from theta = 0 and needs ~10 t.u. to establish the
; boundary layer and flush the wake. Snapshots every 5 t.u. so the Nusselt
; number's own drift measures the convergence -- by t = 120 it has fallen to
; 0.4 % per 5 t.u. and the CV storage term to 2.7 % of the border flux, which
; is where the gate was measured.
t_final = 120.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 5.0e-3

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[output]
field_interval = 1000
field_prefix = cylheat
