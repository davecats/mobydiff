[case]
name = generic

; S1 gate (d): ADVECTION-DIFFUSION MMS. Uniform velocity in a periodic cube
; (an exact NS solution: the velocity stays constant to round-off), scalar
; seeded with s = sin(k.x), k = 2 pi (1,1,1)/L, through the restart path.
; The exact solution is
;   s(x,t) = exp(-D |k|^2 t) sin(k.(x - u t)),   D = 1/(Re Pr) = 0.01,
; so the error at fixed dt and t measures the SPATIAL order of the central
; divergence-form convection + face-flux diffusion (run_gates.sh sweeps
; n = 16/32/64). cflmax/pecletmax = 0 freezes dt, so the time error is
; identical on all three grids (and ~1e-6, far below the spatial error).
[grid]
nx = 16
ny = 16
nz = 16
lx = 6.283185307179586
ly = 6.283185307179586
lz = 6.283185307179586

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8

[ibm]
enabled = false

[flow]
re = 100.0
initial_u = 1.0
initial_v = 0.5
initial_w = 0.25

[scalar]
count = 1

[scalar.1]
name = s1
pr = 1.0

[time]
dt = 1.0e-3
nsteps = 500
t_final = 0.0
cflmax = 0.0
pecletmax = 0.0
dtmax = 1.0e-3

[pressure]
niter = 40
sor = 0.8

[boundary]
periodic_x = true
periodic_y = true
periodic_z = true

[output]
field_interval = 500
field_prefix = wave
