[case]
name = generic

; Smallest scalar case: periodic uniform box, one scalar, a few steps.
[grid]
nx = 16
ny = 16
nz = 16
lx = 1.0
ly = 1.0
lz = 1.0

[ibm]
enabled = false

[flow]
re = 100.0
initial_u = 1.0

[scalar]
count = 1

[scalar.1]
name = theta
pr = 1.0
initial = 3.0

[time]
dt = 1.0e-3
nsteps = 5
t_final = 0.0
cflmax = 0.5
pecletmax = 0.4
dtmax = 1.0e-3

[pressure]
niter = 20
sor = 0.8

[boundary]
periodic_x = true
periodic_y = true
periodic_z = true

[output]
field_interval = 5
field_prefix = smoke
