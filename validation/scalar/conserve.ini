[case]
name = generic

; S1 gate (b): GLOBAL CONSERVATION. Fully periodic box, decaying Beltrami
; flow (an exact NS solution, so the advecting field is a genuine 3D flow),
; one passive scalar seeded with a manufactured s = sin(k.x) through the
; restart path (make_scalar_ic.py). With no boundary flux, d/dt int s dV must
; be zero to round-off: the divergence-form convection is a flux form whose
; face fluxes cancel exactly between neighbours.
; Single level here -- the flux telescoping is exact only for matching faces;
; the refined variant (det.ini) measures the 2:1-interface residual instead.
[grid]
nx = 32
ny = 32
nz = 32
lx = 6.283185307179586
ly = 6.283185307179586
lz = 6.283185307179586

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8

[ibm]
enabled = false

[flow]
initial = beltrami
re = 100.0

[scalar]
count = 1

[scalar.1]
name = s1
pr = 0.71

[time]
dt = 2.0e-3
nsteps = 200
t_final = 0.0
cflmax = 0.0
pecletmax = 0.0
dtmax = 2.0e-3

[pressure]
niter = 40
sor = 0.8

[boundary]
periodic_x = true
periodic_y = true
periodic_z = true

[output]
field_interval = 200
field_prefix = conserve
