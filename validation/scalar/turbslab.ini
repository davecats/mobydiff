[case]
name = channel

; S2 gate (j): the SAME scalar as turbles.ini on the WALL-BAND 2:1-REFINED
; channel -- the INTERFACE-BAND gate. Geometry, grid, WALE settings and IC are
; exactly ../channel_interface/les (slab.ini): coarse 64x48x64 at Re_tau 180,
; with symmetric wall bands refined 2:1; deliberately UNDER-resolved
; so the SGS term is active (nut peaks ~5x molecular). The velocity restart
; is that campaign's developed t = 25 field, so only the SCALAR has to
; develop here.
;
; Scalar setup: ANTISYMMETRIC isothermal walls (theta = +1 at y = 0, -1 at
; y = 2) and NO source. In statistical steady state that makes the TOTAL
; wall-normal flux
;     J = <v'theta'> - (D + nut/Pr_t) d<theta>/dy
; exactly CONSTANT across the channel -- the constant-flux layer Kader's
; correlation and the thermal log law assume, and an internal consistency
; gate in its own right (check_scalar_turb.py). theta_tau = J/u_tau = J
; (u_tau = 1 by construction), and theta+ = (theta_wall - theta)/theta_tau.
;
; The restart is that campaign's t = 24.8 snapshot with a theta field seeded
; by make_theta_ic.py (the Reynolds analogy of the snapshot's OWN mean
; velocity -- see its header for why that is not circular with the Kader
; gate); init_profile = linear_y below is the fallback the solver would use
; if the dataset were absent.
;
; RESTART CHOICE: the campaign's t = 24.8 snapshot, NOT its final t = 25.0
; file -- the latter's stored pn carries the O(1e6) velocity-neutral
; projection mode the niter = 6 runs accumulate (the channel pn-drift family,
; CLAUDE.md A2), and restarting on it blows the run up in one step. Every
; mid-run snapshot has |pn| ~ 10.
;   python3 make_theta_ic.py \
;       ../channel_interface/les/runs/slab/stats/slab_49600.h5 IC_turbslab.h5

[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.0
small_noise_amplitude = 0.0
stats_sample_interval = 0
stats_write_interval = 0

[grid]
nx = 64
ny = 48
nz = 64
lx = 12.566370614359172
ly = 2.0
lz = 6.283185307179586

[grid.x]
distribution = uniform
[grid.y]
distribution = natural
stretch = 16
natural_dyw_plus = 0.5
[grid.z]
distribution = uniform

[blocks]
nb = 8
; The ../channel_interface/les slab geometry: two full-x,z wall boxes -> flat
; y-interfaces (no edges) at y+ ~ 88 and its mirror. The interface-band gate
; compares this run's theta and theta'-rms profiles against the matched
; UNREFINED control (turbles.ini) across those interfaces.
refine = -1.0 13.0 -1.0 0.2910383862728262 -1.0 7.0
refine = -1.0 13.0 1.708961613727174 3.0 -1.0 7.0
refine_levels = 1

[flow]
re = 180.0
forcing_x = 1.0

[scalar]
count = 1

[scalar.1]
name = theta
pr = 0.71
prt = 0.85
prt_model = constant
init_profile = linear_y
y_min_type = dirichlet
y_min_value = 1.0
y_max_type = dirichlet
y_max_value = -1.0

[time]
dt = 1.0e-5
t_final = 40.0
nsteps = 100000000
cflmax = 0.8
pecletmax = 0.5
dtmax = 5.0e-4

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[output]
field_interval = 0
field_prefix = turbslab

[mpi]
dims = 1 1 1

[restart]
file = IC_turbslab.h5

[les]
model = wale
