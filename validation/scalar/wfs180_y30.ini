[case]
name = channel

; S5a gate (w)/(x): the THERMAL WALL FUNCTION on a wall-function grid.
;
; ../rans_sst/wf180_y30.ini -- the T3 wall-function channel (Re_tau 180,
; forcing_x = 1 so u_tau = 1, uniform y, ny = 6 -> y+_1 = 30) -- with the
; turbsst scalar pair bolted on: antisymmetric isothermal walls (+1 / -1),
; Pr = 0.71, so in steady state the total wall-normal flux J is constant and
; theta_tau = J(wall) with u_tau = 1. `theta` runs the constant Pr_t,
; `theta_kc` the Kays-Crawford correlation, which the thermal wall function
; does NOT use at wall cells (P and the log layer are defined with a constant
; Pr_t) but which keeps running in the interior -- so the pair also gates
; that the two treatments coexist.
;
; ny is not nb-divisible for every member of the sweep, so [blocks] nb is
; unset throughout (one block per rank box, the Phase-1 default), exactly as
; in the T3 sweep.
;
; The run is step-bound (nsteps, t_final out of reach) so the sample steps
; are known in advance: the driver switches the [scalar] statistics on with
; an interval that puts every sample in the converged tail. Cold start --
; the T3 sweep showed t = 200 is ample for the velocity fixed point, and the
; thermal field relaxes on L^2/(pi^2 D_eff) ~ 4 t.u.

[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.0
small_noise_amplitude = 0.0
stats_sample_interval = 0
stats_write_interval = 0

[grid]
nx = 8
ny = 6
nz = 8
lx = 3.141592653589793
ly = 2.0
lz = 1.5707963267948966

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[flow]
re = 180.0
forcing_x = 1.0

[scalar]
count = 2
stats_sample_interval = 0
stats_write_interval = 0
stats_file = wfs180_y30_stats.h5
stats_layout = profile

[scalar.1]
name = theta
pr = 0.71
prt = 0.85
prt_model = constant
init_profile = linear_y
y_min_type = dirichlet
y_min_value = 1.0
y_max_type = dirichlet
y_max_value = -1.0

[scalar.2]
name = theta_kc
pr = 0.71
prt = 0.85
prt_model = kays
init_profile = linear_y
y_min_type = dirichlet
y_min_value = 1.0
y_max_type = dirichlet
y_max_value = -1.0

[time]
dt = 1.0e-4
t_final = 1000.0
nsteps = 20000
cflmax = 0.5
pecletmax = 0.4
dtmax = 5.0e-2

[pressure]
niter = 6
sor = 0.8

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[turbulence]
model = rans

[rans]
model = sst
wall_treatment = wall_function
tu = 5.0
nut_ratio = 10.0

[output]
field_interval = 20000
field_prefix = wfs180_y30
