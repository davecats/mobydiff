[case]
name = channel

; S4 gate (t)/(u): the IN-SOLVER passive-scalar statistics.
;
; The case is `turbles.ini` (the S2 developed LES channel at Re_tau 180,
; 64x48x64 WALE, deliberately under-resolved so nut is genuinely active)
; restarted from one of that campaign's mid-run snapshots, with the [scalar]
; statistics switched on. TWO scalars, differing ONLY in the Pr_t model, so
; one run gates the multi-scalar column layout AND the Kays-Crawford branch
; of the face diffusivity inside the statistics kernel:
;   theta     prt_model = constant   (the developed field, restarted)
;   theta_kc  prt_model = kays       (absent from the restart file -> the
;                                     solver warns and reinitialises it from
;                                     init_profile = linear_y, which is a
;                                     perfectly good field to take statistics
;                                     of, and re-exercises the S0 restart path)
;
; The gate is that check_scalar_stats.py, recomputing the same seven columns
; from the SNAPSHOTS the same run wrote, reproduces the solver's rows to
; round-off: the solver samples the end-of-step field, and the snapshot IS
; the end-of-step field, so there is no statistical tolerance to hide in.
;
; RESTART CHOICE: a mid-run snapshot, NOT the campaign's final file -- see
; the LANDMINE in docs/next_session_scalar.md (the niter = 6 pn drift).
; `turbles_67600.h5` is one of the snapshots `./run_gates_s2.sh les` writes
; (the S2 developed-channel campaign); any of its mid-run files will do --
; point [restart] at one that exists and shift the step numbers in
; run_gates_s4.sh with it.

[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.0
small_noise_amplitude = 0.0
stats_sample_interval = 0
stats_write_interval = 0

[grid]
nx = 64
ny = 48
nz = 64
lx = 12.566370614359172
ly = 2.0
lz = 6.283185307179586

[grid.x]
distribution = uniform
[grid.y]
distribution = natural
stretch = 16
natural_dyw_plus = 0.5
[grid.z]
distribution = uniform

[blocks]
nb = 8

[flow]
re = 180.0
forcing_x = 1.0

[scalar]
count = 2
stats_sample_interval = 10
stats_write_interval = 10
stats_file = s4stats.h5
stats_layout = profile

[scalar.1]
name = theta
pr = 0.71
prt = 0.85
prt_model = constant
init_profile = linear_y
y_min_type = dirichlet
y_min_value = 1.0
y_max_type = dirichlet
y_max_value = -1.0

[scalar.2]
name = theta_kc
pr = 0.71
prt = 0.85
prt_model = kays
init_profile = linear_y
y_min_type = dirichlet
y_min_value = 1.0
y_max_type = dirichlet
y_max_value = -1.0

[time]
dt = 1.0e-5
t_final = 40.0
nsteps = 40
cflmax = 0.8
pecletmax = 0.5
dtmax = 5.0e-4

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[output]
field_interval = 10
field_prefix = s4stats

[mpi]
dims = 1 1 1

[restart]
file = turbles_67600.h5

[les]
model = wale
