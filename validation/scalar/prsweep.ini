[case]
name = generic

; S1 gate (e): Pr SWEEP (0.1 / 1 / 10) in a LAMINAR CHANNEL. A forced
; laminar Poiseuille flow (re = 10, forcing_x = 1, no-slip y walls, periodic
; x/z) carries a scalar that starts at 0 with both walls held at 1. The
; scalar field is a function of y only and the streamwise velocity does not
; vary in x, so the discrete convection term vanishes IDENTICALLY -- the
; transient is pure conduction at diffusivity D = 1/(Re Pr) while a real
; flow is being advanced, i.e. it isolates the Pr scaling of the diffusion
; and checks that the transport kernel does not corrupt it. The analytic
; solution is the series
;   s(y,t) = 1 - sum_{n odd} (4/(n pi)) sin(n pi y/L) exp(-D (n pi/L)^2 t),
; and the wall flux D (s_w - s_1)/y_1 is the Nusselt-like check
; (check_scalar.py profile). run_gates.sh sweeps pr = 0.1 / 1 / 10.
[grid]
nx = 8
ny = 64
nz = 8
lx = 1.0
ly = 2.0
lz = 1.0

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[ibm]
enabled = false

[flow]
re = 10.0
forcing_x = 1.0

[scalar]
count = 1

[scalar.1]
name = s1
pr = 1.0
initial = 0.0
y_min_type = dirichlet
y_min_value = 1.0
y_max_type = dirichlet
y_max_value = 1.0

[time]
dt = 1.0e-5
t_final = 2.0
nsteps = 100000000
cflmax = 0.5
pecletmax = 0.4
dtmax = 1.0e-2

[pressure]
niter = 20
sor = 0.8

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[output]
field_interval = 0
field_prefix = prsweep
