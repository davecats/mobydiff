; RANS T3 gate (a): the turb180 channel deliberately coarsened to a
; wall-function grid — uniform y, ny = 6 -> y+_1 = 30 (Re_tau 180,
; forcing_x = 1, u_tau = 1). ny = 6 is not nb-divisible, so [blocks] nb is
; unset (one block per rank box, the Phase-1 default). Checked by
; rans_channel_check.py --mode wallfn against the resolved turb180
; reference (which carries the DNS centreline anchor 18.20 to 0.2%).

[case]
name = channel

[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.0
small_noise_amplitude = 0.0
stats_sample_interval = 0
stats_write_interval = 0

[grid]
nx = 8
ny = 6
nz = 8
lx = 3.141592653589793
ly = 2.0
lz = 1.5707963267948966

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[flow]
re = 180.0
forcing_x = 1.0

[time]
dt = 1.0e-4
t_final = 200.0
nsteps = 100000000
cflmax = 0.5
pecletmax = 0.4
dtmax = 5.0e-2

[pressure]
niter = 6
sor = 0.8

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[turbulence]
model = rans

[rans]
model = sst
wall_treatment = wall_function
tu = 5.0
nut_ratio = 10.0

[output]
field_interval = 0
field_prefix = wf180_y30

; S2 gate (k): [scalar] + [rans] wall_treatment = wall_function must be a HARD
; CONFIG ERROR (a thermal wall function -- Kader/Jayatilleke -- is increment
; S5). This is ../rans_sst/wf180_y30.ini, the validated T3 wall-function gate
; case, with one scalar bolted on: the solver must refuse to start.
[scalar]
count = 1

[scalar.1]
name = theta
pr = 0.71
