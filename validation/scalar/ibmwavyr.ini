[case]
name = generic

; S3 gate (q): the same wavy body under GEOMETRY-DRIVEN REFINEMENT
; (refine_body, 2 levels), with the same two scalar modes. What it gates:
;   * the cell-centred coefficients are evaluated at EACH LEAF'S OWN LEVEL --
;     checked against an independent transcription of the graded formula
;     (check_scalar_ibm.py coefp), level by level;
;   * the prepared coef_p_blocks tiles and the solver's inline analytic
;     VAR_P pass agree to the last bit at every level (the solve-from-file
;     vs inline comparison, tolerance 0, on theta and phi as well as u,v,w,p).
; Conservation is NOT gated here: across a 2:1 interface the flux form
; telescopes only approximately (S1 note in README.md).

[grid]
nx = 32
ny = 32
nz = 8
lx = 1.0
ly = 0.25
lz = 0.25

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8
refine_body = true
refine_levels = 1

[ibm]
enabled = true

[flow]
re = 100.0
forcing_x = 1.0

[scalar]
count = 2

[scalar.1]
name = theta
pr = 0.71
ibm_wall = dirichlet
ibm_value = 1.0

[scalar.2]
name = phi
pr = 1.0
ibm_wall = adiabatic
initial = 0.5

[time]
dt = 1.0e-4
nsteps = 50
t_final = 0.0
cflmax = 0.0
pecletmax = 0.0
dtmax = 1.0e-4

[pressure]
niter = 20
sor = 0.8

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[output]
field_interval = 50
field_prefix = ibmwavyr
