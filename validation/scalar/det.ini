[case]
name = generic

; S1 determinism + 2:1-interface gate: conserve.ini with a refined y slab
; (the Beltrami y-slab layout) -- 1 rank == 4 ranks EXACT, CPU == GPU EXACT,
; and the measured interface conservation residual (informative: the flux
; telescoping is exact only across matching faces).
; Fully periodic box, decaying Beltrami flow (an exact NS solution, so the
; advecting field is a genuine 3D flow), one passive scalar seeded with a
; manufactured s = sin(k.x) through the restart path (make_scalar_ic.py).
[grid]
nx = 32
ny = 32
nz = 32
lx = 6.283185307179586
ly = 6.283185307179586
lz = 6.283185307179586

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8
refine = -1.0 10.0 1.6 4.7 -1.0 10.0
refine_levels = 1

[ibm]
enabled = false

[flow]
initial = beltrami
re = 100.0

[scalar]
count = 1

[scalar.1]
name = s1
pr = 0.71

[time]
dt = 2.0e-3
nsteps = 20
t_final = 0.0
cflmax = 0.0
pecletmax = 0.0
dtmax = 2.0e-3

[pressure]
niter = 40
sor = 0.8

[boundary]
periodic_x = true
periodic_y = true
periodic_z = true

[output]
field_interval = 20
field_prefix = det
