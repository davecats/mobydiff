[case]
name = generic

; S1 gate (a): UNIFORM SCALAR preservation through a 3-level refined block
; layout, the scalar analogue of the uniform-flow interface gate. Exactly
; validation/multilevel_body/uniform.ini (uniform oblique u,v,w through the
; cylinder-shaped 3-level leaf table on the ZERO-FORCE twin, so the body
; shapes the layout but exerts no force) with two passive scalars of
; different Prandtl numbers riding along at constant values. Every l0-l1 and
; l1-l2 interface, edge and corner is crossed; the restrict/prolong/ghost-
; blend transfers, the physical inlet (Dirichlet) and outlet (zero-gradient)
; ghosts and the transport kernel must ALL preserve the constants EXACTLY.
[grid]
nx = 128
ny = 128
nz = 8
lx = 16.0
ly = 16.0
lz = 0.25

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8
refine_body = true
refine_levels = 2

[ibm]
enabled = true
coeff_file = ../multilevel_body/ibm_coeff_ml3_zero.h5

[flow]
re = 40.0
initial_u = 0.9396926207859084
initial_v = 0.3420201433256687
initial_w = 0.2

[scalar]
count = 2

[scalar.1]
name = theta
pr = 0.71
initial = 2.5
inlet = 2.5

[scalar.2]
name = phi
pr = 10.0
initial = -1.25
inlet = -1.25

[time]
dt = 1.0e-3
nsteps = 50
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 1.0e-3

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = false
periodic_y = false
periodic_z = true
x_min_patch = inlet
x_min_u_value = 0.9396926207859084
x_min_v_value = 0.3420201433256687
x_min_w_value = 0.2
y_min_patch = inlet
y_min_u_value = 0.9396926207859084
y_min_v_value = 0.3420201433256687
y_min_w_value = 0.2
y_max_patch = inlet
y_max_u_value = 0.9396926207859084
y_max_v_value = 0.3420201433256687
y_max_w_value = 0.2
x_max_patch = outlet

[output]
field_interval = 0
field_prefix = uniform3
