[case]
name = channel

; S2 gate (i): passive scalars under k-omega SST with RESOLVED walls --
; ../rans_sst/turb180.ini (the validated T2 gate case, Re_tau 180, y+_1 ~ 0.5)
; with two scalars added. Steady RANS collapses to a 1D profile, so this is a
; cheap, fully deterministic gate: no time averaging, no turbulence
; statistics, and the answer is a fixed point of the discrete operator.
;
; Scalars: antisymmetric isothermal walls (+1 / -1), no source, so the total
; wall-normal flux J = -(1/(Re Pr) + nut/Pr_t) d<theta>/dy is CONSTANT and
; theta+ = (theta_w - theta)/theta_tau, theta_tau = J (u_tau = 1). In the log
; layer nut = kappa u_tau y gives d(theta+)/d(ln y+) = Pr_t/kappa = 2.073 at
; Pr_t = 0.85 -- the slope this gate measures (Kader's fit reads 2.12).
;
; theta (s1) uses the constant Pr_t; theta_kc (s2) is the SAME scalar with
; prt_model = kays, so the two profiles differ ONLY by the Kays-Crawford
; correlation -- the in-kernel exercise of prt_kays (unit-tested host-side by
; src/test_scalar.f90). Kays-Crawford raises Pr_t toward 2 Prt_inf where
; Pe_t = nut Re Pr is small (near the wall), i.e. it DAMPS the eddy
; diffusivity there, so theta_kc+ must sit ABOVE theta+ and converge to it in
; the core where Pe_t is large.

[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.0
small_noise_amplitude = 0.0
stats_sample_interval = 0
stats_write_interval = 0

[grid]
nx = 8
ny = 96
nz = 8
lx = 3.141592653589793
ly = 2.0
lz = 1.5707963267948966

[grid.x]
distribution = uniform
[grid.y]
distribution = natural
stretch = 16
natural_dyw_plus = 0.5
[grid.z]
distribution = uniform

[blocks]
nb = 8

[flow]
re = 180.0
forcing_x = 1.0

[scalar]
count = 2

[scalar.1]
name = theta
pr = 0.71
prt = 0.85
prt_model = constant
init_profile = linear_y
y_min_type = dirichlet
y_min_value = 1.0
y_max_type = dirichlet
y_max_value = -1.0

[scalar.2]
name = theta_kc
pr = 0.71
prt = 0.85
prt_model = kays
init_profile = linear_y
y_min_type = dirichlet
y_min_value = 1.0
y_max_type = dirichlet
y_max_value = -1.0

[time]
dt = 1.0e-4
t_final = 200.0
nsteps = 100000000
cflmax = 0.5
pecletmax = 0.4
dtmax = 5.0e-2

[pressure]
niter = 6
sor = 0.8

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[turbulence]
model = rans

[rans]
model = sst
tu = 5.0
nut_ratio = 10.0

[output]
field_interval = 0
field_prefix = turbsst
