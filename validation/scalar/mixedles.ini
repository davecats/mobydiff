[case]
name = generic

; The MIXED-MODE scalar case (2026-10-20): one scalar in EACH immersed-body
; mode on the analytic wavy wall of ibmwavy.ini / validation/conjugate/wavy.ini,
; with the flow on.
;   theta  ibm_wall = dirichlet (penalization to ibm_value), Kays-Crawford
;          Pr_t -- the plain kernel's penalization branch and prt_model ladder
;   phi    ibm_wall = adiabatic, Kasagi velocity source -- the plain kernel's
;          six-face masks and the VELOCITY source
;   chi    ibm_wall = conjugate (kappa_s = 5, C_s = 2) -- the conjugate kernel
; A conjugate scalar resolves the unset [scalar] convection to ADVECTIVE for
; every scalar (review F2), so theta and phi run the advective form here.
;
; WALE twin of mixed.ini: nu_t on, so the eddy-diffusivity ladder of BOTH
; kernels runs (the conjugate one keeps nu_t out of the solid and the cut
; faces). Written for the split of scalar_transport_kernel by mode
; (docs/next_session_code_simplification.md item 1): until then no case had
; one plain AND one conjugate scalar, so the two kernels' scalar LISTS were
; unexercised. In run_bitexact_s3.sh's list; the LES twin is mixedles.ini.

[grid]
nx = 32
ny = 32
nz = 8
lx = 1.0
ly = 0.25
lz = 0.25

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8
remove_solid = false

[ibm]
enabled = true

[flow]
re = 100.0
forcing_x = 1.0

[scalar]
count = 3

[scalar.1]
name = theta
pr = 0.71
prt_model = kays
ibm_wall = dirichlet
ibm_value = 1.0

[scalar.2]
name = phi
pr = 1.0
ibm_wall = adiabatic
source_type = velocity
source = 1.0

[scalar.3]
name = chi
pr = 0.71
ibm_wall = conjugate
solid_k = 5.0
solid_rhocp = 2.0
initial = 1.0
solid_init = 0.0

[turbulence]
model = les

[les]
model = wale
ibm_aware = true

[time]
dt = 2.0e-4
nsteps = 200
t_final = 0.0
cflmax = 0.0
pecletmax = 0.0
dtmax = 2.0e-4

[pressure]
niter = 40
sor = 0.8

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[output]
field_interval = 200
field_prefix = mixedles
