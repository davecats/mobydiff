[case]
name = channel

; S5a gate (w), the RESOLVED REFERENCE of the thermal wall function.
;
; This is `turbsst.ini` verbatim -- the S2/S4 resolved-wall SST scalar
; channel (Re_tau 180, natural y, y+_1 ~ 0.5, two scalars differing only in
; the Pr_t model) -- restarted from that campaign's converged t = 200 field
; with the S4 STATISTICS switched on. It supplies theta_tau and the wall
; flux the wall-function sweep is gated against, read out of the solver's
; own statistics rather than post-processed by hand (which is what S4 was
; built for), so reference and gate are measured by the same instrument.
;
; Steady RANS is a fixed point, so a short leg with two samples is the whole
; statistic: the run adds 200 steps to the converged field and samples at
; steps 100 and 200 (the driver rewrites the intervals; they are 0 here so
; the committed ini is an ordinary continuation run).

[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.0
small_noise_amplitude = 0.0
stats_sample_interval = 0
stats_write_interval = 0

[grid]
nx = 8
ny = 96
nz = 8
lx = 3.141592653589793
ly = 2.0
lz = 1.5707963267948966

[grid.x]
distribution = uniform
[grid.y]
distribution = natural
stretch = 16
natural_dyw_plus = 0.5
[grid.z]
distribution = uniform

[blocks]
nb = 8

[flow]
re = 180.0
forcing_x = 1.0

[scalar]
count = 2
stats_sample_interval = 0
stats_write_interval = 0
stats_file = wfsst_stats.h5
stats_layout = profile

[scalar.1]
name = theta
pr = 0.71
prt = 0.85
prt_model = constant
init_profile = linear_y
y_min_type = dirichlet
y_min_value = 1.0
y_max_type = dirichlet
y_max_value = -1.0

[scalar.2]
name = theta_kc
pr = 0.71
prt = 0.85
prt_model = kays
init_profile = linear_y
y_min_type = dirichlet
y_min_value = 1.0
y_max_type = dirichlet
y_max_value = -1.0

[time]
dt = 1.0e-4
t_final = 1000.0
nsteps = 200
cflmax = 0.5
pecletmax = 0.4
dtmax = 5.0e-2

[pressure]
niter = 6
sor = 0.8

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[turbulence]
model = rans

[rans]
model = sst
tu = 5.0
nut_ratio = 10.0

[output]
field_interval = 200
field_prefix = wfsst

[restart]
file = turbsst_186711.h5
