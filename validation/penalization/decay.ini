[case]
name = generic
file = decay.case.h5

; Time accuracy of the penalization factor, isolated (numerics review F7,
; step 9). A triply periodic box, UNIFORM velocity, a uniform body force f
; and a UNIFORM moderate penalization coefficient lambda: convection,
; diffusion and the pressure correction vanish identically, and the solver
; integrates
;
;     du/dt = f - lambda u,   u(t) = u0 e^{-lambda t} + (f/lambda)(1 - e^{-lambda t}).
;
; The exact factor (ibm.f90 penal_incr_factor / penal_state_factor) must
; reproduce it to round-off at ANY dt -- the right-hand side is frozen over
; a substage exactly as the factor assumes -- where the implicit-Euler factor
; it replaced was first order. run_decay.sh prepares the case file, then
; OVERWRITES the coefficient tiles with the uniform lambda: the analytic wall
; below exists only so that moby_prepare writes tiles at all.

[grid]
nx = 8
ny = 8
nz = 8
lx = 1.0
ly = 1.0
lz = 1.0

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8
remove_solid = false

[ibm]
enabled = true

[flow]
re = 1000.0
initial_u = 1.0
forcing_x = 1.0

[time]
dt = 0.04
dtmax = 0.04
nsteps = 5
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5

[pressure]
niter = 4
sor = 0.8

[boundary]
periodic_x = true
periodic_y = true
periodic_z = true

[output]
field_interval = 5
field_prefix = decay
