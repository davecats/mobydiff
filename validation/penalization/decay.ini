[case]
name = generic
file = decay.case.h5

; Time accuracy of the penalization factor, isolated (numerics review F7).
; A triply periodic box, UNIFORM velocity, a uniform body force f and a
; UNIFORM moderate penalization coefficient lambda: convection, diffusion and
; the pressure correction vanish identically, and the solver integrates
;
;     du/dt = f - lambda u,   u(t) = u0 e^{-lambda t} + (f/lambda)(1 - e^{-lambda t}).
;
; The rational factors (ibm.f90 penal_incr_factor / penal_state_factor: e^x
; replaced by its third-order Taylor polynomial) integrate it at THIRD order;
; the implicit-Euler factor they replaced was first order, and the exact
; exponential (step 9, 878868f) integrated this frozen right-hand side to
; round-off. The passive scalar is the same problem for the Dirichlet scalar
; penalization (scalar.f90):
;
;     ds/dt = S - lambda (s - s_body),    lambda = coef_p/Pr.
;
; run_decay.sh prepares the case file, then OVERWRITES the coefficient tiles
; with the uniform lambda (coef_p with lambda*Pr): the analytic wall below
; exists only so that moby_prepare writes tiles at all.

[grid]
nx = 8
ny = 8
nz = 8
lx = 1.0
ly = 1.0
lz = 1.0

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8
remove_solid = false

[ibm]
enabled = true

[flow]
re = 1000.0
initial_u = 1.0
forcing_x = 1.0

[scalar]
count = 1

[scalar.1]
name = theta
pr = 0.5
initial = 1.0
source = 1.0
ibm_wall = dirichlet
ibm_value = 0.25

[time]
dt = 0.04
dtmax = 0.04
nsteps = 5
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5

[pressure]
niter = 4
sor = 0.8

[boundary]
periodic_x = true
periodic_y = true
periodic_z = true

[output]
field_interval = 5
field_prefix = decay
