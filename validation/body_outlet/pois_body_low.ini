[case]
name = generic

; The MIRROR of pois_body.ini: inlet at x_max (u = -1), outlet at x_min --
; the outlet on a LOW face with the immersed walls crossing it. Must equal
; the x_max case under x -> lx - x (check_body_outlet.py mirror).
[grid]
nx = 64
ny = 48
nz = 4
lx = 4.0
ly = 1.5
lz = 0.125

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 4
remove_solid = true

[ibm]
enabled = true
stl_file = slabs_y.stl

[flow]
re = 10.0
forcing_x = 0.0

[time]
dt = 2.0e-3
nsteps = 20000
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 2.0e-3

[pressure]
niter = 12
accel = chebyshev

[boundary]
periodic_x = false
periodic_y = false
periodic_z = true
x_max_patch = inlet
x_max_u_value = -1.0
x_min_patch = outlet
y_min_patch = wall
y_max_patch = wall

[output]
field_interval = 0
field_prefix = pois_body_low
