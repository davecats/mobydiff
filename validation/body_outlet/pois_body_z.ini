[case]
name = generic

; pois_body.ini under the permutation (x, y, z) -> (z, y, x): the stream
; along z, the immersed walls normal to y (slabs_yz.stl), x periodic. Inlet
; at z_min (w = 1), outlet at z_max (the wn_zmax restart plane). Must equal
; the x case under the permutation.
[grid]
nx = 4
ny = 48
nz = 64
lx = 0.125
ly = 1.5
lz = 4.0

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 4
remove_solid = true

[ibm]
enabled = true
stl_file = slabs_yz.stl

[flow]
re = 10.0
forcing_x = 0.0

[time]
dt = 2.0e-3
nsteps = 20000
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 2.0e-3

[pressure]
niter = 12
accel = chebyshev

[boundary]
periodic_x = true
periodic_y = false
periodic_z = false
z_min_patch = inlet
z_min_w_value = 1.0
z_max_patch = outlet
y_min_patch = wall
y_max_patch = wall

[output]
field_interval = 0
field_prefix = pois_body_z
