[case]
name = generic

; Body-at-outlet gate (docs/next_session_body_at_outlet.md): Poiseuille flow
; between two IMMERSED plane walls (slabs_y.stl: solid below y = 0.259375
; and above 1.259375, both 0.3 dy off a cell face, gap exactly 1.0) that
; cross the inlet AND the outlet plane. Uniform inlet u = 1 at x_min
; (B2 zeroes it inside the slabs), Dirichlet-pressure outlet at x_max,
; re = 10 so the profile is developed long before the outlet (entry decay
; ~e^-3.5 per unit length). nb = 4 with remove_solid: the first and the last
; y-block rows are buried and removed, some of them next to the outlet.
; Compared with the periodic twin pois_body_periodic.ini (same walls,
; forcing-driven) by check_body_outlet.py.
[grid]
nx = 64
ny = 48
nz = 4
lx = 4.0
ly = 1.5
lz = 0.125

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 4
remove_solid = true

[ibm]
enabled = true
stl_file = slabs_y.stl

[flow]
re = 10.0
forcing_x = 0.0

[time]
dt = 2.0e-3
nsteps = 20000
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 2.0e-3

[pressure]
niter = 12
accel = chebyshev

[boundary]
periodic_x = false
periodic_y = false
periodic_z = true
x_min_patch = inlet
x_min_u_value = 1.0
x_max_patch = outlet
y_min_patch = wall
y_max_patch = wall

[output]
field_interval = 0
field_prefix = pois_body
