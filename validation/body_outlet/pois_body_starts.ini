[case]
name = generic

; The limit "the body STARTS at the plane" (slabs_starts.stl: the slabs
; exist only for x >= 3.97, so the outlet face at 4.0 is solid and its
; neighbour at 3.9375 fluid): r ~ 1e-27, the face dies like any solid DOF.
; Stable, mass balance, solid faces at round-off.
[grid]
nx = 64
ny = 48
nz = 4
lx = 4.0
ly = 1.5
lz = 0.125

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 4
remove_solid = true

[ibm]
enabled = true
stl_file = slabs_starts.stl

[flow]
re = 10.0
forcing_x = 0.0

[time]
dt = 2.0e-3
nsteps = 20000
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 2.0e-3

[pressure]
niter = 12
accel = chebyshev

[boundary]
periodic_x = false
periodic_y = false
periodic_z = true
x_min_patch = inlet
x_min_u_value = 1.0
x_max_patch = outlet
y_min_patch = wall
y_max_patch = wall

[output]
field_interval = 0
field_prefix = pois_body_starts
