[case]
name = generic

; The PERIODIC twin of pois_body.ini: same grid, same immersed walls,
; x periodic, driven by forcing_x = 12 nu U/h^2 = 1.2 (bulk velocity 1 over
; the gap of 1). Its developed profile is what the inflow/outflow case must
; reproduce at the outlet (check_body_outlet.py profile).
[grid]
nx = 64
ny = 48
nz = 4
lx = 4.0
ly = 1.5
lz = 0.125

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 4
remove_solid = true

[ibm]
enabled = true
stl_file = slabs_y.stl

[flow]
re = 10.0
forcing_x = 1.2

[time]
dt = 2.0e-3
nsteps = 20000
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 2.0e-3

[pressure]
niter = 12
accel = chebyshev

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true
y_min_patch = wall
y_max_patch = wall

[output]
field_interval = 0
field_prefix = pois_body_periodic
