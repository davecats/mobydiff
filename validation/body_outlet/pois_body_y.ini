[case]
name = generic

; pois_body.ini under the permutation (x, y, z) -> (y, x, z): the stream
; along y, the immersed walls normal to x (slabs_x.stl), z periodic. Inlet
; at y_min (v = 1), outlet at y_max -- a HIGH outlet in y, exercising the
; vn_ymax restart plane. Must equal the x case under the permutation.
[grid]
nx = 48
ny = 64
nz = 4
lx = 1.5
ly = 4.0
lz = 0.125

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 4
remove_solid = true

[ibm]
enabled = true
stl_file = slabs_x.stl

[flow]
re = 10.0
forcing_x = 0.0

[time]
dt = 2.0e-3
nsteps = 20000
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 2.0e-3

[pressure]
niter = 12
accel = chebyshev

[boundary]
periodic_x = false
periodic_y = false
periodic_z = true
y_min_patch = inlet
y_min_v_value = 1.0
y_max_patch = outlet
x_min_patch = wall
x_max_patch = wall

[output]
field_interval = 0
field_prefix = pois_body_y
