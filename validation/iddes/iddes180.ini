; IDDES T5 gates (a)/(b) -- WMLES-style developed channel, Re_tau 180, on
; the LES-validation coarse grid (64x48x64: dx+ ~ 35, dz+ ~ 18, y+_1 ~ 0.5
; natural line): too coarse in x/z for wall-resolved LES, so the DDES
; shielding must keep the near-wall layer in RANS mode (f_d -> 1) and hand
; the core to WALE (f_d -> 0). IC = the developed LES field interpolation
; (../channel_interface/les/uniform_IC.h5, no k/omega -> reinit from tu).
;
; run_gates.sh runs two legs: a stats-off transient to t = 5, then the
; statistics leg to t = 25 (channel_stats: per-y mean + resolved stresses)
; restarting from the transient's final field. References: the T2 RANS
; turb180 profile (../rans_sst/turb180_132565.h5) and the pure-WALE stats
; leg (../channel_interface/les/runs/uniform/stats/channel_stats.h5).

[case]
name = channel

[case.channel]
n_walls = 2
natural_blend_index = 16
mean_profile_sine_amplitude = 0.0
large_disturbance_amplitude = 0.0
small_noise_amplitude = 0.0
stats_sample_interval = 50
stats_write_interval = 20000

[grid]
nx = 64
ny = 48
nz = 64
lx = 12.566370614359172
ly = 2.0
lz = 6.283185307179586

[grid.x]
distribution = uniform
[grid.y]
distribution = natural
stretch = 16
natural_dyw_plus = 0.5
[grid.z]
distribution = uniform

[blocks]
nb = 8

[ibm]
enabled = false

[flow]
re = 180.0
forcing_x = 1.0

[time]
dt = 1.0e-5
t_final = 25.0
nsteps = 100000000
cflmax = 0.8
pecletmax = 0.5
dtmax = 5.0e-4

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = true
periodic_y = false
periodic_z = true

[turbulence]
model = iddes

[les]
model = wale

[rans]
model = sst
tu = 5.0
nut_ratio = 10.0

[output]
field_interval = 20000
field_prefix = iddes180

[restart]
file = ../channel_interface/les/uniform_IC.h5
