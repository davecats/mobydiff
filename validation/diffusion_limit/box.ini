[case]
name = generic

; The explicit-diffusion stability limit of the RK3 step, measured: a decaying
; Beltrami flow at Re = 1 in a triply periodic 2*pi box, so that diffusion is
; the only thing that can go unstable (the Courant number stays below 0.15 and
; the flow decays to round-off). run_gate.sh rewrites the grid, dt and the
; limiter keys per leg; this file is the 16^3 fixed-step template.
[grid]
nx = 16
ny = 16
nz = 16
lx = 6.283185307179586
ly = 6.283185307179586
lz = 6.283185307179586

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[ibm]
enabled = false

[flow]
initial = beltrami
re = 1.0

[time]
dt = 1.0e-3
nsteps = 600
t_final = 0.0
cflmax = 0.0
pecletmax = 0.0
dtmax = 1.0e-3

[pressure]
niter = 12
accel = chebyshev

[boundary]
periodic_x = true
periodic_y = true
periodic_z = true

[output]
field_interval = 100
field_prefix = box
