[case]
name = generic

; A3 INCREMENT 0 gate (a): uniform oblique flow (u,v,w all nonzero) through
; the 3-level refine_body leaf layout of the cylinder geometry, with a
; ZERO-coefficient / ZERO-buried twin of the block-table file
; (make_uniform_twin.py): the body drives the block layout but exerts no
; force and buries no block, so the constant field must be preserved
; EXACTLY (max deviation 0.0) across every l0-l1 and l1-l2 interface,
; edge and corner. (u,v) = (cos 20, sin 20), w = 0.2.
[grid]
nx = 128
ny = 128
nz = 8
lx = 16.0
ly = 16.0
lz = 0.25

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8
refine_body = true
refine_levels = 2

[ibm]
enabled = true
coeff_file = ibm_coeff_ml3_zero.h5

[flow]
re = 40.0
initial_u = 0.9396926207859084
initial_v = 0.3420201433256687
initial_w = 0.2

[time]
dt = 1.0e-3
nsteps = 50
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 1.0e-3

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = false
periodic_y = false
periodic_z = true
x_min_patch = inlet
x_min_u_value = 0.9396926207859084
x_min_v_value = 0.3420201433256687
x_min_w_value = 0.2
y_min_patch = inlet
y_min_u_value = 0.9396926207859084
y_min_v_value = 0.3420201433256687
y_min_w_value = 0.2
y_max_patch = inlet
y_max_u_value = 0.9396926207859084
y_max_v_value = 0.3420201433256687
y_max_w_value = 0.2
x_max_patch = outlet

[output]
field_interval = 0
field_prefix = uniform
