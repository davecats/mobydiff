[case]
name = generic

; A3 INCREMENT 0 gate (b): per-level dwall cross-check on the REAL 3-level
; block-table file (cylinder D = 1 at (6.0, 8.02), levels 3). All four x/y
; faces are declared patches (inlet/outlet), so no domain wall is min'ed
; into dwall and the ransgeom dump carries the pure body distance at each
; leaf's own level — checked against an independent exact distance to the
; float32 STL section polygon (check_dwall_cylinder.py). 1 step: only the
; [rans] init matters.
[grid]
nx = 128
ny = 128
nz = 8
lx = 16.0
ly = 16.0
lz = 0.25

[grid.x]
distribution = uniform
[grid.y]
distribution = uniform
[grid.z]
distribution = uniform

[blocks]
nb = 8
refine_body = true
refine_levels = 2

[ibm]
enabled = true
coeff_file = ibm_coeff_ml3.h5

[flow]
re = 40.0
initial_u = 1.0

[time]
dt = 1.0e-5
nsteps = 1
t_final = 0.0
cflmax = 0.8
pecletmax = 0.5
dtmax = 1.0e-5

[pressure]
niter = 6
sor = 0.8
accel = chebyshev

[boundary]
periodic_x = false
periodic_y = false
periodic_z = true
x_min_patch = inlet
x_min_u_value = 1.0
y_min_patch = inlet
y_min_u_value = 1.0
y_max_patch = inlet
y_max_u_value = 1.0
x_max_patch = outlet

[rans]
dump_geometry = true

[output]
field_interval = 0
field_prefix = mlb_dwall
